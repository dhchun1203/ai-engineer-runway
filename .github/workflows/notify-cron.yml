# 학습 알림 매시 트리거.
#
# Vercel Hobby는 크론이 하루 1회만 가능해 사용자가 정한 임의 시각을 못 맞춘다.
# 그래서 정확한 시각 발송은 이 GitHub Actions가 매시 정각에 배포된 크론 엔드포인트를
# 호출해 담당하고, vercel.json의 하루 1회 크론은 이 트리거가 실패한 날의 백업이다.
#
# 발송 여부는 서버(/api/cron/notify)가 판단한다 — 활성화·정한 시각 이후인지·오늘 이미
# 보냈는지·진도가 밀렸는지(앞서면 안 보냄). 이 워크플로는 그저 매시 문을 두드릴 뿐이다.
#
# 필요한 저장소 시크릿: CRON_SECRET (Vercel 환경변수와 같은 값).
#   GitHub 저장소 → Settings → Secrets and variables → Actions → New repository secret

name: notify-cron

on:
  schedule:
    # 매시 정각(UTC). 서버가 서울 기준 시각을 판단하므로 UTC로 매시 두드리면 충분하다.
    - cron: '0 * * * *'
  # 수동 실행(테스트용) — Actions 탭에서 바로 돌려볼 수 있다.
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 크론 엔드포인트 호출
        run: |
          curl -sS --fail-with-body -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ai-engineer-runway-git-master-daehwanchuns-projects.vercel.app/api/cron/notify"
