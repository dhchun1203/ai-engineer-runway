# 21-titanic-eda-missing-values 복습 데이터. 퀴즈 id는 오답 기록 키(cl:<slug>:<id>)라 한 번 정하면 바꾸지 않는다.
# 문항의 코드와 출력은 맥에서 Python 3.14, pandas 3.1.1, NumPy 2.5.5, seaborn 0.13.2로 실제 실행해 확인했다.
slug: 21-titanic-eda-missing-values
quiz:
  - id: info-non-null-count-missing
    q: "df.info() 출력의 일부예요. age 열의 빈칸은 몇 개일까요?"
    code: |-
      RangeIndex: 891 entries, 0 to 890
       #   Column       Non-Null Count  Dtype
       3   age          714 non-null    float64
    options:
      - "714"
      - "891"
      - "177"
      - "0"
    answer: 2
    explain: "Non-Null Count 는 빈칸이 아닌 칸의 수예요. 전체 891행에서 714를 빼면 177칸이 비어 있어요. df.isnull().sum() 으로 세어도 age 177 이 나와요."
  - id: fillna-returns-new-series
    q: "빈칸을 0으로 채운 뒤 빈칸을 다시 셌어요. 출력은?"
    code: |-
      import pandas as pd

      s = pd.Series([1.0, None, 3.0])
      s.fillna(0)
      print(s.isnull().sum())
    options:
      - "0"
      - "1"
      - "3"
      - "TypeError"
    answer: 1
    explain: "fillna 는 채운 새 Series 를 돌려줄 뿐 s 를 바꾸지 않아요. 결과를 받지 않았으니 s 에는 빈칸 1개가 그대로예요. s = s.fillna(0) 이나 df.loc[:, '열'] = df['열'].fillna(값) 처럼 다시 넣어야 해요."
  - id: fillna-mode-series-silent
    q: "최빈값으로 빈칸을 채웠어요. 출력은?"
    code: |-
      import pandas as pd

      town = pd.Series(["S", None, "S", "C"])
      town = town.fillna(town.mode())
      print(town.isnull().sum())
    options:
      - "0"
      - "1"
      - "TypeError"
      - "2"
    answer: 1
    explain: "mode() 는 값 하나가 아니라 인덱스 0 하나뿐인 Series 를 돌려줘요. fillna 에 Series 를 넘기면 같은 행 번호끼리 짝지어 채우는데, 빈칸은 1번 행이라 짝이 없어요. 오류 없이 1개가 남아요. town.mode()[0] 으로 값 하나를 꺼내면 0이 돼요."
  - id: category-new-value-typeerror
    q: "category 열의 빈칸을 'Unknown'으로 채웠어요. 결과는?"
    code: |-
      import pandas as pd

      deck = pd.Series(["C", None, "B"], dtype="category")
      deck = deck.fillna("Unknown")
    options:
      - "['C', 'Unknown', 'B']"
      - "TypeError"
      - "빈칸이 그대로 남는다"
      - "['C', 'C', 'B']"
    answer: 1
    explain: "category 는 들어갈 수 있는 값 목록(categories)이 정해진 타입이에요. 목록에 없는 'Unknown' 은 TypeError: Cannot setitem on a Categorical with a new category 로 거절돼요. deck.cat.add_categories('Unknown').fillna('Unknown') 처럼 목록부터 늘려요."
  - id: str-first-char-keeps-nan
    q: "글자마다 첫 글자를 꺼냈어요. 출력은?"
    code: |-
      import pandas as pd

      town = pd.Series(["Southampton", None, "Cherbourg"])
      print(town.str[0].tolist())
    options:
      - "['S', 'N', 'C']"
      - "['S', nan, 'C']"
      - "['S', '', 'C']"
      - "TypeError"
    answer: 1
    explain: ".str[0] 은 문자열마다 첫 글자를 꺼내고, 원본이 빈칸(NaN)이면 결과도 NaN 이에요. 그래서 embark_town 을 먼저 채워야 embarked 도 채워져요."
  - id: iqr-upper-bound
    q: "IQR 규칙으로 상한선과 튀는 값의 수를 구했어요. 출력은?"
    code: |-
      import pandas as pd

      fare = pd.Series([5, 8, 10, 20, 32, 40, 300])
      q1 = fare.quantile(0.25)
      q3 = fare.quantile(0.75)
      upper = q3 + 1.5 * (q3 - q1)
      print(upper, (fare > upper).sum())
    options:
      - "76.5 1"
      - "36.0 2"
      - "54.0 1"
      - "76.5 2"
    answer: 0
    explain: "Q1 은 25% 지점 9.0, Q3 은 75% 지점 36.0 이에요. IQR = 36 - 9 = 27, 상한선 = 36 + 1.5 × 27 = 76.5 예요. 76.5 를 넘는 값은 300 하나라 (fare > upper).sum() 이 1 이에요."
  - id: filter-needs-reassign
    q: "요금이 512 미만인 행만 남기려고 했어요. 출력은?"
    code: |-
      import pandas as pd

      df = pd.DataFrame({"fare": [7.25, 71.28, 512.33, 8.05]})
      df[df["fare"] < 512]
      print(len(df))
    options:
      - "3"
      - "4"
      - "1"
      - "KeyError"
    answer: 1
    explain: "df[조건] 은 조건에 맞는 행만 남긴 새 표를 돌려줄 뿐 df 를 바꾸지 않아요. 지우려면 df = df[df[\"fare\"] < 512].copy() 처럼 다시 넣어야 해요. 수업에서는 이렇게 891행이 888행이 됐어요."
  - id: duplicated-first-row-false
    q: "중복 행을 셌어요. 출력은?"
    code: |-
      import pandas as pd

      d = pd.DataFrame({"sex": ["male", "male", "female", "male"],
                        "age": [30, 30, 22, 30]})
      print(d.duplicated().sum(), d.duplicated(keep=False).sum())
    options:
      - "3 3"
      - "2 2"
      - "2 3"
      - "3 2"
    answer: 2
    explain: "duplicated() 는 앞에 모든 열이 같은 행이 있을 때 True 라 묶음의 첫 행(0번)은 False, 1번과 3번만 True 예요. keep=False 는 첫 행까지 묶음 전부를 True 로 보여 줘서 3이에요."
  - id: mean-fill-histogram-spike
    q: "나이 빈칸 177개를 모두 평균 29.7로 채운 뒤 히스토그램(bins=20)을 그렸어요. 어떤 모양이 될까요?"
    options:
      - "모든 막대가 고르게 조금씩 높아진다"
      - "29.7이 든 구간의 막대 하나만 우뚝 솟는다"
      - "채우기 전과 똑같다"
      - "막대가 20개에서 21개로 늘어난다"
    answer: 1
    explain: "177명이 모두 같은 값 29.7 이 되어 28.3~32.3세 구간에만 들어가요. 수업에서 그 막대가 261명으로 솟았고 다른 구간은 많아야 98명이었어요. 한 값으로 채우면 분포가 그 값 한 곳으로 쏠려요(중앙값 28 로 채워도 마찬가지)."
  - id: deck-unknown-not-mode
    q: "deck 열은 891행 중 688행(77%)이 비어 있어요. 수업에서 최빈값 대신 'Unknown'으로 채운 이유는?"
    options:
      - "category 열은 최빈값을 구할 수 없어서"
      - "대부분이 빈칸이라 다른 값으로 채우면 없는 정보를 지어내게 되어서"
      - "'Unknown'이 A~G 목록에 원래 있어서"
      - "글자 열은 항상 'Unknown'으로 채우는 규칙이라서"
    answer: 1
    explain: "77% 가 빈 열을 최빈값 C 로 채우면 688명이 C 갑판에 있었다고 지어내는 셈이에요. 그래서 '모름'을 뜻하는 'Unknown' 으로 채웠어요. 'Unknown' 은 원래 목록에 없어서 cat.add_categories 로 먼저 넣어야 했어요. embark_town 처럼 빈칸이 2개뿐인 글자 열은 최빈값으로 채웠어요."
commands:
  - cmd: "uv add seaborn matplotlib"
    desc: "시각화 도구 seaborn 과 그래프 바탕 도구 matplotlib 설치"
    group: uv
  - cmd: "import seaborn as sns"
    desc: "seaborn 을 약속된 짧은 이름 sns 로 불러오기"
    group: pandas
  - cmd: "sns.load_dataset('titanic')"
    desc: "연습용 타이타닉 데이터(891행 15열)를 DataFrame 으로 받기(인터넷 필요)"
    group: pandas
  - cmd: "df.describe()"
    desc: "숫자 열만 개수, 평균, 표준편차, 최소, 25/50/75%, 최대로 요약"
    group: pandas
  - cmd: "df.isnull().sum()"
    desc: "열마다 빈칸(NaN) 개수 세기"
    group: pandas
  - cmd: "df.loc[df['age'].isnull(), ['sex', 'age', 'class']]"
    desc: "빈칸인 행만 골라 원하는 열만 보기"
    group: pandas
  - cmd: "df['열'].mean() / df['열'].median()"
    desc: "열의 평균, 중앙값"
    group: pandas
  - cmd: "df.loc[:, '열'] = df['열'].fillna(값)"
    desc: "빈칸만 값으로 채운 결과를 원래 열에 다시 넣기(fillna 는 사본을 돌려준다)"
    group: pandas
  - cmd: "df['열'].value_counts(dropna=False)"
    desc: "값별 개수를 NaN 까지 포함해 세기"
    group: pandas
  - cmd: "df['열'].mode()[0]"
    desc: "최빈값 하나 꺼내기([0] 없이 쓰면 Series 라 fillna 가 조용히 안 채운다)"
    group: pandas
  - cmd: "df['열'].cat.categories"
    desc: "category 열에 들어갈 수 있는 값 목록 보기"
    group: pandas
  - cmd: "df['열'].cat.add_categories('Unknown').fillna('Unknown')"
    desc: "category 목록에 'Unknown' 을 먼저 넣고 빈칸 채우기"
    group: pandas
  - cmd: "df['열'].str[0]"
    desc: "문자열마다 첫 글자 꺼내기(NaN 은 NaN 그대로)"
    group: pandas
  - cmd: "df['열'].quantile([0.25, 0.5, 0.75])"
    desc: "25%, 50%, 75% 지점의 값(Q1, 중앙값, Q3)"
    group: pandas
  - cmd: "q3 + 1.5 * (q3 - q1)"
    desc: "IQR 규칙의 상한선(넘으면 튀는 값으로 본다)"
    group: pandas
  - cmd: "df = df[df['fare'] < 512].copy()"
    desc: "조건에 맞는 행만 남긴 독립 사본을 df 에 다시 넣기"
    group: pandas
  - cmd: "df.duplicated().sum()"
    desc: "앞에 모든 열이 같은 행이 있는 행의 수"
    group: pandas
  - cmd: "df[df.duplicated(keep=False)]"
    desc: "중복 묶음의 첫 행까지 포함해 중복된 행 전부 보기"
    group: pandas
  - cmd: "platform.system()"
    desc: "운영체제 이름 확인(맥은 Darwin, 윈도우는 Windows)"
    group: matplotlib
  - cmd: "plt.rcParams['font.family'] = 'AppleGothic'"
    desc: "그래프 한글 글꼴 정하기(맥 AppleGothic, 윈도우 Malgun Gothic)"
    group: matplotlib
  - cmd: "fig, ax = plt.subplots(figsize=(6, 4))"
    desc: "가로 6, 세로 4인치 그림판과 그래프 칸 하나 만들기"
    group: matplotlib
  - cmd: "ax.hist(df['age'], bins=20, color='blue', edgecolor='black')"
    desc: "값을 20개 구간으로 나눠 구간마다 개수를 막대로 그리기"
    group: matplotlib
  - cmd: "ax.set_title('제목') / ax.set_xlabel('x축 이름')"
    desc: "그래프 제목과 가로축 이름 붙이기"
    group: matplotlib
terms:
  - word: "탐색적 데이터 분석 (EDA)"
    definition: "모델에 넣기 전에 데이터의 크기, 종류, 빈칸, 분포, 튀는 값을 먼저 살피는 일. shape, info(), describe(), 히스토그램으로 시작한다."
  - word: "결측값 (NaN)"
    definition: "빠져 있는 값. pandas 는 NaN 으로 보여 주고, 모델은 그대로 받지 못해 먼저 채우거나 걸러 낸다."
  - word: "fillna"
    definition: "빈칸(NaN)만 주어진 값으로 바꾼 새 Series 를 돌려주는 메서드. 원본을 바꾸려면 결과를 다시 넣는다."
  - word: "최빈값 (mode)"
    definition: "가장 많이 나온 값. 글자 열의 빈칸을 채울 때 쓴다. mode() 는 Series 를 돌려주므로 값 하나는 mode()[0] 으로 꺼낸다."
  - word: "category (범주형)"
    definition: "들어갈 수 있는 값 목록(categories)이 정해진 pandas 타입. 목록에 없는 값은 cat.add_categories 로 먼저 넣어야 한다."
  - word: "사분위수 (Q1, Q3)"
    definition: "데이터를 크기 순으로 줄 세웠을 때 25% 지점(Q1)과 75% 지점(Q3)의 값. quantile(0.25), quantile(0.75) 로 구한다."
  - word: "IQR (Interquartile Range)"
    definition: "Q3 - Q1, 가운데 절반의 폭. Q3 + 1.5 × IQR 을 넘는 값을 튀는 값(이상치)으로 본다."
  - word: "이상치 (Outlier)"
    definition: "다른 값보다 지나치게 크거나 작은 튀는 값. 무조건 지우지 않고 확인한 뒤 판단한다."
  - word: "중복 행 (duplicated)"
    definition: "모든 열이 앞의 어떤 행과 똑같은 행. 이름이나 번호 열이 없으면 다른 사람도 중복으로 잡힐 수 있다."
  - word: "히스토그램 (Histogram)"
    definition: "값을 구간(bins)으로 나눠 구간마다 몇 개인지 막대로 그린 그래프. 분포가 어디에 몰렸는지 보여 준다."
