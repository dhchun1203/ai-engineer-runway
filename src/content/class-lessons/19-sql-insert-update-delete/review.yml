# 19-sql-insert-update-delete 복습 데이터. 퀴즈 id는 오답 기록 키(cl:<slug>:<id>)라 한 번 정하면 바꾸지 않는다.
# SQL 결과, 번호, 오류 글자는 같은 구조의 표를 PostgreSQL 엔진(PGlite)으로 실행해 확인했고,
# psycopg 문항은 postgres:18 컨테이너에 연습 DB를 띄워 파이썬으로 실제 실행해 확인했다.
slug: 19-sql-insert-update-delete
quiz:
  - id: returning-new-serial-id
    q: "sports 에 종목 4개(번호 1~4)가 있어요. 이 문장이 보여 주는 sport_id 는?"
    code: |-
      INSERT INTO sports (sport_name) VALUES ('필라테스') RETURNING *;
    options:
      - "5"
      - "1"
      - "아무것도 안 보이고 INSERT 0 1 만 나온다"
      - "NULL"
    answer: 0
    explain: "sport_id 는 SERIAL 이라 열 목록에서 빼면 다음 번호 5를 받아요. RETURNING * 이 방금 넣은 행을 바로 보여 줘서 SELECT 를 다시 칠 필요가 없어요."
  - id: insert-select-column-position
    q: "INSERT 열 목록과 SELECT 열의 순서를 다르게 썼어요. 결과는?"
    code: |-
      INSERT INTO contact_lists (name, member_id, reason, request_date)
      SELECT member_id, name, '이메일 미등록', CAST('2026-11-19' AS DATE)
      FROM members
      WHERE email IS NULL;
    options:
      - "열 이름이 같으니 알아서 맞는 칸에 들어간다"
      - "ERROR: column \"member_id\" is of type integer but expression is of type character varying"
      - "name 칸에 번호, member_id 칸에 이름이 그대로 들어간다"
      - "INSERT 0 0"
    answer: 1
    explain: "INSERT ... SELECT 는 이름이 아니라 자리 순서로 짝을 지어요. 둘째 자리 member_id(정수) 칸에 둘째 SELECT 열 name(글자)이 들어가려다 타입이 안 맞아 멈춰요. 열 목록과 SELECT 열의 개수와 순서를 맞춰야 해요."
  - id: update-without-where-all-rows
    q: "courses 에 강좌가 14개 있어요. 이 문장을 실행하면?"
    code: |-
      UPDATE courses SET fee = 0;
    options:
      - "WHERE 가 없어서 오류가 난다"
      - "UPDATE 1, 첫 행만 바뀐다"
      - "UPDATE 14, 모든 강좌가 0원이 된다"
      - "UPDATE 0, 아무것도 안 바뀐다"
    answer: 2
    explain: "UPDATE 와 DELETE 의 대상은 WHERE 가 정해요. 빼면 경고 없이 모든 행이 바뀌어요. 그래서 같은 WHERE 로 먼저 SELECT 하고, 연습할 때는 BEGIN 안에서 해서 ROLLBACK 으로 되돌릴 수 있게 해요."
  - id: update-formula-runs-twice
    q: "fee 가 70000 인 강좌에 이 문장을 실수로 두 번 실행했어요. fee 는?"
    code: |-
      UPDATE courses SET fee = fee * 1.05 WHERE course_id = 1;
      UPDATE courses SET fee = fee * 1.05 WHERE course_id = 1;
    options:
      - "73500"
      - "77000"
      - "70000"
      - "77175"
    answer: 3
    explain: "SET 오른쪽의 fee 는 실행할 때의 현재 값이에요. 첫 번째에 73500, 두 번째는 73500 에서 다시 5% 올라 77175 가 돼요. 계산식 UPDATE 는 한 번만 실행하고, 다시 하려면 시드 파일로 처음 상태를 만들어요."
  - id: returning-no-order-by
    q: "바뀐 행을 번호 순으로 보려고 RETURNING 뒤에 ORDER BY 를 붙였어요. 결과는?"
    code: |-
      UPDATE courses SET capacity = capacity + 5
      WHERE course_id IN (2, 3, 4)
      RETURNING course_id, capacity
      ORDER BY course_id;
    options:
      - "번호 순으로 정렬돼 나온다"
      - "ERROR: syntax error at or near \"ORDER\""
      - "정원만 바뀌고 RETURNING 은 무시된다"
      - "UPDATE 0"
    answer: 1
    explain: "RETURNING 에는 ORDER BY 를 쓸 수 없어서 문장 전체가 문법 오류로 멈춰요. RETURNING 의 행 순서는 정해져 있지 않으니, 순서가 필요하면 바꾼 뒤 SELECT ... ORDER BY 로 따로 조회해요."
  - id: not-exists-finds-no-match
    q: "이 쿼리가 고르는 회원은?"
    code: |-
      SELECT m.member_id, m.name
      FROM members m
      WHERE NOT EXISTS (
          SELECT 1 FROM enrollments e WHERE e.member_id = m.member_id
      );
    options:
      - "수강 기록이 한 번도 없는 회원"
      - "수강 기록이 한 번이라도 있는 회원"
      - "member_id 가 1 인 회원"
      - "모든 회원(SELECT 1 은 항상 1이라서)"
    answer: 0
    explain: "NOT EXISTS 는 바깥 회원 한 명마다 안쪽에 짝이 되는 수강 기록이 있는지 보고, 한 행도 없을 때 참이에요. SELECT 1 의 1에는 뜻이 없어요. EXISTS 는 값이 아니라 행이 있느냐만 봐요."
  - id: truncate-keeps-serial-counter
    q: "contact_lists 에 18행(번호 1~18)을 넣었다가 비우고 한 행을 다시 넣었어요. 보이는 request_id 는?"
    code: |-
      TRUNCATE contact_lists;
      INSERT INTO contact_lists (member_id, name, reason, request_date)
      VALUES (2, '이준호', '이메일 미등록', '2026-11-19')
      RETURNING request_id;
    options:
      - "1"
      - "18"
      - "19"
      - "번호가 겹쳐서 오류가 난다"
    answer: 2
    explain: "TRUNCATE 는 행만 비우고 SERIAL 의 번호표 기계는 그대로 둬요. 마지막으로 쓴 번호가 18이라 다음은 19예요. 1부터 다시 쓰려면 TRUNCATE contact_lists RESTART IDENTITY; 로 비워요."
  - id: rollback-does-not-return-serial
    q: "방금 RESTART IDENTITY 로 비운 contact_lists 에서 이렇게 했어요. 마지막 INSERT 가 보여 주는 request_id 는?"
    code: |-
      BEGIN;
      INSERT INTO contact_lists (member_id, name, reason, request_date)
      VALUES (2, '이준호', '이메일 미등록', '2026-11-19');
      ROLLBACK;
      INSERT INTO contact_lists (member_id, name, reason, request_date)
      VALUES (2, '이준호', '이메일 미등록', '2026-11-19')
      RETURNING request_id;
    options:
      - "1"
      - "2"
      - "0"
      - "ROLLBACK 때문에 오류가 난다"
    answer: 1
    explain: "ROLLBACK 은 첫 INSERT 의 행을 되돌리지만, 그 행이 받은 번호 1은 돌려놓지 않아요. 그래서 다음 INSERT 는 2를 받아요. 번호에 빈틈이 생기는 흔한 이유예요."
  - id: delete-truncate-drop-scope
    q: "표 구조는 남기고 모든 행만 한 번에 비우는 명령은?"
    options:
      - "DROP TABLE contact_lists;"
      - "TRUNCATE contact_lists;"
      - "DELETE FROM contact_lists WHERE request_id = 1;"
      - "TRUNCATE contact_lists WHERE reason = '이메일 미등록';"
    answer: 1
    explain: "TRUNCATE 는 모든 행을 한 번에 비우고 표 구조는 남겨요. DROP TABLE 은 표 자체를 지우고, DELETE 는 WHERE 로 고른 행만 지워요. TRUNCATE 에는 WHERE 를 쓸 수 없어서 마지막 보기는 문법 오류예요."
  - id: psycopg-params-need-tuple
    q: "이 파이썬 코드를 실행하면?"
    code: |-
      m_name = "이준호"
      conn.execute(
          "SELECT member_id FROM members WHERE name = %s", (m_name)
      ).fetchone()
    options:
      - "{'member_id': 2} 가 나온다"
      - "None 이 나온다"
      - "TypeError: query parameters should be a sequence or a mapping, got str"
      - "SQL 문법 오류가 난다"
    answer: 2
    explain: "쉼표가 없는 (m_name) 은 튜플이 아니라 그냥 문자열이에요. 자리표시자가 하나여도 값은 (m_name,) 처럼 튜플로 넘겨야 해요. 값을 따로 넘기면 따옴표 처리를 드라이버가 맡아서 안전해요."
commands:
  - cmd: "INSERT INTO 표 (열1, 열2) VALUES (값1, 값2) RETURNING *;"
    desc: "행을 넣고 넣은 행(새 SERIAL 번호 포함)을 바로 보기"
    group: SQL
  - cmd: "INSERT INTO 표 VALUES (DEFAULT, 값);"
    desc: "열 목록 없이 SERIAL 칸을 DEFAULT 로 비워 두기(열 목록을 쓰는 게 권장)"
    group: SQL
  - cmd: "INSERT INTO 표A (열1, 열2, 열3) SELECT 열x, 열y, '고정값' FROM 표B WHERE 조건;"
    desc: "조회 결과를 통째로 넣기(열 개수와 순서를 맞춤)"
    group: SQL
  - cmd: "SELECT ... UNION SELECT ..."
    desc: "두 조회 결과를 위아래로 합치기(완전히 같은 줄은 하나로)"
    group: SQL
  - cmd: "CAST('2026-11-19' AS DATE)"
    desc: "값의 타입 바꾸기(글자를 날짜로)"
    group: SQL
  - cmd: "UPDATE 표 SET 열1 = 값, 열2 = 열2 + 5 WHERE 조건 RETURNING 열1, 열2;"
    desc: "고른 행의 값 바꾸기(여러 열은 쉼표, 현재 값으로 계산 가능)"
    group: SQL
  - cmd: "ROUND(fee * 1.05, -2)"
    desc: "100원 단위로 반올림(-1은 10원, -3은 1000원)"
    group: SQL
  - cmd: "SET 열 = CASE WHEN 조건 THEN 값 ELSE 열 END"
    desc: "조건마다 다른 값으로 바꾸기(ELSE 열 로 나머지는 그대로)"
    group: SQL
  - cmd: "UPDATE 표 SET ... WHERE 키 IN (SELECT 키 FROM ... GROUP BY ... HAVING ...);"
    desc: "서브쿼리가 돌려준 번호 목록만 바꾸기"
    group: SQL
  - cmd: "DELETE FROM 표 WHERE 조건 RETURNING *;"
    desc: "고른 행을 지우고 지운 행 보기"
    group: SQL
  - cmd: "WHERE NOT EXISTS (SELECT 1 FROM 표B b WHERE b.키 = a.키)"
    desc: "다른 표에 짝이 한 행도 없는 행만 고르기"
    group: SQL
  - cmd: "TRUNCATE 표;"
    desc: "모든 행 비우기(표는 남고 SERIAL 번호는 그대로)"
    group: SQL
  - cmd: "TRUNCATE 표 RESTART IDENTITY;"
    desc: "모든 행을 비우고 SERIAL 번호도 1부터 다시"
    group: SQL
  - cmd: "BEGIN; / COMMIT; / ROLLBACK;"
    desc: "트랜잭션 시작 / 확정 / 통째로 되돌리기"
    group: SQL
  - cmd: "uv add \"psycopg[binary]\""
    desc: "파이썬에서 PostgreSQL 에 접속하는 psycopg 패키지 설치"
    group: uv
  - cmd: "uv run main.py"
    desc: "프로젝트 환경으로 수강 신청 프로그램 실행"
    group: uv
  - cmd: "psycopg.connect(DSN, row_factory=dict_row)"
    desc: "DB 에 접속하고 행을 열 이름으로 꺼내는 딕셔너리로 받기"
    group: Python
  - cmd: "conn.execute(\"... WHERE name = %s\", (m_name,))"
    desc: "SQL 에 자리표시자를 두고 값은 튜플로 따로 넘기기"
    group: Python
  - cmd: "conn.execute(\"... LIKE %s\", (f\"%{c_name}%\",))"
    desc: "와일드카드 % 는 값 쪽에 붙여 비슷한 이름 찾기"
    group: Python
  - cmd: ".fetchone() / .fetchall()"
    desc: "결과를 한 행(없으면 None) / 행 목록으로 받기"
    group: Python
terms:
  - word: "RETURNING"
    definition: "INSERT, UPDATE, DELETE 끝에 붙여 방금 바꾼 행을 바로 돌려받는 PostgreSQL 문법. INSERT 에 붙이면 자동으로 매겨진 SERIAL 번호를 알 수 있다."
  - word: "INSERT ... SELECT"
    definition: "VALUES 대신 조회 결과를 통째로 넣는 방법. 넣을 열 목록과 SELECT 열이 이름이 아니라 자리 순서로 짝지어진다."
  - word: "형 변환 (CAST)"
    definition: "CAST(값 AS 타입)으로 값을 다른 타입으로 바꾼다. CAST('2026-11-19' AS DATE)는 글자를 날짜로 바꾼다."
  - word: "UPDATE"
    definition: "SET 열 = 새 값으로 WHERE 에 맞는 행의 값을 바꾼다. WHERE 를 빼면 모든 행이 바뀐다."
  - word: "NOT EXISTS"
    definition: "서브쿼리가 한 행도 돌려주지 않을 때 참이 되는 조건. 바깥 행마다 다른 표에 짝이 있는지 볼 때 쓴다."
  - word: "TRUNCATE"
    definition: "표의 모든 행을 한 번에 비운다. 표 구조는 남고 WHERE 를 쓸 수 없으며, SERIAL 번호는 RESTART IDENTITY 를 붙여야 1부터 다시 시작한다."
  - word: "트랜잭션 (Transaction)"
    definition: "BEGIN 부터 COMMIT 또는 ROLLBACK 까지를 한 묶음으로 다루는 단위. 전부 성공하거나 전부 취소된다."
  - word: "자리표시자 (Placeholder)"
    definition: "SQL 안에 값 대신 두는 %s. 실제 값은 튜플로 따로 넘기고 따옴표 처리는 드라이버가 맡아 안전하다."
  - word: "psycopg"
    definition: "파이썬에서 PostgreSQL 에 접속해 SQL 을 보내는 드라이버. with 블록이 오류 없이 끝나면 변경을 commit 한다."
