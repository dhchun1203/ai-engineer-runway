# 16-postgres-tables-keys-relations 복습 데이터. 퀴즈 id는 오답 기록 키(cl:<slug>:<id>)라 한 번 정하면 바꾸지 않는다.
# SQL 문항의 결과와 오류 글자는 모두 PostgreSQL 엔진(PGlite)으로 직접 실행해 확인했다.
slug: 16-postgres-tables-keys-relations
quiz:
  - id: alias-in-where
    q: "psql 에 다음을 쳤어요. 결과는?"
    code: |-
      SELECT 1 + 1 AS total
      WHERE total > 1;
    options:
      - "total 열에 2 가 나온다"
      - "ERROR: column \"total\" does not exist"
      - "아무 행도 안 나온다"
      - "프롬프트가 postgres-# 로 바뀌고 기다린다"
    answer: 1
    explain: "적기는 SELECT 가 먼저지만 실행은 WHERE 가 먼저예요. WHERE 가 돌 때는 별칭 total 이 아직 없어서 오류가 나요. WHERE 1 + 1 > 1 처럼 계산식을 직접 쓰면 2 가 나와요. postgres-# 는 세미콜론이 빠졌을 때의 프롬프트인데, 여기엔 ; 가 있어요."
  - id: phone-type-string
    q: "회원 표에 전화번호 열을 만들려고 해요. 알맞은 타입과 이유는?"
    code: |-
      CREATE TABLE members (
          ...
          phone  ????,
          ...
      );
    options:
      - "INT. 숫자로만 이루어져 있으니까"
      - "BIGINT. INT 로는 자리가 모자라니까"
      - "VARCHAR(20). 계산하지 않는 값이고 숫자로 넣으면 앞의 0이 사라지니까"
      - "DATE. 등록한 날짜와 같이 다루니까"
    answer: 2
    explain: "숫자와 문자열을 가르는 질문은 \"계산할 값인가?\"예요. 전화번호는 더하거나 비교하지 않고, 정수로 바꾸면 '01012345678' 이 1012345678 이 되어 앞의 0이 사라져요. 그래서 문자열 VARCHAR 로 둬요."
  - id: fk-insert-missing-parent
    q: "sports 에는 1(수영), 2(헬스)만 있어요. 다음 INSERT 의 결과는?"
    code: |-
      -- courses.sport_id INT NOT NULL REFERENCES sports (sport_id)
      INSERT INTO courses (sport_id, course_name, level, class_days, start_time, capacity, fee)
      VALUES (30, '헬스 자유이용', '자유', '매일', '06:00', 50, 50000);
    options:
      - "들어간다. sport_id 는 INT 라 30 도 괜찮다"
      - "들어가고, sports 에 30번 종목이 저절로 생긴다"
      - "ERROR: ... violates foreign key constraint \"courses_sport_id_fkey\""
      - "ERROR: ... violates not-null constraint"
    answer: 2
    explain: "REFERENCES 는 가리키는 값이 저쪽 표에 실제로 있어야 한다는 약속이에요. sports 에 30번이 없으니 DETAIL: Key (sport_id)=(30) is not present in table \"sports\". 와 함께 거절돼요. 값이 비지 않았으니 not-null 오류는 아니에요."
  - id: unique-fk-one-to-one
    q: "사물함 101번이 회원 1번에게 배정돼 있어요. 다음 INSERT 의 결과는?"
    code: |-
      CREATE TABLE lockers (
          locker_no    INT   PRIMARY KEY,
          member_id    INT   NOT NULL UNIQUE REFERENCES members (member_id) ON DELETE CASCADE,
          assign_date  DATE  NOT NULL
      );
      INSERT INTO lockers VALUES (101, 1, '2026-11-01');
      INSERT INTO lockers VALUES (102, 1, '2026-11-01');
    options:
      - "들어간다. 사물함 번호가 다르니까"
      - "ERROR: duplicate key value violates unique constraint \"lockers_member_id_key\""
      - "ERROR: duplicate key value violates unique constraint \"lockers_pkey\""
      - "ERROR: ... violates foreign key constraint \"lockers_member_id_fkey\""
    answer: 1
    explain: "member_id 에 UNIQUE 가 붙어 같은 회원 번호는 한 번만 나올 수 있어요. 그래서 1:1 이에요. 사물함 번호 102 는 새 번호라 PK 에는 안 걸리고, 회원 1번은 있으니 FK 도 통과해요. UNIQUE 가 없었다면 1:N 이라 들어갔을 거예요."
  - id: composite-pk-month
    q: "enrollments 에 (1, 1, '2026-09', '수료', 70000) 이 이미 있어요. 다음 중 들어가는 것은?"
    code: |-
      CREATE TABLE enrollments (
          member_id     INT          NOT NULL REFERENCES members (member_id),
          course_id     INT          NOT NULL REFERENCES courses (course_id),
          enroll_month  CHAR(7)      NOT NULL,
          status        VARCHAR(10)  NOT NULL,
          pay_amount    INT,
          PRIMARY KEY (member_id, course_id, enroll_month)
      );
    options:
      - "(1, 1, '2026-09', '수강중', 70000)"
      - "(1, 1, '2026-10', '수강중', 70000)"
      - "(1, 1, '2026-9-1', '수강중', 70000)"
      - "넷 다 막힌다. member_id 1 이 이미 있으니까"
    answer: 1
    explain: "복합 PK 는 세 열의 조합이 겹치는 것만 막아요. 9월 같은 강좌는 세 열이 모두 같아 enrollments_pkey 위반이고, 10월은 월이 달라 들어가요. '2026-9-1' 은 8글자라 value too long for type character(7) 이에요. 열 하나하나는 겹쳐도 돼요."
commands:
  - cmd: "docker --version / docker compose version"
    desc: "Docker 와 Compose 가 깔려 있는지 확인(docker compose 는 띄어쓰기가 현재 방식)"
    group: Docker
  - cmd: "docker compose logs db"
    desc: "db 서비스 컨테이너의 기록 보기(ready to accept connections 확인)"
    group: Docker Compose
  - cmd: "docker compose stop / docker compose start"
    desc: "컨테이너 끄기 / 다시 켜기(데이터 유지)"
    group: Docker Compose
  - cmd: "docker compose exec db psql -U postgres"
    desc: "서비스 db 컨테이너 안의 psql 로 기본 DB(postgres)에 접속"
    group: Docker Compose
  - cmd: "docker compose exec db psql -U postgres -d sportscenter"
    desc: "sportscenter DB 로 바로 접속"
    group: Docker Compose
  - cmd: "\\l"
    desc: "데이터베이스 목록"
    group: psql
  - cmd: "\\dt"
    desc: "지금 DB의 테이블 목록"
    group: psql
  - cmd: "\\d 테이블 / \\d+ 테이블"
    desc: "테이블의 열과 PK, UNIQUE, FK 보기 / 더 자세히"
    group: psql
  - cmd: "\\dn"
    desc: "스키마 목록(기본은 public)"
    group: psql
  - cmd: "\\q"
    desc: "psql 끝내기"
    group: psql
  - cmd: "CREATE DATABASE sportscenter;"
    desc: "새 데이터베이스 만들기(만든 뒤 \\c 로 옮겨 가야 그 안에 표가 생김)"
    group: SQL
  - cmd: "CREATE TABLE 표 (열 타입 [제약조건], ..., [테이블 제약조건]);"
    desc: "표 만들기(DDL)"
    group: SQL
  - cmd: "PRIMARY KEY / NOT NULL / UNIQUE / REFERENCES 표 (열)"
    desc: "기본 키 / 빈 값 금지 / 중복 금지 / 외래 키 제약 조건"
    group: SQL
  - cmd: "REFERENCES members (member_id) ON DELETE CASCADE"
    desc: "가리키던 행이 지워지면 이 행도 같이 지우는 외래 키"
    group: SQL
  - cmd: "PRIMARY KEY (member_id, course_id, enroll_month)"
    desc: "여러 열을 묶은 복합 기본 키(표 맨 아래에 한 번만)"
    group: SQL
  - cmd: "INSERT INTO 표 (열1, 열2) VALUES (값1, 값2);"
    desc: "열을 골라 행 하나 넣기(DML)"
    group: SQL
  - cmd: "INSERT INTO 표 (열1, 열2) VALUES (...), (...);"
    desc: "한 문장으로 여러 행 넣기(INSERT 0 2)"
    group: SQL
  - cmd: "SELECT * FROM 표; / SELECT 열1, 열2 FROM 표;"
    desc: "모든 열 / 고른 열만 조회"
    group: SQL
  - cmd: "DELETE FROM 표 WHERE 조건;"
    desc: "조건에 맞는 행 지우기"
    group: SQL
  - cmd: "ALTER TABLE courses ADD COLUMN instructor_id INT REFERENCES instructors (instructor_id);"
    desc: "있는 표에 열 더하기(기존 행은 NULL)"
    group: SQL
  - cmd: "DROP TABLE 표;"
    desc: "표 구조와 데이터를 함께 지우기(되돌릴 수 없음, 누가 가리키면 막힘)"
    group: SQL
  - cmd: "SELECT version();"
    desc: "PostgreSQL 버전 보기"
    group: SQL
  - cmd: "Cmd + Enter"
    desc: "DBeaver 에서 커서가 있는 SQL 문장 실행(맥, 윈도우는 Ctrl + Enter)"
    group: 단축키
terms:
  - word: "기본 키 (Primary Key, PK)"
    definition: "행 하나를 콕 집는 열. 중복과 NULL을 둘 다 막는다. 만들면 인덱스(표이름_pkey)가 저절로 생긴다."
  - word: "외래 키 (Foreign Key, FK)"
    definition: "다른 표의 행을 번호로 가리키는 열. REFERENCES 로 걸며, 없는 값을 넣는 것과 누가 가리키는 행을 지우는 것을 막는다."
  - word: "참조 무결성 (Referential Integrity)"
    definition: "가리키는 값이 저쪽 표에 실제로 있어야 한다는 규칙. 외래 키가 입력할 때도 지울 때도 지킨다."
  - word: "ON DELETE CASCADE"
    definition: "외래 키에 붙이는 옵션. 가리키던 행이 지워지면 그 행을 가리키는 행도 같이 지운다. 없으면 삭제가 막힌다."
  - word: "복합 키 (Composite Key)"
    definition: "여러 열을 합쳐 하나의 키로 쓰는 것. 열 하나하나가 아니라 조합이 겹치는 것만 막는다. PRIMARY KEY (a, b, c), UNIQUE(a, b)."
  - word: "중간 테이블 (Junction Table)"
    definition: "N:M 관계를 잇는 표. 양쪽을 가리키는 외래 키 두 개를 갖고, 한 행이 하나의 연결(누가 어떤 강좌를)을 뜻한다."
  - word: "DDL과 DML"
    definition: "DDL(정의어)은 CREATE, ALTER, DROP 처럼 구조를 바꾸고, DML(조작어)은 INSERT, DELETE, SELECT 처럼 표 안의 행을 다룬다."
  - word: "스키마 (Schema)"
    definition: "데이터베이스 안에서 표를 묶어 두는 폴더. 정하지 않으면 public 에 만들어지고, public.members 처럼 부른다."
  - word: "ERD (Entity Relationship Diagram)"
    definition: "표와 표 사이 관계를 선과 기호로 그린 그림. 까마귀발 표기에서 선 끝 기호가 정확히 1, 0 또는 1, 0개 이상 같은 개수를 말한다."
  - word: "정규화 (Normalization)"
    definition: "한 칸에 값 하나(1NF), 반복되거나 다른 열에 기대는 값은 따로 떼기(3NF)처럼, 표를 나눠 중복과 모순을 없애는 일."
