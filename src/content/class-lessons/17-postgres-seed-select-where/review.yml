# 17-postgres-seed-select-where 복습 데이터. 퀴즈 id는 오답 기록 키(cl:<slug>:<id>)라 한 번 정하면 바꾸지 않는다.
# SQL 문항의 결과와 오류 글자는 모두 PostgreSQL 엔진(PGlite)으로 직접 실행해 확인했다.
slug: 17-postgres-seed-select-where
quiz:
  - id: null-equals-zero-rows
    q: "members 에는 이메일이 비어 있는 회원이 15명 있어요. 다음 문장의 결과는?"
    code: |-
      SELECT member_id, name FROM members WHERE email = NULL;
    options:
      - "15행이 나온다"
      - "ERROR: operator does not exist"
      - "오류 없이 0행이 나온다"
      - "60행이 모두 나온다"
    answer: 2
    explain: "NULL 은 모르는 값이라 무엇과 = 로 비교해도 참이 되지 않아요. WHERE 는 참인 행만 남기니 0행이고, 오류도 안 나서 더 알아차리기 어려워요. 빈 칸은 WHERE email IS NULL 로 찾아야 15행이 나와요."
  - id: in-is-not-pattern
    q: "회원들이 사는 곳은 마포구, 서대문구, 은평구, 용산구, 영등포구예요. 다음 문장의 결과는?"
    code: |-
      SELECT name FROM members WHERE region IN ('%구');
    options:
      - "'구'로 끝나는 회원이 모두 나온다"
      - "0행이 나온다"
      - "ERROR: syntax error at or near \"%\""
      - "첫 번째 회원 한 명만 나온다"
    answer: 1
    explain: "IN 은 패턴을 모르고 목록의 글자와 정확히 같은지만 봐요. 이름이 정말로 '%구'인 동네는 없어서 0행이에요. '구'로 끝나는 곳을 찾으려면 region LIKE '%구' 를 써요."
  - id: and-before-or
    q: "결과에 강도윤(마포구, M)이 나오는 문장은?"
    code: |-
      -- (가)
      SELECT name FROM members
      WHERE region = '마포구' OR region = '서대문구' AND gender = 'F';
      -- (나)
      SELECT name FROM members
      WHERE (region = '마포구' OR region = '서대문구') AND gender = 'F';
    options:
      - "(가)만"
      - "(나)만"
      - "둘 다"
      - "둘 다 아니다"
    answer: 0
    explain: "AND 가 OR 보다 먼저 묶여서 (가)는 '마포구' 또는 '서대문구 여성'으로 읽혀요. 그래서 마포구 남성 강도윤도 나와요. (나)는 괄호 덕분에 두 동네의 여성만 남아요."
  - id: seed-drop-open-db
    q: "시드 파일 첫 줄이 DROP DATABASE sportscenter; 예요. 이렇게 들어가서 \\i 로 실행하면?"
    code: |-
      docker compose exec db psql -U postgres -d sportscenter
      \i /tmp/sportscenter_seed.sql
    options:
      - "sportscenter 가 지워졌다가 다시 만들어진다"
      - "ERROR: cannot drop the currently open database"
      - "ERROR: database \"sportscenter\" does not exist"
      - "/tmp 에 파일이 없어서 No such file or directory"
    answer: 1
    explain: "지금 접속해 있는 DB는 지울 수 없어요. 앉아 있는 방을 통째로 철거할 수 없는 것과 같아요. -d 없이 기본 DB postgres 로 들어가 실행하면, 시드가 sportscenter 를 지우고 다시 만든 뒤 \\c 로 옮겨 가요."
  - id: check-negative-amount
    q: "enrollments 에 다음 행을 넣으면?"
    code: |-
      -- pay_amount NUMERIC(10,2) NOT NULL CHECK (pay_amount >= 0)
      INSERT INTO enrollments VALUES (1, 2, '2026-11', '수강중', -1000);
    options:
      - "들어가고 pay_amount 는 0.00 으로 바뀐다"
      - "들어가고 -1000.00 으로 저장된다"
      - "ERROR: violates check constraint \"enrollments_pay_amount_check\""
      - "ERROR: numeric field overflow"
    answer: 2
    explain: "CHECK 조건 pay_amount >= 0 이 거짓이라 행이 통째로 거절돼요. 이름을 따로 안 붙이면 PostgreSQL 이 표_열_check 로 지어요. numeric field overflow 는 NUMERIC(10,2) 의 정수 부분 8자리를 넘을 때 나요."
commands:
  - cmd: "docker compose cp sportscenter_seed.sql db:/tmp/sportscenter_seed.sql"
    desc: "내 컴퓨터의 파일을 서비스 db 컨테이너의 /tmp 로 복사(cp 보낼파일 서비스:받을경로)"
    group: Docker Compose
  - cmd: "\\i /tmp/sportscenter_seed.sql"
    desc: "파일 안의 SQL 을 위에서부터 차례로 실행(psql 명령)"
    group: psql
  - cmd: "q"
    desc: "결과가 길어 (END) 나 : 가 뜬 화면에서 빠져나오기"
    group: psql
  - cmd: "DROP DATABASE 이름; / CREATE DATABASE 이름;"
    desc: "DB 통째로 지우기 / 만들기(지금 접속한 DB는 못 지움)"
    group: SQL
  - cmd: "DROP TABLE IF EXISTS 표;"
    desc: "표가 있으면 지우고, 없으면 오류 없이 넘어가기"
    group: SQL
  - cmd: "ALTER TABLE 표 ADD COLUMN 열 타입;"
    desc: "데이터는 두고 열만 더하기(기존 행의 새 칸은 NULL)"
    group: SQL
  - cmd: "TRUNCATE 표1, 표2 RESTART IDENTITY;"
    desc: "표 안을 통째로 비우고 SERIAL 번호를 1부터 다시(이어진 표는 한 줄에 같이)"
    group: SQL
  - cmd: "NUMERIC(10,2)"
    desc: "전체 10자리 중 소수 2자리인 정확한 숫자 타입(금액용)"
    group: SQL
  - cmd: "CHECK (조건) / CONSTRAINT 이름 CHECK (조건)"
    desc: "조건이 참인 값만 받기 / 규칙에 이름 붙이기"
    group: SQL
  - cmd: "SELECT 열1, 열2 FROM 표 LIMIT 5;"
    desc: "필요한 열만, 앞의 5행만 보기"
    group: SQL
  - cmd: "SELECT 열 AS 별칭 / AS \"띄어 쓴 별칭\""
    desc: "결과 열 이름 바꾸기(띄어쓰기가 있으면 큰따옴표)"
    group: SQL
  - cmd: "SELECT DISTINCT 열1, 열2 FROM 표;"
    desc: "겹치는 줄을 하나로(열이 여럿이면 조합 기준)"
    group: SQL
  - cmd: "WHERE 열 = '값' / <> / < <= > >="
    desc: "조건이 참인 행만 남기기(글자 값은 작은따옴표)"
    group: SQL
  - cmd: "WHERE 열 IS NULL / IS NOT NULL"
    desc: "빈 칸 / 값이 있는 칸 찾기(= NULL 은 0행)"
    group: SQL
  - cmd: "WHERE 열 BETWEEN a AND b"
    desc: "a 이상 b 이하(양 끝 포함, 작은 값을 앞에)"
    group: SQL
  - cmd: "WHERE 열 IN (값1, 값2)"
    desc: "목록 중 하나와 정확히 같으면 통과"
    group: SQL
  - cmd: "WHERE 열 LIKE '김%' / '_준_'"
    desc: "모양으로 찾기(% 는 0글자 이상, _ 는 정확히 1글자)"
    group: SQL
  - cmd: "WHERE 조건1 AND (조건2 OR 조건3)"
    desc: "AND 가 OR 보다 먼저 묶이니 괄호로 뜻을 정하기"
    group: SQL
  - cmd: "CASE WHEN 조건 THEN 값 ... ELSE 값 END AS 별칭"
    desc: "조건에 따라 값이 바뀌는 열 만들기(처음 맞는 줄에서 멈춤)"
    group: SQL
  - cmd: "ORDER BY 열1 DESC, 열2"
    desc: "정렬(기본 ASC 오름차순, DESC 내림차순, 앞 기준이 같을 때 다음 기준)"
    group: SQL
  - cmd: "SELECT COUNT(*) FROM 표 WHERE 조건;"
    desc: "조건에 맞는 행 수 세기"
    group: SQL
terms:
  - word: "시드 데이터 (Seed Data)"
    definition: "표를 처음 상태로 되돌리고 채우는 연습용 데이터. 몇 번을 실행해도 같은 상태가 되도록 만든 SQL 파일로 넣는다."
  - word: "CHECK 제약 (Check Constraint)"
    definition: "조건이 참인 값만 받는 규칙. 거짓이면 행 전체를 거절한다. NULL 은 막지 않아 NOT NULL 을 같이 붙인다."
  - word: "NUMERIC(전체, 소수)"
    definition: "숫자를 근삿값이 아니라 정확하게 저장하는 타입. NUMERIC(10,2)는 전체 10자리 중 소수 2자리라 금액에 쓴다."
  - word: "별칭 (Alias)"
    definition: "AS 로 결과 열에 붙이는 이름표. 표의 열 이름은 그대로다. 실행 순서상 ORDER BY 에서는 쓸 수 있고 WHERE 에서는 못 쓴다."
  - word: "DISTINCT"
    definition: "결과에서 겹치는 줄을 하나로 줄인다. 열을 여럿 쓰면 그 값들의 조합이 같을 때만 겹친다고 본다."
  - word: "NULL 비교"
    definition: "NULL 은 모르는 값이라 = 로 비교하면 참이 되지 않는다. 빈 칸은 IS NULL, 값이 있는 칸은 IS NOT NULL 로 찾는다."
  - word: "LIKE 패턴 (Wildcard)"
    definition: "% 는 0글자 이상 아무 글자, _ 는 정확히 한 글자. IN 은 패턴을 모르고 글자 그대로 비교한다."
  - word: "TRUNCATE"
    definition: "표 구조는 두고 안의 행만 통째로 비우는 명령. RESTART IDENTITY 를 붙이면 SERIAL 번호도 1부터 다시 센다."
