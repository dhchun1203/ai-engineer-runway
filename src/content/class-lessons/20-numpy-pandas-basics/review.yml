# 20-numpy-pandas-basics 복습 데이터. 퀴즈 id는 오답 기록 키(cl:<slug>:<id>)라 한 번 정하면 바꾸지 않는다.
# 문항의 코드와 출력은 Python 3.14, NumPy 2.5.5, pandas 3.1.1에서 실제로 실행해 확인했다.
slug: 20-numpy-pandas-basics
quiz:
  - id: list-times-two-concat
    q: "리스트에 2를 곱하면 무엇이 출력될까요?"
    code: |-
      amounts = [3200, 1500]
      print(amounts * 2)
    options:
      - "[6400, 3000]"
      - "[3200, 1500, 3200, 1500]"
      - "TypeError"
      - "9400"
    answer: 1
    explain: "리스트는 값 묶음이라 * 2 가 안의 숫자에 들어가지 않고 리스트를 두 번 이어 붙여요. 칸마다 2를 곱하려면 np.array(amounts) * 2 처럼 배열로 바꿔요. 리스트에 * 1.1 처럼 소수를 곱하면 그때는 TypeError 예요."
  - id: mixed-array-becomes-text
    q: "글자와 숫자를 한 배열에 넣고 두 금액을 더했어요. 출력은?"
    code: |-
      import numpy as np

      mixed = np.array([["편의점", 3200], ["버스", 1500]])
      print(mixed[0, 1] + mixed[1, 1])
    options:
      - "4700"
      - "TypeError"
      - "32001500"
      - "[3200 1500]"
    answer: 2
    explain: "NumPy 배열은 한 가지 종류만 담아서 글자가 섞이면 숫자도 '3200', '1500' 같은 글자(<U21)가 돼요. 글자끼리 + 는 이어 붙이기라 32001500 이 나와요. 열마다 종류가 다른 표가 필요해서 pandas 를 써요."
  - id: boolean-index-keeps-true
    q: "출력은?"
    code: |-
      import numpy as np

      arr = np.array([3200, 15000, 4800, 32000])
      print(arr[arr >= 10000])
    options:
      - "[False  True False  True]"
      - "[15000 32000]"
      - "[1 3]"
      - "2"
    answer: 1
    explain: "arr >= 10000 이 칸마다 True/False 를 만들고, 그 줄을 대괄호에 넣으면 True 인 칸의 값만 남아요(불리언 인덱싱). True/False 줄 자체가 나오는 건 대괄호 없이 arr >= 10000 만 썼을 때예요."
  - id: single-vs-double-bracket-shape
    q: "대괄호 한 겹과 두 겹으로 같은 열을 꺼냈어요. 출력은?"
    code: |-
      import pandas as pd

      df = pd.DataFrame({"shop": ["카페", "버스", "분식집"], "amount": [4800, 1500, 6500]})
      print(df["amount"].shape, df[["amount"]].shape)
    options:
      - "(3,) (3,)"
      - "(3, 1) (3, 1)"
      - "(3,) (3, 1)"
      - "KeyError"
    answer: 2
    explain: "한 겹은 Series(한 줄, 1차원)라 (3,), 두 겹은 열 이름 목록을 넘긴 표(DataFrame, 2차원)라 (3, 1) 이에요. 열이 하나뿐이어도 두 겹이면 표예요. 한 겹에 이름 두 개를 넣은 df[\"shop\", \"amount\"] 가 KeyError 예요."
  - id: and-raises-valueerror
    q: "두 조건을 and 로 이었어요. 결과는?"
    code: |-
      import pandas as pd

      df = pd.DataFrame({"category": ["식비", "교통", "식비"], "amount": [4800, 1500, 6500]})
      df[(df["category"] == "식비") and (df["amount"] >= 5000)]
    options:
      - "분식집 6500 한 행이 나온다"
      - "ValueError: The truth value of a Series is ambiguous."
      - "TypeError: Cannot perform 'rand_' ..."
      - "빈 표가 나온다"
    answer: 1
    explain: "and 는 양쪽을 True 하나, False 하나로 보려는데 조건의 결과는 행마다 True/False 가 든 Series 라 하나로 정할 수 없어요. 행마다 잇는 & 를 써요. TypeError 는 & 를 쓰고 괄호를 뺐을 때 나는 오류예요."
  - id: or-filter-rows
    q: "출력되는 행은 몇 개일까요?"
    code: |-
      import pandas as pd

      df = pd.DataFrame({
          "shop": ["카페", "버스", "분식집", "영화관"],
          "category": ["식비", "교통", "식비", "문화"],
          "amount": [4800, 1500, 6500, 15000],
      })
      print(df[(df["category"] == "식비") | (df["amount"] >= 10000)])
    options:
      - "1개(영화관)"
      - "2개(카페, 분식집)"
      - "3개(카페, 분식집, 영화관)"
      - "4개(모든 행)"
    answer: 2
    explain: "| 는 또는이라 두 조건 중 하나만 True 여도 남아요. 식비인 카페, 분식집과 10000원 이상인 영화관, 세 행이에요. 버스는 둘 다 False 라 빠져요. & 였다면 둘 다 맞는 행이 없어 빈 표예요."
  - id: sort-keeps-original-index
    q: "큰 금액 순으로 2건을 뽑았어요. 결과 왼쪽의 행 번호는?"
    code: |-
      import pandas as pd

      df = pd.DataFrame({"shop": ["카페", "버스", "분식집", "영화관"], "amount": [4800, 1500, 6500, 15000]})
      print(df.sort_values("amount", ascending=False).head(2))
    options:
      - "0, 1"
      - "3, 2"
      - "1, 2"
      - "2, 3"
    answer: 1
    explain: "정렬은 행을 통째로 옮기고 원래 행 번호를 들고 가요. 영화관(3번)이 1위, 분식집(2번)이 2위라 3, 2 예요. 정렬 결과는 새 표라 df 의 순서는 그대로예요."
  - id: chained-assignment-use-loc
    q: "pandas 3.1.1 에서 실행했어요. 마지막 줄의 출력은?"
    code: |-
      import pandas as pd

      df = pd.DataFrame({"shop": ["영화관", "버스"], "amount": [15000, 1500]})
      df["amount"][0] = 14000
      print(df.loc[0, "amount"])
    options:
      - "14000"
      - "15000 (ChainedAssignmentError 경고와 함께)"
      - "KeyError: 0"
      - "None"
    answer: 1
    explain: "pandas 3 부터 df[\"amount\"] 로 꺼낸 열은 복사본처럼 동작해서, 이어 붙인 대입은 복사본만 바꾸고 경고(ChainedAssignmentError)를 내요. 원래 표는 15000 그대로예요. 한 칸은 df.loc[0, \"amount\"] = 14000 으로 고쳐요. 옛 pandas 2 자료에서는 이 방식이 통했어요."
  - id: computed-column-not-updated
    q: "금액을 고친 뒤 point 를 출력했어요. 결과는?"
    code: |-
      import pandas as pd

      df = pd.DataFrame({"shop": ["영화관", "버스"], "amount": [15000, 1500]})
      df["point"] = df["amount"] // 100
      df.loc[0, "amount"] = 14000
      print(df.loc[0, "point"])
    options:
      - "140"
      - "150"
      - "14000"
      - "NaN"
    answer: 1
    explain: "point 는 만들 때 계산해 둔 값이라 amount 를 바꿔도 저절로 바뀌지 않아요. 엑셀 수식과 다른 점이에요. 140 으로 만들려면 df[\"point\"] = df[\"amount\"] // 100 을 다시 실행해요."
  - id: groupby-sum-sorted
    q: "출력의 첫 줄(가장 위의 분류)은?"
    code: |-
      import pandas as pd

      df = pd.DataFrame({
          "category": ["식비", "교통", "식비", "문화", "식비"],
          "amount": [3200, 1500, 6500, 15000, 4800],
      })
      print(df.groupby("category")["amount"].sum().sort_values(ascending=False))
    options:
      - "식비 14500"
      - "문화 15000"
      - "교통 1500"
      - "식비 3"
    answer: 1
    explain: "groupby 는 같은 분류끼리 나누고, 묶음마다 더하고, 하나로 합쳐요. 식비 3200 + 6500 + 4800 = 14500, 문화 15000 이라 큰 순으로는 문화가 먼저예요. 식비 3 처럼 횟수를 세는 것은 value_counts() 예요."
commands:
  - cmd: "uv init --no-package --python 3.14 my-pandas"
    desc: "배포용 패키지가 아닌 실습용 프로젝트 폴더 만들기(파이썬 3.14)"
    group: uv
  - cmd: "uv add \"numpy==2.5.5\" \"pandas==3.1.1\""
    desc: "버전을 정해 NumPy 와 pandas 설치(.venv 가 없으면 만든다)"
    group: uv
  - cmd: "uv add --dev ipykernel"
    desc: "VS Code 노트북과 .venv 를 잇는 부품을 개발 도구로 설치"
    group: uv
  - cmd: "uv sync"
    desc: "pyproject.toml 과 uv.lock 대로 같은 환경 다시 만들기"
    group: uv
  - cmd: "ls -a"
    desc: "점(.)으로 시작하는 숨김 파일까지 보기"
    group: 터미널
  - cmd: "code ."
    desc: "지금 폴더를 VS Code 로 열기"
    group: 터미널
  - cmd: "Cmd + Shift + P → Create: New Jupyter Notebook"
    desc: "VS Code 에서 새 노트북 만들기"
    group: 단축키
  - cmd: "Shift + Enter"
    desc: "노트북 셀 실행하고 아래 셀로 넘어가기"
    group: 단축키
  - cmd: "import numpy as np / import pandas as pd"
    desc: "두 도구를 약속된 짧은 이름으로 불러오기"
    group: pandas
  - cmd: "np.array(리스트)"
    desc: "리스트를 NumPy 배열로 바꾸기(arr * 2 가 칸마다 계산된다)"
    group: pandas
  - cmd: "arr.sum() / arr.mean() / arr.min() / arr.max()"
    desc: "배열의 합계, 평균, 최소, 최대"
    group: pandas
  - cmd: "arr.shape / arr.dtype"
    desc: "배열의 모양((12,))과 값의 종류(int64)"
    group: pandas
  - cmd: "arr[arr >= 10000]"
    desc: "조건이 True 인 칸만 남기기(불리언 인덱싱)"
    group: pandas
  - cmd: "pd.DataFrame({\"열\": [...], \"열2\": [...]})"
    desc: "딕셔너리로 표 만들기(리스트 길이가 같아야 한다)"
    group: pandas
  - cmd: "df.shape / df.head(3) / df.tail(3) / df.info()"
    desc: "표의 크기, 앞 3줄, 뒤 3줄, 열별 빈칸과 종류"
    group: pandas
  - cmd: "df.columns"
    desc: "실제 열 이름 목록 보기(KeyError 날 때 확인)"
    group: pandas
  - cmd: "df[\"열\"] / df[[\"열1\", \"열2\"]]"
    desc: "열 하나는 Series, 여러 개는 표(대괄호 두 겹)로 꺼내기"
    group: pandas
  - cmd: "df[df[\"열\"] == 값]"
    desc: "조건이 True 인 행만 남기기(SQL 의 WHERE)"
    group: pandas
  - cmd: "df[(조건1) & (조건2)] / df[(조건1) | (조건2)]"
    desc: "그리고 / 또는 로 조건 잇기(조건마다 괄호)"
    group: pandas
  - cmd: "df.sort_values(\"열\", ascending=False).head(3)"
    desc: "큰 순으로 정렬해 상위 3건(행 번호는 따라간다)"
    group: pandas
  - cmd: "df[\"새열\"] = df[\"열\"] // 100"
    desc: "계산식으로 새 열 만들기(// 는 몫)"
    group: pandas
  - cmd: "del df[\"열\"]"
    desc: "열 지우기"
    group: pandas
  - cmd: "df.loc[행, \"열\"] = 값"
    desc: "행 번호와 열 이름으로 한 칸 고치기"
    group: pandas
  - cmd: "df.groupby(\"묶을열\")[\"계산할열\"].sum()"
    desc: "분류별 합계(SQL 의 GROUP BY)"
    group: pandas
  - cmd: "df[\"열\"].value_counts()"
    desc: "값마다 몇 번 나왔는지 많은 순으로 세기"
    group: pandas
terms:
  - word: "NumPy"
    definition: "숫자 묶음(배열)을 한 번에 계산하는 파이썬 도구. 보통 import numpy as np 로 불러온다."
  - word: "배열 (ndarray)"
    definition: "np.array 로 만드는 숫자 묶음. 연산이 모든 칸에 한 번에 들어가고, 한 가지 종류의 값만 담는다."
  - word: "불리언 인덱싱 (Boolean indexing)"
    definition: "칸마다 True/False 를 담은 줄을 대괄호에 넣어 True 인 칸이나 행만 남기는 방법. arr[arr >= 10000], df[df[\"열\"] == 값]."
  - word: "pandas"
    definition: "열 이름이 붙은 표를 다루는 파이썬 도구. 보통 import pandas as pd 로 불러온다."
  - word: "DataFrame"
    definition: "pandas 의 표. 열마다 이름과 종류(dtype)가 따로 있고, 행마다 행 번호(index)가 붙는다."
  - word: "Series"
    definition: "DataFrame 에서 열 하나를 꺼낸 한 줄짜리 데이터. 행 번호와 열 이름(Name), dtype 이 함께 붙는다."
  - word: "dtype"
    definition: "칸에 든 값의 종류. 정수는 int64, pandas 3 의 글자 열은 str(옛 버전은 object)."
  - word: "인덱스 (index)"
    definition: "pandas 가 행마다 붙이는 번호. 거르거나 정렬해도 원래 번호를 그대로 들고 간다."
  - word: "loc"
    definition: "df.loc[행, 열] 처럼 행 번호와 열 이름으로 칸 주소를 한 번에 짚는 방법. 한 칸을 고칠 때 쓴다."
  - word: "groupby"
    definition: "같은 값끼리 나누고, 묶음마다 계산하고, 결과를 하나로 합치는 집계. SQL 의 GROUP BY 와 같다."
