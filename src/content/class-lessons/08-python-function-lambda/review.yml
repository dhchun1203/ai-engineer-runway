# 08-python-function-lambda 복습 데이터. 퀴즈 id는 오답 기록 키(cl:<slug>:<id>)라 한 번 정하면 바꾸지 않는다.
# 새 문항은 아무 자리에 넣어도 되지만 id는 회차 안에서 겹치면 안 된다.
slug: 08-python-function-lambda
quiz:
  - id: default-keyword-arg
    q: "다음 코드에서 출력에 쓰이는 값은?"
    code: |-
      def say_hello(name="홍길동", age=30):
          print(f"{name}, {age}살")

      say_hello(age=25)
    options:
      - "name 은 홍길동, age 는 25"
      - "name 은 25, age 는 30"
      - "name 은 홍길동, age 는 30"
      - "인수가 하나 모자라 에러가 난다"
    answer: 0
    explain: "age=25 처럼 이름을 붙여 넘기면 그 매개변수만 바뀌고, 나머지는 기본값이 쓰여요. 이름 없이 say_hello(25) 로 넘기면 앞에서부터 들어가 name 이 25 가 돼요."
  - id: kwargs-is-dict
    q: "다음 코드의 출력은?"
    code: |-
      def user_info(**data):
          print(data)

      user_info(name="Minji", level=5)
    options:
      - "('Minji', 5)"
      - "{'name': 'Minji', 'level': 5}"
      - "['name', 'level']"
      - "name=Minji level=5"
    answer: 1
    explain: "** 두 개는 이름 = 값 으로 넘긴 인수를 딕셔너리로 받아요. 이름이 키, 값이 값이 돼요. * 하나면 튜플이에요."
  - id: code-after-return
    q: "다음 코드의 출력은?"
    code: |-
      def after_return():
          return 1
          print("never")

      print(after_return())
    options:
      - "never 다음 줄에 1"
      - "1"
      - "1 다음 줄에 never"
      - "None"
    answer: 1
    explain: "return 은 값을 돌려주면서 그 자리에서 함수를 끝내요. 그 아래 print(\"never\") 는 실행되지 않아요."
  - id: multiple-return-tuple
    q: "다음 코드의 출력은?"
    code: |-
      def calc_value(a, b):
          return a + b, a - b

      result = calc_value(10, 5)
      print(result, type(result))
    options:
      - "15 <class 'int'>"
      - "[15, 5] <class 'list'>"
      - "(15, 5) <class 'tuple'>"
      - "15 5 <class 'tuple'>"
    answer: 2
    explain: "return 뒤에 쉼표로 이어 쓰면 튜플 하나로 돌아와요. 변수 하나로 받으면 튜플 그대로이고, r1, r2 = 로 받으면 나누어 담겨요."
  - id: same-name-local
    q: "다음 코드의 출력 두 줄은?"
    code: |-
      message = "전역"

      def greeting():
          message = "지역"
          print(message)

      greeting()
      print(message)
    options:
      - "지역, 지역"
      - "전역, 전역"
      - "지역, 전역"
      - "전역, 지역"
    answer: 2
    explain: "함수 안에서 message = 를 쓰면 전역 변수를 바꾸는 게 아니라 같은 이름의 지역 변수가 새로 생겨요. 함수 밖 message 는 그대로예요."
  - id: global-unbound-local
    q: "다음 코드를 실행하면?"
    code: |-
      counter = 0

      def increase():
          counter += 1

      increase()
    options:
      - "counter 가 1 이 된다"
      - "함수 안에 새 counter 가 1 로 생긴다"
      - "UnboundLocalError 가 난다"
      - "아무 일도 일어나지 않는다"
    answer: 2
    explain: "함수 안에 counter = ... 가 있으면 파이썬은 counter 를 지역 변수로 봐요. 값이 들어가기 전에 counter + 1 을 읽으려 해서 UnboundLocalError 예요. 함수 첫 줄에 global counter 를 쓰면 전역 값이 바뀌어요."
  - id: map-object-once
    q: "다음 코드의 출력 두 줄은?"
    code: |-
      m = map(lambda x: x * 2, [1, 2, 3])
      print(list(m))
      print(list(m))
    options:
      - "[2, 4, 6] 이 두 번"
      - "[2, 4, 6] 다음 []"
      - "<map object> 가 두 번"
      - "두 번째에 에러가 난다"
    answer: 1
    explain: "map 은 하나씩 꺼내 주는 꾸러미를 돌려줘요. list() 로 한 번 다 꺼내면 비어서 두 번째는 [] 예요. 여러 번 쓸 거면 처음부터 list(...) 로 받아 둬요."
  - id: filter-vs-comprehension
    q: "다음 코드와 결과가 같은 것은?"
    code: |-
      list(filter(lambda x: x % 2 == 0, [1, 2, 3, 4, 5]))
    options:
      - "[x % 2 == 0 for x in [1, 2, 3, 4, 5]]"
      - "[x for x in [1, 2, 3, 4, 5] if x % 2 == 0]"
      - "[x + 2 for x in [1, 2, 3, 4, 5]]"
      - "list(map(lambda x: x % 2 == 0, [1, 2, 3, 4, 5]))"
    answer: 1
    explain: "filter 는 조건이 참인 요소만 남겨서 [2, 4] 예요. 같은 일을 리스트 컴프리헨션의 if 로 할 수 있어요. 첫 보기와 map 보기는 참 거짓 값 다섯 개를 만들어요."
  - id: max-without-key
    q: "다음 코드의 출력 두 줄은?"
    code: |-
      players = [("손흥민", 95), ("김민재", 60), ("이강인", 80)]
      print(max(players))
      print(max(players, key=lambda p: p[1]))
    options:
      - "둘 다 ('손흥민', 95)"
      - "('이강인', 80), ('손흥민', 95)"
      - "95, 95"
      - "('김민재', 60), ('손흥민', 95)"
    answer: 1
    explain: "key 가 없으면 튜플의 맨 앞 요소(이름)로 비교해서 글자 순서가 가장 뒤인 이강인이 나와요. key=lambda p: p[1] 을 줘야 점수로 비교해요. max 는 기준 값이 아니라 항목 전체를 돌려줘요."
  - id: rps-string-key-check
    q: "가위바위보 코드가 다음과 같을 때, 번호에 01 을 넣으면?"
    code: |-
      game_data = {"1": "가위", "2": "바위", "3": "보"}

      input_num = input("번호를 선택하세요. : ")   # 01 입력
      while int(input_num) < 1 or int(input_num) > 3:
          print("1 부터 3 까지의 숫자만 입력 가능합니다.")
          input_num = input("번호를 선택하세요. : ")
      print(game_data[input_num])
    options:
      - "가위로 처리된다"
      - "범위 안내가 나오고 다시 묻는다"
      - "범위 검사는 통과하고 KeyError: '01' 로 멈춘다"
      - "ValueError 로 멈춘다"
    answer: 2
    explain: "int(\"01\") 은 1 이라 검사는 통과하지만, 딕셔너리는 바꾸기 전 문자열 \"01\" 로 찾아서 KeyError 예요. 검사한 값과 쓰는 값이 달라서 생긴 틈이에요. input_num not in game_data 로 문자열 그대로 검사하면 막혀요."
commands:
  - cmd: "def 함수이름(매개변수):"
    desc: 함수 만들기. 콜론과 들여쓰기가 범위, 이름은 snake_case
    group: Python
  - cmd: def f(name="홍길동")
    desc: 기본값. 인수를 안 넘기면 이 값이 쓰임
    group: Python
  - cmd: f(age=25)
    desc: 키워드 인수. 이름을 붙여 원하는 매개변수에만 넘기기
    group: Python
  - cmd: "def f(*args):"
    desc: 가변 인수. 넘긴 값을 개수 상관없이 튜플로 받기
    group: Python
  - cmd: "def f(**kwargs):"
    desc: 딕셔너리 가변 인수. 이름 = 값 으로 넘긴 인수를 딕셔너리로 받기
    group: Python
  - cmd: return 값
    desc: 값을 돌려주고 함수를 그 자리에서 끝내기. 없으면 None
    group: Python
  - cmd: return a, b
    desc: 여러 값을 튜플 하나로 돌려주기. r1, r2 = f() 로 나눠 받기
    group: Python
  - cmd: sum(값들)
    desc: 합계. 빈 튜플이나 빈 리스트면 0
    group: Python
  - cmd: type(값)
    desc: 자료형 확인. .py 파일에서는 print 로 감싸야 보임
    group: Python
  - cmd: global 변수명
    desc: 함수 안에서 전역 변수를 바꾸겠다고 알리기. 없이 += 하면 UnboundLocalError
    group: Python
  - cmd: "lambda 매개변수: 표현식"
    desc: 이름 없는 한 줄 함수. 식의 결과가 반환값
    group: Python
  - cmd: list(map(함수, 데이터))
    desc: 모든 요소에 함수를 적용한 리스트. map 은 한 번 꺼내면 비어요
    group: Python
  - cmd: list(filter(함수, 데이터))
    desc: 함수 결과가 참인 요소만 남긴 리스트
    group: Python
  - cmd: "[값 for 변수 in 데이터 if 조건]"
    desc: 리스트 컴프리헨션. 새 리스트를 한 줄로 만들기
    group: Python
  - cmd: "sorted(데이터, key=lambda p: p[1], reverse=True)"
    desc: key 기준으로 정렬한 새 리스트. reverse=True 면 내림차순
    group: Python
  - cmd: "max(데이터, key=lambda p: p[1])"
    desc: key 기준 값이 가장 큰 항목 전체. min 도 같은 방식
    group: Python
  - cmd: 문자열.strip()
    desc: 앞뒤 공백 지우기
    group: Python
  - cmd: '"=" * 30'
    desc: 문자열을 30번 이어 붙여 구분선 만들기
    group: Python
  - cmd: \t
    desc: 문자열 안의 탭(넓은 띄어쓰기)
    group: Python
terms:
  - word: 함수 (Function)
    definition: 반복되는 로직을 묶어 이름을 붙인 것. def 로 만들고 이름으로 불러 여러 번 다시 쓴다.
  - word: 매개변수 (Parameter)
    definition: 함수를 정의할 때 괄호 안에 쓰는, 받을 값의 이름.
  - word: 인수 (Argument)
    definition: 함수를 호출할 때 실제로 넘기는 값.
  - word: 가변 인수 (*args, **kwargs)
    definition: 개수를 정하지 않고 받는 인수. *args 는 튜플로, **kwargs 는 이름 = 값 을 딕셔너리로 받는다.
  - word: 반환값 (Return value)
    definition: return 으로 함수 밖에 돌려주는 값. return 이 없으면 None 이다.
  - word: 변수 스코프 (Scope)
    definition: 변수를 쓸 수 있는 범위. 함수 안에서 만든 지역 변수는 그 함수 안에서만, 함수 밖의 전역 변수는 어디서나 읽을 수 있다.
  - word: global
    definition: 함수 안에서 전역 변수의 값을 바꾸겠다고 알리는 키워드.
  - word: 람다식 (Lambda expression)
    definition: lambda 로 만드는 이름 없는 한 줄 함수. 식 하나의 결과를 돌려주며, map, filter, sorted 의 key 등에 잠깐 건넬 때 쓴다.
  - word: 리스트 컴프리헨션 (List comprehension)
    definition: 대괄호 안에 for 와 if 를 써서 새 리스트를 한 줄로 만드는 문법.
