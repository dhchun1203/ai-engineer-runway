terms:
  - word: "이웃 수 K (n_neighbors)"
    definition: "KNN이 투표를 받을 가까운 데이터 개수. 너무 작으면 한두 장에 휘둘리고, 너무 크면 먼 데이터까지 섞여 정확도가 떨어진다."
  - word: "유클리드 거리 (Euclidean Distance)"
    definition: "같은 칸끼리 차이를 제곱해 모두 더하고 제곱근을 씌운 거리. KNN이 사진 두 장의 비슷함을 재는 기본 방법이다."
  - word: "분류 (Classification)"
    definition: "답이 정해진 몇 가지 중 하나인 문제. 사람 번호 맞히기, 합격 불합격 맞히기가 분류이고, 점수 자체를 맞히는 것은 회귀다."
  - word: "로지스틱 회귀 (Logistic Regression)"
    definition: "선형회귀처럼 가중합을 낸 뒤 시그모이드로 0~1 확률로 바꿔, 0.5를 기준으로 둘 중 하나를 고르는 분류 모델."
  - word: "시그모이드 (Sigmoid)"
    definition: "1 ÷ (1 + e^(-z)). 아무 크기의 값 z를 0~1 사이로 눌러 준다. z가 0이면 0.5다."
  - word: "층화 나누기 (stratify)"
    definition: "train_test_split에서 정답 종류의 비율이 학습용과 시험용에 고르게 들어가게 나누는 옵션."
  - word: "정확도 (Accuracy)"
    definition: "전체 중 맞힌 비율. 분류 모델의 score와 accuracy_score가 돌려준다."
  - word: "혼동 행렬 (Confusion Matrix)"
    definition: "행이 실제 정답, 열이 예측인 표. 대각선이 맞힌 수, 나머지 칸이 어떤 답을 어떤 답으로 헷갈렸는지다."
