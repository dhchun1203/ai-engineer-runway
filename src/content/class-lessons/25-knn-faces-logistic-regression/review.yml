# 25-knn-faces-logistic-regression 복습 데이터. 퀴즈 id는 오답 기록 키(cl:<slug>:<id>)라 한 번 정하면 바꾸지 않는다.
# 문항의 코드와 출력은 맥에서 Python 3.14, pandas 3.1.1, scikit-learn 1.9.1로 실제 실행해 확인했다.
slug: 25-knn-faces-logistic-regression
quiz:
  - id: knn-majority-vote
    q: "가까운 이웃 3명에게 투표를 받아 답을 정해요. 출력은?"
    code: |-
      from sklearn.neighbors import KNeighborsClassifier

      X = [[1], [2], [3], [10], [11]]
      y = ["A", "A", "B", "B", "B"]

      model = KNeighborsClassifier(n_neighbors=3)
      model.fit(X, y)
      print(model.predict([[2.4]]))
    options:
      - "['A']"
      - "['B']"
      - "A"
      - "[0]"
    answer: 0
    explain: "2.4와 가까운 순서는 2(거리 0.4, A), 3(거리 0.6, B), 1(거리 1.4, A)이에요. 세 명 중 A가 두 표라 A예요. B가 전체로는 셋이지만 10, 11은 멀어서 투표에 들지 못해요. predict는 입력 묶음마다 답을 담은 배열을 돌려줘서 대괄호가 붙어요."
  - id: leave-one-out-mask
    q: "2번 자리 하나만 빼는 불리언 배열을 만들었어요. 출력은?"
    code: |-
      import numpy as np

      known = np.arange(5) != 2
      print(known.sum(), np.arange(5)[known])
    options:
      - "4 [0 1 3 4]"
      - "1 [2]"
      - "5 [0 1 2 3 4]"
      - "4 [0 1 2 3]"
    answer: 0
    explain: "np.arange(5)는 [0 1 2 3 4]이고, != 2는 2번 자리만 False예요. True는 1로 세서 sum이 4이고, 그 배열로 고르면 2를 뺀 [0 1 3 4]가 남아요. 수업에서 229번 사진을 뺀 399장을 만든 방법이에요."
  - id: pass-column-count
    q: "점수를 60점 기준 합격 열로 바꿔 합격자를 셌어요. 출력은?"
    code: |-
      import pandas as pd

      df = pd.DataFrame({
          "score": [47, 58, 60, 76, 87, 49, 73, 77, 79, 52]
      })
      y = df["score"] >= 60
      print(y.sum())
    options:
      - "6"
      - "4"
      - "5"
      - "10"
    answer: 0
    explain: "df[\"score\"] >= 60은 학생마다 True, False를 담은 열이고, sum은 True를 1로 세요. 60, 76, 87, 73, 77, 79가 True라 6명이에요. 60점도 >= 라서 합격이고, 4는 불합격자 수, 5는 > 60으로 셌을 때예요."
  - id: proba-pass-column
    q: "model.classes_가 [False, True]인 로지스틱 회귀예요. 새 학생 한 명의 합격(True) 확률을 꺼내는 코드는?"
    code: |-
      new_scaled = scaler.transform(new)

      # 합격 확률 = ?
    options:
      - "model.predict_proba(new_scaled)[0, 1]"
      - "model.predict_proba(new_scaled)[0, 0]"
      - "model.predict(new_scaled)[0]"
      - "model.predict_proba(new_scaled)[1, 0]"
    answer: 0
    explain: "predict_proba는 학생 한 줄마다 classes_ 순서대로 [False 확률, True 확률]을 돌려줘요. 0번째 학생의 1번째 칸이 합격 확률이에요(수업에서 92.58%). [0, 0]은 불합격 확률, predict는 확률이 아니라 True, False 답이고, 학생이 한 명이라 1번째 줄은 없어요."
  - id: confusion-matrix-read
    q: "실제 정답 4개와 예측 4개로 혼동 행렬을 만들었어요. 출력은(두 줄을 한 줄로 이어 적었어요)?"
    code: |-
      from sklearn.metrics import confusion_matrix

      actual = [False, True, True, False]
      pred = [False, True, False, False]
      print(confusion_matrix(actual, pred, labels=[False, True]))
    options:
      - "[[2 0] [1 1]]"
      - "[[2 1] [0 1]]"
      - "[[1 1] [0 2]]"
      - "[[3 1]]"
    answer: 0
    explain: "행이 실제, 열이 예측이에요. 실제 False 둘은 모두 False로 예측해 첫 행이 [2 0], 실제 True 둘 중 하나는 True, 하나는 False로 예측해 둘째 행이 [1 1]이에요. [[2 1] [0 1]]은 행과 열을 거꾸로 읽은 것이에요."
