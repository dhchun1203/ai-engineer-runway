# 문항의 코드와 출력은 맥에서 Python 3.14, pandas 3.1.1, scikit-learn 1.9.1로 실제 실행해 확인했다.
slug: 24-multiple-regression-split-scaling
quiz:
  - id: multi-predict-new-student
    q: "특징 세 개로 다중 선형회귀를 학습한 뒤 새 학생을 예측했어요. 출력은?"
    code: |-
      import pandas as pd
      from sklearn.linear_model import LinearRegression

      df = pd.DataFrame({
          "study_hours":    [1, 2, 3, 4, 5, 2, 3, 5, 4, 1],
          "sleep_hours":    [6, 8, 5, 7, 8, 5, 8, 6, 6, 8],
          "practice_count": [10, 15, 20, 25, 30, 12, 28, 22, 32, 8],
          "score":          [47, 58, 60, 76, 87, 49, 73, 77, 79, 52]
      })
      features = ["study_hours", "sleep_hours", "practice_count"]

      model = LinearRegression()
      model.fit(df[features], df["score"])

      new = pd.DataFrame({
          "study_hours": [5],
          "sleep_hours": [8],
          "practice_count": [30]
      })
      print(round(model.predict(new)[0], 2))
    options:
      - "87.09"
      - "87.0"
      - "78.6"
      - "[87.09]"
    answer: 0
    explain: "학습한 식은 5.80 × 공부 + 2.68 × 수면 + 0.63 × 문제 + 17.66이라 5.80 × 5 + 2.68 × 8 + 0.63 × 30 + 17.66 ≈ 87.09예요. 같은 값을 가진 4번 학생의 실제 점수는 87점이지만 모델은 87.09로 예측해요. 78.6은 공부 4, 수면 7, 문제 30인 학생이고, [0]으로 꺼냈으니 대괄호는 붙지 않아요."
  - id: split-shapes
    q: "학생 10명, 특징 3개인 X를 나눴어요. 출력은?"
    code: |-
      from sklearn.model_selection import train_test_split

      # X: 10행 3열 표, y: 값 10개
      X_train, X_test, y_train, y_test = train_test_split(
          X,
          y,
          test_size=0.3,
          random_state=42
      )
      print(X_train.shape, X_test.shape)
    options:
      - "(7, 3) (3, 3)"
      - "(3, 3) (7, 3)"
      - "(7,) (3,)"
      - "(10, 3) (3, 3)"
    answer: 0
    explain: "test_size=0.3이라 10명 중 3명이 시험용, 7명이 학습용이에요. 열(특징) 3개는 그대로라 (7, 3)과 (3, 3)이에요. 돌려받는 순서는 X 학습, X 시험, y 학습, y 시험이고, (7,)과 (3,)은 y_train, y_test의 모양이에요."
  - id: standardize-five-hours
    q: "공부 시간 다섯 개만 표준화했어요. 출력은?"
    code: |-
      from sklearn.preprocessing import StandardScaler

      hours = [[1], [2], [3], [4], [5]]
      result = StandardScaler().fit_transform(hours)
      print(result.ravel().round(2))
    options:
      - "[-1.41 -0.71  0.    0.71  1.41]"
      - "[-2. -1.  0.  1.  2.]"
      - "[0.   0.25 0.5  0.75 1.  ]"
      - "[-1.  -0.5  0.   0.5  1. ]"
    answer: 0
    explain: "평균은 3, 표준편차는 √2 ≈ 1.41(StandardScaler는 n으로 나눠요)이라 (1 - 3) ÷ 1.41 = -1.41, (2 - 3) ÷ 1.41 = -0.71이에요. 평균만 빼면 -2~2가 되고, 0~1로 줄이는 것은 표준화가 아니라 다른 스케일링(최소, 최대 맞추기)이에요."
  - id: transform-test-only
    q: "학습용으로 scaler를 맞췄어요. 시험용 X_test를 바꾸는 올바른 줄은?"
    code: |-
      from sklearn.preprocessing import StandardScaler

      scaler = StandardScaler()
      X_train_scaled = scaler.fit_transform(X_train)

      # X_test_scaled = ?
    options:
      - "X_test_scaled = scaler.transform(X_test)"
      - "X_test_scaled = scaler.fit_transform(X_test)"
      - "X_test_scaled = StandardScaler().fit_transform(X_test)"
      - "X_test_scaled = X_test"
    answer: 0
    explain: "시험용은 학습용에서 잰 평균, 표준편차로 바꾸기만(transform) 해요. fit_transform을 쓰면 시험용 3명의 평균으로 다시 재서 학습 때와 다른 자로 바꾼 셈이 되고, 새 StandardScaler도 마찬가지예요. 그대로 두면 모델이 배운 숫자 크기와 맞지 않아 엉뚱한 값이 나와요."
  - id: face-photo-numbers
    q: "얼굴 사진 데이터의 크기를 찍었어요. 출력은?"
    code: |-
      from sklearn.datasets import fetch_olivetti_faces

      faces = fetch_olivetti_faces(data_home="./datasets")
      print(faces.images.shape, faces.data.shape)
    options:
      - "(400, 64, 64) (400, 4096)"
      - "(400, 64, 64) (400, 64)"
      - "(40, 64, 64) (40, 4096)"
      - "(400, 4096) (400, 64, 64)"
    answer: 0
    explain: "40명이 10장씩 찍은 사진 400장이고, 한 장은 64 × 64 칸이에요. images는 사진 모양 그대로 (400, 64, 64), data는 한 장을 한 줄로 편 것이라 64 × 64 = 4096개씩 (400, 4096)이에요. 사람 수 40은 target의 서로 다른 값 개수예요."
commands:
  - cmd: "X = df[features]"
    desc: "열 이름 목록으로 여러 특징을 한 번에 골라 입력 표 만들기"
    group: pandas
  - cmd: "model.coef_"
    desc: "특징마다 하나씩 든 가중치 배열(features 순서)"
    group: scikit-learn
  - cmd: "w1, w2, w3 = model.coef_"
    desc: "값이 셋인 배열을 변수 셋에 차례로 나눠 담기"
