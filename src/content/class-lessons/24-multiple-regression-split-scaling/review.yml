terms:
  - word: "다중 선형회귀 (Multiple Linear Regression)"
    definition: "특징이 여러 개인 선형회귀. 특징마다 가중치가 하나씩 생겨 예측은 w1 x1 + w2 x2 + w3 x3 + b가 된다."
  - word: "가중치 (Weight)"
    definition: "그 특징이 1 오를 때 예측이 얼마나 오르는지. 단위가 다른 특징끼리는 크기를 바로 비교할 수 없다."
  - word: "학습 데이터와 테스트 데이터 (Train / Test)"
    definition: "모델이 배우는 데 쓰는 데이터와, 처음 보는 척 채점하는 데 쓰려고 떼어 둔 데이터. 학습한 데이터로 채점하면 점수가 후하게 나온다."
  - word: "특성 스케일링 (Feature Scaling)"
    definition: "서로 다른 단위나 크기를 가진 특징을 비슷한 척도로 바꾸는 전처리."
  - word: "표준화 (Standardization)"
    definition: "(값 - 평균) ÷ 표준편차로 바꿔 열마다 평균 0, 표준편차 1로 맞추는 스케일링. scikit-learn의 StandardScaler."
  - word: "fit_transform과 transform"
    definition: "fit_transform은 기준(평균, 표준편차)을 재고 바로 바꾸고, transform은 재 둔 기준으로 바꾸기만 한다. 학습용에 fit_transform, 시험용과 새 입력에 transform."
  - word: "픽셀 (Pixel)"
    definition: "사진을 이루는 점 하나. 흑백 사진에서는 0(검정)~1(흰색) 밝기 숫자 하나로 나타낸다."
  - word: "KNN (K-Nearest Neighbors)"
    definition: "새 데이터와 가장 가까운 데이터 K개를 찾아 그들의 정답으로 답을 정하는 방법. 얼굴 사진이라면 숫자 줄이 가장 비슷한 사진의 사람을 고른다."
