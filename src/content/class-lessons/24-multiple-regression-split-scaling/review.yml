    desc: "학습용에서 잰 기준으로 바꾸기만(시험용, 새 입력)"
    group: scikit-learn
  - cmd: "scaler.mean_, scaler.scale_"
    desc: "StandardScaler가 잰 열마다의 평균과 표준편차"
