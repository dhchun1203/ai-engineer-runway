# 12-python-shopping-cart-project 복습 데이터. 퀴즈 id는 오답 기록 키(cl:<slug>:<id>)라 한 번 정하면 바꾸지 않는다.
# 퀴즈 코드의 출력은 모두 직접 실행해 확인했다(2026-11-10).
slug: 12-python-shopping-cart-project
quiz:
  - id: shared-object-qty
    q: "다음 코드의 출력은?"
    code: |-
      class Item:
          def __init__(self, name, qty):
              self.name = name
              self.qty = qty

      tumbler = Item("텀블러", 10)
      cart = [tumbler]
      cart[0].qty = 9
      print(tumbler.qty)
    options:
      - "10"
      - "9"
      - "19"
      - "AttributeError"
    answer: 1
    explain: "cart[0] 과 tumbler 는 같은 객체를 가리켜요. 리스트에 넣는다고 복사되지 않아서, cart[0].qty 를 바꾸면 tumbler.qty 도 9가 돼요. 재고와 담은 수량을 qty 하나에 두면 이렇게 서로 덮어써요."
  - id: class-var-counter-order
    q: "다음 코드의 출력은?"
    code: |-
      class Product:
          next_number = 1

          def __init__(self, name):
              Product.next_number += 1
              self.number = Product.next_number

      a = Product("A")
      b = Product("B")
      print(a.number, b.number)
    options:
      - "1 2"
      - "2 3"
      - "3 3"
      - "1 1"
    answer: 1
    explain: "발급기를 먼저 올린 뒤 저장해서 첫 상품이 2번이 돼요. 1번부터 붙이려면 self.number = Product.next_number 로 먼저 저장하고, 그다음 Product.next_number += 1 로 올려요."
  - id: number-not-saved
    q: "다음 코드의 출력은?"
    code: |-
      class Product:
          number = 0

          def __init__(self, name):
              Product.number = self.number + 1

      a = Product("A")
      b = Product("B")
      c = Product("C")
      print(a.number, b.number, c.number)
    options:
      - "1 2 3"
      - "0 0 0"
      - "3 3 3"
      - "1 1 1"
    answer: 2
    explain: "클래스 변수만 올리고 객체에는 number 를 저장하지 않았어요. a.number 는 객체에 없으니 클래스의 Product.number 를 읽고, 그 값은 마지막에 3이에요. 셋 다 3이 나와요."
  - id: instance-assign-shadows
    q: "다음 코드의 출력은?"
    code: |-
      class Product:
          next_number = 1

      a = Product()
      a.next_number = 99
      print(Product.next_number, a.next_number)
    options:
      - "99 99"
      - "1 99"
      - "1 1"
      - "AttributeError"
    answer: 1
    explain: "객체 이름으로 대입하면 클래스 변수가 바뀌지 않고, 그 객체에 같은 이름의 속성이 새로 생겨 클래스 변수를 가려요. 클래스 변수는 Product.next_number = 값 처럼 클래스 이름으로 바꿔요."
  - id: mangled-stock
    q: "다음 코드의 출력은?"
    code: |-
      class Product:
          def __init__(self, stock):
              self.__stock = stock

          def get_stock(self):
              return self.__stock

      p = Product(10)
      p.__stock = 0
      print(p.get_stock())
    options:
      - "10"
      - "0"
      - "AttributeError"
      - "None"
    answer: 0
    explain: "클래스 안의 self.__stock 은 _Product__stock 으로 이름이 바뀌어 저장돼요. 밖에서 p.__stock = 0 을 쓰면 __stock 이라는 다른 속성이 하나 더 생길 뿐이라, get_stock() 은 그대로 10을 돌려줘요."
  - id: can-add-quantity
    q: "다음 코드의 출력은?"
    code: |-
      stock = 10
      in_cart = 9
      qty = 2
      can_add = stock - in_cart
      if qty > can_add:
          print(f"재고가 부족합니다. (담을 수 있는 수량: {can_add}개)")
      else:
          print("담았습니다.")
    options:
      - "담았습니다."
      - "재고가 부족합니다. (담을 수 있는 수량: 1개)"
      - "재고가 부족합니다. (담을 수 있는 수량: 10개)"
      - "재고가 부족합니다. (담을 수 있는 수량: 8개)"
    answer: 1
    explain: "담을 수 있는 수량은 재고에서 이미 담은 수량을 뺀 값이라 10 - 9 = 1이에요. 2는 1보다 커서 부족하다고 나와요. 재고는 결제 전까지 줄지 않으니 10 그대로 계산해요."
  - id: rate-discount-cap
    q: "다음 코드의 출력은?"
    code: |-
      class RateDiscount:
          def __init__(self, rate, max_amount):
              self.rate = rate
              self.max_amount = max_amount

          def discount_amount(self, total):
              return min(int(total * self.rate), self.max_amount)

      c = RateDiscount(0.1, 5000)
      print(c.discount_amount(313000), c.discount_amount(15000))
    options:
      - "31300 1500"
      - "5000 1500"
      - "5000 5000"
      - "31300 5000"
    answer: 1
    explain: "313,000원의 10%는 31,300원이지만 min() 이 5,000원을 넘지 않게 잘라요. 15,000원의 10%는 1,500원이라 그대로예요."
  - id: polymorphism-same-call
    q: "다음 코드의 출력은? (줄바꿈은 쉼표로 적었어요)"
    code: |-
      class Discount:
          def discount_amount(self, total):
              return 0

      class FixedDiscount(Discount):
          def __init__(self, amount, min_total):
              self.amount = amount
              self.min_total = min_total

          def discount_amount(self, total):
              if total >= self.min_total:
                  return self.amount
              return 0

      for c in [Discount(), FixedDiscount(3000, 20000)]:
          print(c.discount_amount(25000))
    options:
      - "0, 3000"
      - "3000, 3000"
      - "0, 0"
      - "25000, 22000"
    answer: 0
    explain: "같은 discount_amount(25000) 호출인데 객체마다 다르게 계산해요. 부모 Discount 는 항상 0, FixedDiscount 는 20,000원 이상이라 3,000을 돌려줘요. 이것이 다형성이에요."
  - id: shipping-after-discount
    q: "다음 코드의 출력은?"
    code: |-
      def shipping_fee(total, discount, line_count):
          if line_count == 0:
              return 0
          if total - discount >= 30000:
              return 0
          return 3000

      print(shipping_fee(32000, 3000, 1))
    options:
      - "0"
      - "3000"
      - "29000"
      - "32000"
    answer: 1
    explain: "배송비는 할인을 뺀 금액으로 정해요. 32,000 - 3,000 = 29,000원이라 30,000원보다 작아서 배송비 3,000원이 붙어요. 상품 합계만 보면 무료 배송처럼 보여서 헷갈려요."
  - id: menu-loop-no-input
    q: "다음 코드의 마지막 줄 출력은?"
    code: |-
      menu_choice = "x"
      count = 0
      while not menu_choice in ("1", "2", "q"):
          print("메뉴 항목 중 하나를 선택해주세요.")
          count += 1
          if count == 3:
              break
      print(count)
    options:
      - "1"
      - "3"
      - "0"
      - "메뉴 항목 중 하나를 선택해주세요."
    answer: 1
    explain: "while 안에서 menu_choice 가 바뀌지 않아서 조건이 계속 참이에요. 여기서는 count 가 3일 때 break 로 빠져나와 3이 찍혀요. break 도 input() 도 없으면 영원히 반복해요. 반복 안에서 input() 을 다시 받아야 해요."
