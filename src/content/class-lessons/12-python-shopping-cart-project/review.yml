terms:
  - word: "조합 (Composition)"
    definition: "한 객체가 다른 객체를 속성으로 가지는 구조. 장바구니 한 줄(CartLine)이 상품 객체를 item 으로 가리키는 것처럼 has-a 관계다."
  - word: "클래스 변수 (Class Variable)"
    definition: "클래스에 하나만 있고 모든 객체가 함께 보는 변수. 클래스이름.변수 로 바꾼다. 상품 자동 번호의 발급기 역할을 한다."
  - word: "인스턴스 변수 (Instance Variable)"
    definition: "self.이름 으로 객체마다 따로 갖는 변수. 같은 이름의 클래스 변수가 있으면 이쪽이 가린다."
  - word: "다형성 (Polymorphism)"
    definition: "같은 메서드 호출이 객체의 클래스에 따라 다르게 동작하는 것. 쿠폰 종류를 몰라도 discount_amount(합계) 하나로 부를 수 있다."
  - word: "캡슐화 (Encapsulation)"
    definition: "객체의 상태를 밖에서 직접 바꾸지 못하게 하고 메서드로만 바꾸게 하는 것. 재고는 decrease_stock() 으로만 줄인다."
  - word: "오버라이딩 (Overriding)"
    definition: "부모에게 물려받은 메서드를 자식이 같은 이름으로 다시 정의하는 것."
  - word: "참조 (Reference)"
    definition: "변수나 리스트 칸이 값을 복사해 갖지 않고 객체를 가리키는 것. 두 곳이 같은 객체를 가리키면 한쪽에서 바꾼 값이 다른 쪽에도 보인다."
