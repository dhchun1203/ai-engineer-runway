# 12-python-shopping-cart-project 복습 데이터. 퀴즈 id는 오답 기록 키(cl:<slug>:<id>)라 한 번 정하면 바꾸지 않는다.
# 2026-11-11 튜터 답안 기준으로 본문을 바꾸며 코드 이름을 맞췄다(mangled-stock 문항은 dict-get-default로 교체).
# 퀴즈 코드의 출력은 모두 직접 실행해 확인했다.
slug: 12-python-shopping-cart-project
quiz:
  - id: shared-object-qty
    q: "다음 코드의 출력은?"
    code: |-
      class Item:
          def __init__(self, name, qty):
              self.name = name
              self.qty = qty

      tumbler = Item("텀블러", 10)
      cart = [tumbler]
      cart[0].qty = 9
      print(tumbler.qty)
    options:
      - "10"
      - "9"
      - "19"
      - "AttributeError"
    answer: 1
    explain: "cart[0] 과 tumbler 는 같은 객체를 가리켜요. 리스트에 넣는다고 복사되지 않아서, cart[0].qty 를 바꾸면 tumbler.qty 도 9가 돼요. 재고와 담은 수량을 qty 하나에 두면 이렇게 서로 덮어써요."
  - id: class-var-counter-order
    q: "다음 코드의 출력은?"
    code: |-
      class Product:
          next_id = 1

          def __init__(self, name):
              Product.next_id += 1
              self.id = Product.next_id

      a = Product("A")
      b = Product("B")
      print(a.id, b.id)
    options:
      - "1 2"
      - "2 3"
      - "3 3"
      - "1 1"
    answer: 1
    explain: "발급기를 먼저 올린 뒤 저장해서 첫 상품이 2번이 돼요. 1번부터 붙이려면 튜터 답안처럼 self.id = Product.next_id 로 먼저 저장하고, 그다음 Product.next_id += 1 로 올려요."
  - id: number-not-saved
    q: "다음 코드의 출력은?"
    code: |-
      class Product:
          number = 0

          def __init__(self, name):
              Product.number = self.number + 1

      a = Product("A")
      b = Product("B")
      c = Product("C")
      print(a.number, b.number, c.number)
    options:
      - "1 2 3"
      - "0 0 0"
      - "3 3 3"
      - "1 1 1"
    answer: 2
    explain: "클래스 변수만 올리고 객체에는 number 를 저장하지 않았어요. a.number 는 객체에 없으니 클래스의 Product.number 를 읽고, 그 값은 마지막에 3이에요. 셋 다 3이 나와요."
  - id: instance-assign-shadows
    q: "다음 코드의 출력은?"
    code: |-
      class Product:
          next_id = 1

      a = Product()
      a.next_id = 99
      print(Product.next_id, a.next_id)
    options:
      - "99 99"
      - "1 99"
      - "1 1"
      - "AttributeError"
    answer: 1
    explain: "객체 이름으로 대입하면 클래스 변수가 바뀌지 않고, 그 객체에 같은 이름의 속성이 새로 생겨 클래스 변수를 가려요. 클래스 변수는 Product.next_id += 1 처럼 클래스 이름으로 바꿔요."
  - id: dict-get-default
    q: "다음 코드의 출력은?"
    code: |-
      items = {}
      items["텀블러"] = items.get("텀블러", 0) + 9
      items["텀블러"] = items.get("텀블러", 0) + 1
      print(items)
    options:
      - "{'텀블러': 10}"
      - "{'텀블러': 1}"
      - "{'텀블러': 9, '텀블러': 1}"
      - "KeyError"
    answer: 0
    explain: "get(키, 0) 은 키가 없으면 0을 돌려줘서 처음에는 0 + 9 = 9가 들어가요. 두 번째는 이미 있는 9를 꺼내 1을 더해 10이 돼요. 딕셔너리의 키는 하나뿐이라 같은 키에 대입하면 값이 바뀌어요. items[\"텀블러\"] 로 바로 읽었다면 처음에 KeyError 가 나요."
  - id: can-add-quantity
    q: "다음 코드의 출력은?"
    code: |-
      stock = 10
      in_cart_qty = 9
      qty = 2
      extra_qty = stock - in_cart_qty
      if qty > extra_qty:
          print(f"재고가 부족합니다. (담을 수 있는 수량: {extra_qty}개)")
      else:
          print("담았습니다.")
    options:
      - "담았습니다."
      - "재고가 부족합니다. (담을 수 있는 수량: 1개)"
      - "재고가 부족합니다. (담을 수 있는 수량: 10개)"
      - "재고가 부족합니다. (담을 수 있는 수량: 8개)"
    answer: 1
    explain: "담을 수 있는 수량은 재고에서 이미 담은 수량을 뺀 값이라 10 - 9 = 1이에요. 2는 1보다 커서 부족하다고 나와요. 재고는 결제 전까지 줄지 않으니 10 그대로 계산해요."
  - id: rate-discount-cap
    q: "다음 코드의 출력은?"
    code: |-
      class RateDiscount:
          def __init__(self, rate, max_discount):
              self.rate = rate
              self.max_discount = max_discount

          def discount_amount(self, total):
              return min(int(total * self.rate), self.max_discount)

      c = RateDiscount(0.1, 5000)
      print(c.discount_amount(313000), c.discount_amount(15000))
    options:
      - "31300 1500"
      - "5000 1500"
      - "5000 5000"
      - "31300 5000"
    answer: 1
    explain: "313,000원의 10%는 31,300원이지만 min() 이 5,000원을 넘지 않게 잘라요. 15,000원의 10%는 1,500원이라 그대로예요."
  - id: polymorphism-same-call
    q: "다음 코드의 출력은? (줄바꿈은 쉼표로 적었어요)"
    code: |-
      class Coupon:
          def __init__(self, name):
              self.name = name

          def discount_amount(self, total):
              return 0

      class FixedDiscount(Coupon):
          def __init__(self, amount, min_total):
              super().__init__("정액 할인")
              self.amount = amount
              self.min_total = min_total

          def discount_amount(self, total):
              return self.amount if total >= self.min_total else 0

      for c in [Coupon("쿠폰 없음"), FixedDiscount(3000, 20000)]:
          print(c.discount_amount(25000))
    options:
      - "0, 3000"
      - "3000, 3000"
      - "0, 0"
      - "25000, 22000"
    answer: 0
    explain: "같은 discount_amount(25000) 호출인데 객체마다 다르게 계산해요. 부모 Coupon 은 항상 0, FixedDiscount 는 20,000원 이상이라 3,000을 돌려줘요. 이것이 다형성이에요."
  - id: shipping-after-discount
    q: "다음 코드의 출력은?"
    code: |-
      def shipping(subtotal, discount, is_empty):
          if is_empty:
              return 0
          return 0 if subtotal - discount >= 30_000 else 3_000

      print(shipping(32_000, 3_000, False))
    options:
      - "0"
      - "3000"
      - "29000"
      - "32000"
    answer: 1
    explain: "배송비는 할인을 뺀 금액으로 정해요. 32,000 - 3,000 = 29,000원이라 30,000원보다 작아서 배송비 3,000원이 붙어요. 상품 합계만 보면 무료 배송처럼 보여서 헷갈려요."
  - id: menu-loop-no-input
    q: "다음 코드의 마지막 줄 출력은?"
    code: |-
      menu_choice = "x"
      count = 0
      while not menu_choice in ("1", "2", "q"):
          print("메뉴 항목 중 하나를 선택해주세요.")
          count += 1
          if count == 3:
              break
      print(count)
    options:
      - "1"
      - "3"
      - "0"
      - "메뉴 항목 중 하나를 선택해주세요."
    answer: 1
    explain: "while 안에서 menu_choice 가 바뀌지 않아서 조건이 계속 참이에요. 여기서는 count 가 3일 때 break 로 빠져나와 3이 찍혀요. break 도 input() 도 없으면 영원히 반복해요. 반복 안에서 input() 을 다시 받아야 해요."
commands:
  - cmd: "uv run main.py"
    desc: "완성한 장바구니 프로그램 실행(uv 없이 python main.py 도 돼요)"
    group: 터미널
  - cmd: "uv run product.py"
    desc: "파일 하나만 실행해 그 파일의 테스트 코드 돌려 보기"
    group: 터미널
  - cmd: "Product.next_id += 1"
    desc: "클래스 변수(발급기) 올리기. 저장(self.id = Product.next_id)이 먼저"
    group: Python
  - cmd: "self.items.get(product, 0)"
    desc: "딕셔너리에 키가 있으면 그 값, 없으면 0"
    group: Python
  - cmd: "del self.items[product]"
    desc: "딕셔너리에서 그 키를 통째로 지우기"
    group: Python
  - cmd: "for p, q in self.items.items():"
    desc: "딕셔너리의 키(상품)와 값(수량)을 함께 꺼내며 반복"
    group: Python
  - cmd: "sum(p.price * q for p, q in self.items.items())"
    desc: "제너레이터 식으로 가격 x 수량을 모두 더하기"
    group: Python
  - cmd: "self.items.clear()"
    desc: "딕셔너리를 비우기(결제 뒤 장바구니 비우기)"
    group: Python
  - cmd: "f\"{값:<10}\" / f\"{값:>8,}\""
    desc: "10칸 왼쪽 정렬 / 8칸 오른쪽 정렬에 천 단위 쉼표"
    group: Python
  - cmd: "class RateDiscount(Coupon):"
    desc: "Coupon 을 물려받는 자식 클래스 만들기"
    group: Python
  - cmd: "super().__init__(이름)"
    desc: "자식의 __init__ 에서 부모의 __init__ 부르기(이름 저장은 부모가)"
    group: Python
  - cmd: "min(a, b)"
    desc: "둘 중 작은 값. 할인 상한을 넘지 않게 자를 때"
    group: Python
  - cmd: "int(실수)"
    desc: "소수점 아래를 버리고 정수로. 원 단위 미만 버림"
    group: Python
terms:
  - word: "조합 (Composition)"
    definition: "한 객체가 다른 객체를 속성으로 가지는 구조. 장바구니(Cart)가 상품 객체를 딕셔너리 키로, 쿠폰 객체를 coupon 으로 가지는 것처럼 has-a 관계다."
  - word: "클래스 변수 (Class Variable)"
    definition: "클래스에 하나만 있고 모든 객체가 함께 보는 변수. 클래스이름.변수 로 바꾼다. 상품 자동 번호의 발급기(Product.next_id) 역할을 한다."
  - word: "인스턴스 변수 (Instance Variable)"
    definition: "self.이름 으로 객체마다 따로 갖는 변수. 같은 이름의 클래스 변수가 있으면 이쪽이 가린다."
  - word: "__str__ (문자열 표현)"
    definition: "print(객체) 를 했을 때 찍힐 글자를 돌려주는 메서드. 상품목록 한 줄처럼 객체를 어떻게 보여 줄지 정한다."
  - word: "super()"
    definition: "자식 클래스에서 부모 클래스의 메서드를 부르는 방법. super().__init__(이름) 으로 이름 저장을 부모에게 맡긴다."
  - word: "오버라이딩 (Overriding)"
    definition: "부모에게 물려받은 메서드를 자식이 같은 이름으로 다시 정의하는 것. 쿠폰마다 discount_amount 를 다르게 쓴다."
  - word: "다형성 (Polymorphism)"
    definition: "같은 메서드 호출이 객체의 클래스에 따라 다르게 동작하는 것. 쿠폰 종류를 몰라도 discount_amount(합계) 하나로 부를 수 있다."
  - word: "제너레이터 식 (Generator Expression)"
    definition: "괄호 안에 for 를 쓴 식. sum(가격 * 수량 for ...) 처럼 리스트를 따로 만들지 않고 값을 하나씩 만들어 넘긴다."
  - word: "참조 (Reference)"
    definition: "변수나 리스트 칸, 딕셔너리 키가 값을 복사해 갖지 않고 객체를 가리키는 것. 두 곳이 같은 객체를 가리키면 한쪽에서 바꾼 값이 다른 쪽에도 보인다."
