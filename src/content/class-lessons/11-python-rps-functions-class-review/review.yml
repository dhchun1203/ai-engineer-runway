slug: 11-python-rps-functions-class-review
quiz:
  - id: draw-counts-as-loss
    q: "다음 코드의 출력은?"
    code: |-
      def check_result(user_number, computer_number):
          if user_number == 1 and computer_number == 3: return "승리"
          if user_number == 2 and computer_number == 1: return "승리"
          if user_number == 3 and computer_number == 2: return "승리"

          return "패배"

      print(check_result(2, 2))
    options:
      - "승리"
      - "패배"
      - "무승부"
      - "None"
    answer: 1
    explain: "이기는 세 가지만 검사하고 나머지는 모두 \"패배\"를 돌려줘요. 같은 손(2, 2)은 어느 승리 조건에도 안 맞으니 패배예요. 맨 앞에 if user_number == computer_number: return \"무승부\" 를 넣어야 비김이 따로 잡혀요."
  - id: and-loop-condition
    q: "다음 코드의 출력은?"
    code: |-
      GOAL_WINS = 2
      my_wins = 2
      computer_wins = 1
      print(my_wins < GOAL_WINS and computer_wins < GOAL_WINS)
    options:
      - "True"
      - "False"
      - "2"
      - "1"
    answer: 1
    explain: "and 는 양쪽이 모두 참일 때만 True 예요. my_wins < 2 가 거짓(2 < 2)이라 전체가 False 예요. 그래서 한쪽이 2승이 되면 while 반복이 끝나요."
  - id: return-ends-loop
    q: "다음 코드의 출력은?"
    code: |-
      def first_valid(answers):
          for answer in answers:
              if answer in ("1", "2", "3"):
                  return int(answer)
              print("다시")

      print(first_valid(["a", "5", "2", "3"]))
    options:
      - "다시, 다시, 2"
      - "다시, 다시, 2, 3"
      - "2"
      - "다시, 다시, 다시, 2"
    answer: 0
    explain: "\"a\", \"5\" 는 허락된 값이 아니라 \"다시\"를 두 번 찍어요. \"2\" 에서 return 이 값을 돌려주며 함수와 반복을 그 자리에서 끝내서, \"3\" 은 보지도 않아요."
  - id: enumerate-start-one
    q: "다음 코드의 출력은?"
    code: |-
      records = ["가위 vs 보 => 승리", "바위 vs 보 => 패배"]
      for number, record in enumerate(records, start=1):
          print(f"{number}판 : {record}")
    options:
      - "0판 : 가위 vs 보 => 승리 / 1판 : 바위 vs 보 => 패배"
      - "1판 : 가위 vs 보 => 승리 / 2판 : 바위 vs 보 => 패배"
      - "1판 : 가위 vs 보 => 승리 (한 줄만)"
      - "TypeError"
    answer: 1
    explain: "enumerate 는 (번호, 값) 묶음을 꺼내 주고, start=1 이라 번호가 1부터 시작해요. start 를 빼면 0판, 1판이 돼요. for number, record 는 그 튜플을 두 변수로 나눠 받아요."
  - id: strip-lower-yes
    q: "다음 코드의 출력은?"
    code: |-
      answer = "  Yes ".strip().lower()
      print(answer == "yes" or answer == "y")
    options:
      - "True"
      - "False"
      - "yes"
      - "AttributeError"
    answer: 0
    explain: ".strip() 이 앞뒤 공백을 지워 \"Yes\", 이어서 .lower() 가 소문자로 바꿔 \"yes\" 가 돼요. 그래서 비교가 True 예요. 대소문자와 공백이 섞인 입력도 받아 주는 방법이에요."
  - id: conditional-expression-print
    q: "다음 코드의 출력은?"
    code: |-
      for co_wins in [1, 0, 2]:
          print(f"{co_wins} 연승") if co_wins > 0 else ""
    options:
      - "1 연승, 0 연승, 2 연승"
      - "1 연승, 2 연승"
      - "1 연승, (빈 줄), 2 연승"
      - "SyntaxError"
    answer: 1
    explain: "조건 표현식은 조건이 참일 때만 print() 를 실행해요. 0 일 때는 빈 문자열 \"\" 이 만들어졌다가 버려질 뿐 아무것도 찍히지 않아요. 동작만 할 때는 평범한 if 가 더 읽기 쉬워요."
  - id: name-when-imported
    q: "greet.py 에 아래 한 줄이 있어요. 같은 폴더의 main.py 에 import greet 만 쓰고 python main.py 로 실행하면 출력은?"
    code: |-
      # greet.py
      print(__name__)
    options:
      - "__main__"
      - "greet"
      - "main"
      - "아무것도 출력되지 않는다"
    answer: 1
    explain: "import 는 그 파일을 한 번 실행해서 print 가 돌아요. 직접 실행한 파일이 아니라 불러온 파일이라 __name__ 은 파일 이름 greet 예요. python greet.py 로 직접 실행하면 __main__ 이에요. 그래서 if __name__ == \"__main__\": 으로 감싸면 import 할 때는 게임이 시작되지 않아요."
  - id: return-comparison-bool
    q: "다음 코드의 출력은?"
    code: |-
      GOAL_WINS = 2
      def finish(my_wins):
          return my_wins == GOAL_WINS

      print(finish(1), finish(2))
    options:
      - "1 2"
      - "False True"
      - "None None"
      - "True False"
    answer: 1
    explain: "my_wins == GOAL_WINS 는 비교라서 결과가 True 나 False 예요. 1 == 2 는 False, 2 == 2 는 True 예요. 그래서 부르는 쪽에서 if my_won: 처럼 바로 조건에 쓸 수 있어요."
  - id: sibling-class-no-method
    q: "다음 코드를 실행하면?"
    code: |-
      class Animal:
          def sound(self):
              print("소리를 냅니다.")

      class Dog(Animal):
          def bark(self):
              print("멍멍")

      class Cat(Animal):
          def sound(self):
              print("야옹")

      nabi = Cat()
      nabi.sound()
      nabi.bark()
    options:
      - "야옹 다음 줄에 멍멍"
      - "소리를 냅니다. 다음 줄에 멍멍"
      - "야옹 이 찍히고 AttributeError: 'Cat' object has no attribute 'bark'"
      - "처음부터 AttributeError"
    answer: 2
    explain: "Cat 은 sound 를 오버라이딩해서 야옹 이 먼저 찍혀요. 그런데 bark 는 Dog 에만 있어요. 상속은 부모에서 자식으로만 흘러서, 같은 부모를 둔 형제 Cat 도 bark 를 갖고 있지 않아요."
  - id: setter-plus-equals
    q: "다음 코드의 출력은?"
    code: |-
      class Wallet:
          def __init__(self):
              self.__money = 1000

          def get_money(self):
              return self.__money

          def set_money(self, amount):
              if amount >= 0:
                  self.__money += amount
              else:
                  print("잘못된 값입니다.")

      wallet = Wallet()
      wallet.set_money(500)
      wallet.set_money(500)
      print(wallet.get_money())
    options:
      - "500"
      - "1000"
      - "1500"
      - "2000"
    answer: 3
    explain: "set_money 안이 = 가 아니라 += 라서 부를 때마다 더해져요. 1000 + 500 + 500 = 2000 이에요. 이름은 set(정하기)인데 동작은 더하기라 헷갈리니, = 로 바꾸거나 이름을 add_money 로 맞추는 게 좋아요."
commands:
  - cmd: enumerate(리스트, start=1)
    desc: 값마다 번호를 붙여 (번호, 값) 묶음으로 꺼내기. start 가 없으면 0부터
    group: Python
  - cmd: "for 번호, 값 in enumerate(리스트):"
    desc: 번호와 값을 두 변수로 나눠 받으며 반복
    group: Python
  - cmd: 문자열.strip().lower()
    desc: 앞뒤 공백을 지우고 소문자로 바꾸기. Y, " Yes " 도 yes 로
    group: Python
  - cmd: "if 값 in (\"1\", \"2\", \"3\"):"
    desc: 허락된 값 중 하나인지 문자열 그대로 검사
    group: Python
  - cmd: "while True: ... return 값"
    desc: 맞는 값이 올 때까지 반복하다 return 으로 함수와 반복을 함께 끝내기
    group: Python
  - cmd: return a == b
    desc: 비교 결과 True 또는 False 를 돌려주기
    group: Python
  - cmd: 값1 if 조건 else 값2
    desc: 조건 표현식. 조건이 참이면 값1, 거짓이면 값2
    group: Python
  - cmd: "if __name__ == \"__main__\":"
    desc: 파일을 직접 실행할 때만 아래 코드를 실행(import 할 때는 건너뜀)
    group: Python
  - cmd: 상수 = 값 (대문자 이름)
    desc: 바꾸지 않을 값이라는 약속. 예 GOAL_WINS = 2
    group: Python
  - cmd: random.randint(1, 3)
    desc: 1부터 3까지 정수 하나를 무작위로. 끝값 3도 포함
    group: Python
  - cmd: 변수 is None
    desc: 값이 None 인지 확인
    group: Python
terms:
  - word: 상수 (Constant)
    definition: 프로그램이 도는 동안 바꾸지 않을 값. 파이썬에서는 이름을 대문자로 써서 표시하는 약속이다(GOAL_WINS).
  - word: 조건 표현식 (Conditional Expression)
    definition: 값1 if 조건 else 값2 처럼 조건에 따라 둘 중 하나의 값이 되는 식. 값을 고를 때 쓴다.
  - word: enumerate
    definition: 반복할 때 값마다 번호를 붙여 (번호, 값) 튜플로 꺼내 주는 함수. start 로 시작 번호를 정한다.
  - word: __name__
    definition: 파이썬이 파일마다 넣어 주는 이름표. 직접 실행하면 "__main__", import 되면 파일 이름이다.
  - word: 진입점 (Entry Point)
    definition: '프로그램이 시작되는 곳. 보통 main() 함수를 만들고 if __name__ == "__main__": 아래에서 부른다.'
  - word: 입력 검증 (Input Validation)
    definition: 받은 값이 쓸 수 있는 값인지 먼저 확인하는 것. 문자열 그대로 검사한 뒤 int() 로 바꾸면 오류 없이 다시 물을 수 있다.
  - word: 기본 클래스 (Base Class)
    definition: 상속에서 물려주는 쪽 클래스. Super Class, Parent Class 라고도 부른다.
  - word: 메서드 오버라이딩 (Method Overriding)
    definition: 부모에 있는 메서드를 자식 클래스가 같은 이름으로 다시 정의하는 것.
  - word: 이름 변형 (Name Mangling)
    definition: 클래스 안의 __속성 을 _클래스이름__속성 으로 바꿔 저장하는 것. 실수 방지용이지 완전한 잠금이 아니다.
