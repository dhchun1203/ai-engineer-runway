# 01-terminal-git 복습 데이터. 퀴즈 id는 오답 기록 키(cl:<slug>:<id>)라 한 번 정하면 바꾸지 않는다.
# 새 문항은 아무 자리에 넣어도 되지만 id는 회차 안에서 겹치면 안 된다.
slug: 01-terminal-git
checklist:
  - id: class-01-git-version
    label: winget으로 Git 설치 후 git --version 확인
  - id: class-01-ls-al
    label: ls -al 출력의 d, l, - 와 rwx 읽어 보기
  - id: class-01-shortcuts
    label: Ctrl+u, Ctrl+w, history, !번호, cd - 직접 써 보기
  - id: class-01-shell
    label: echo $SHELL 로 셸 종류 확인
  - id: class-01-first-commit
    label: git init → add → commit → log 한 바퀴 해 보기
  - id: class-01-push
    label: GitHub 저장소를 만들어 push 해 보기
quiz:
  - id: git-vs-github
    q: Git과 GitHub에 대한 설명으로 맞는 것은?
    options:
      - GitHub에 연결하지 않으면 커밋을 만들 수 없다
      - Git은 내 컴퓨터에서 동작하는 도구이고, GitHub는 저장소를 올려 두고 함께 쓰는 서비스다
      - GitHub가 Git을 만들었고, 2005년에 공개했다
      - Git은 인터넷에 연결되어 있어야 지난 커밋을 볼 수 있다
    answer: 1
    explain: Git은 분산형이라 내 컴퓨터의 로컬 저장소에 전체 이력이 있어요. 인터넷 없이도 커밋하고 이력을 볼 수 있어요. Git은 리누스 토발즈가 2005년에 만들었고, GitHub는 Git 저장소를 호스팅하는 서비스예요.
  - id: add-staging
    q: README.md를 고친 뒤 git add README.md를 실행했어요. 이 변경은 지금 어디에 있나요?
    options:
      - 원격 저장소
      - Repository(로컬 저장소)
      - Staging Area
      - 아직 Working Directory에만 있다
    answer: 2
    explain: git add는 변경을 Staging Area(다음 커밋에 담을 목록)에 올려요. Repository에 들어가는 건 git commit을 한 다음이고, 원격 저장소로 가는 건 git push를 한 다음이에요.
  - id: revert-pushed
    q: 이미 push해서 팀원들이 받아 간 커밋을 취소하고 싶어요. 가장 알맞은 방법은?
    options:
      - git revert로 반대 변경을 담은 새 커밋을 만든다
      - git reset --hard로 그 커밋 이전으로 돌린 뒤 push --force 한다
      - git reset --soft로 커밋만 취소한다
      - .git 폴더를 지우고 처음부터 다시 만든다
    answer: 0
    explain: 공유된 이력은 revert로 고쳐요. 원래 커밋은 남겨 두고 정반대 변경을 새 커밋으로 쌓으니, 팀원은 pull만 하면 돼요. reset으로 이력을 지우면 팀원의 이력과 어긋나요.
  - id: reset-soft
    q: git reset --soft HEAD~1 을 실행한 직후, 마지막 커밋에 들어 있던 변경은 어떻게 되나요?
    options:
      - 완전히 사라진다
      - 작업 폴더에만 남고 Staging Area에서는 빠진다
      - 원격 저장소에서도 함께 지워진다
      - Staging Area에 그대로 담겨 있다
    answer: 3
    explain: "--soft는 커밋만 취소하고 변경은 Staging Area에 그대로 둬요. 실제로 실행 후 git status --short를 보면 맨 앞에 M이 붙은 \"M  README.md\"가 보여요. 작업 폴더에만 남기는 건 --mixed, 변경까지 버리는 건 --hard예요."
  - id: reset-default
    q: 옵션 없이 git reset HEAD~1 만 실행하면 어떤 옵션과 같나요?
    options:
      - "--soft"
      - "--mixed"
      - "--hard"
      - "--keep"
    answer: 1
    explain: 기본값은 --mixed예요. 커밋과 Staging을 취소하고, 작업 폴더의 변경은 남겨 둬요. 택배로 치면 상자에서 물건을 꺼내 방에 내려놓는 것과 같아요.
  - id: ls-al-line
    q: ls -al 결과에 다음 줄이 보여요. 이 줄에서 알 수 있는 것은?
    code: "-rw-r--r--  1 user group 12 Oct 26 16:01 README.md"
    options:
      - 폴더이고, 누구나 안에 파일을 만들 수 있다
      - 링크(바로가기)이고, 소유자만 실행할 수 있다
      - 일반 파일이고, 소유자만 쓸 수 있으며 나머지는 읽기만 할 수 있다
      - 일반 파일이고, 누구나 실행할 수 있다
    answer: 2
    explain: 첫 글자 -는 일반 파일이에요(d는 폴더, l은 링크). 다음 9글자를 셋씩 끊으면 소유자 rw-, 그룹 r--, 그 외 r--예요. 쓰기(w)는 소유자에게만 있고, 실행(x)은 아무에게도 없어요.
  - id: echo-redirect
    q: 다음을 차례로 실행하면 마지막 cat에서 무엇이 보이나요?
    code: |-
      echo "A" > note.txt
      echo "B" >> note.txt
      echo "C" > note.txt
      cat note.txt
    options:
      - A, B, C 세 줄
      - A, B 두 줄
      - B, C 두 줄
      - C 한 줄
    answer: 3
    explain: ">>는 파일 끝에 이어 쓰고, >는 파일을 새로 써요. 두 번째 줄까지는 A와 B 두 줄이었지만, 세 번째 줄의 >가 파일을 통째로 다시 써서 C 한 줄만 남아요."
  - id: cd-dash
    q: cd ~/projects 로 이동한 다음 cd /tmp 로 옮겼어요. 여기서 cd - 를 실행하면?
    options:
      - 홈 폴더(~)로 간다
      - ~/projects로 돌아간다
      - 한 칸 위 폴더(/)로 간다
      - 터미널이 종료된다
    answer: 1
    explain: cd -는 바로 전에 있던 폴더로 돌아가요. TV 리모컨의 "이전 채널" 버튼처럼 두 폴더를 오갈 때 편해요. 홈 폴더는 cd ~, 한 칸 위는 cd .. 예요.
  - id: clear-line
    q: 입력하던 긴 명령 줄을 한 번에 전부 지우는 단축키는?
    options:
      - Ctrl + u
      - Ctrl + w
      - Ctrl + a
      - Ctrl + l
    answer: 0
    explain: Ctrl + u는 입력 줄 전체를 지워요. Ctrl + w는 단어 하나씩 지우고, Ctrl + a는 줄 맨 앞으로 이동하고, Ctrl + l은 화면을 정리해요.
  - id: diff-staged
    q: README.md를 고치고 git add까지 했어요. 이 변경 내용을 확인하려면?
    options:
      - git diff
      - git log --oneline
      - git diff --staged
      - git restore README.md
    answer: 2
    explain: add 한 변경은 git diff --staged로 봐요. 이미 Staging으로 넘어갔기 때문에 git diff는 아무것도 보여 주지 않아요. git restore는 add 하지 않은 수정을 버리는 명령이라 여기서 쓰면 안 돼요.
  - id: winget-id
    q: 이름이 비슷한 패키지가 많을 때 Git을 가장 안전하게 설치하는 명령은?
    options:
      - winget install git
      - winget install --id Git.Git -e
      - winget search git --count 5
      - winget upgrade
    answer: 1
    explain: 설치는 ID 기준으로 하고, -e(--exact)로 정확히 일치하는 것만 고르면 엉뚱한 패키지를 받지 않아요. search는 찾기만 하고, upgrade는 이미 설치된 프로그램을 올리는 명령이에요.
  - id: env-committed
    q: .env 파일을 실수로 커밋해 GitHub에 push한 뒤에야 .gitignore에 추가했어요. 맞는 설명은?
    options:
      - .gitignore에 추가했으니 이제 안전하다
      - 파일을 지우는 커밋을 하나 더 하면 이력에서도 사라진다
      - push한 적이 있어도 GitHub가 비밀 값은 자동으로 가려 준다
      - 앞선 커밋에 키가 남아 있으니, 키를 새로 발급해 바꿔야 한다
    answer: 3
    explain: 한 번 커밋된 내용은 이력에 남아요. 지우는 커밋을 더해도 앞선 커밋을 거슬러 보면 키가 보여요. 그래서 이미 올라간 키는 새로 발급해 바꾸는 게 안전하고, .gitignore는 저장소를 만들자마자 만들어 둬요.
  - id: branch-pointer
    q: 브랜치에 대한 설명으로 맞는 것은?
    options:
      - 특정 커밋을 가리키는 움직이는 포인터다
      - 프로젝트 폴더를 통째로 복사한 사본이다
      - 원격 저장소에만 만들 수 있다
      - main 브랜치에서는 커밋할 수 없다
    answer: 0
    explain: 브랜치는 커밋을 가리키는 책갈피 같은 포인터예요. 새 커밋을 만들면 책갈피가 자동으로 그 커밋으로 옮겨가요. 폴더를 복사하지 않으니 가볍게 만들고 지울 수 있어요.
commands:
  - cmd: winget search <검색어>
    desc: 설치할 패키지의 이름과 ID 찾기
    group: winget
  - cmd: winget show <ID>
    desc: 패키지 상세 정보(버전, 설명) 보기
    group: winget
  - cmd: winget install <ID>
    desc: ID로 프로그램 설치
    group: winget
  - cmd: winget list
    desc: 설치된 프로그램 목록
    group: winget
  - cmd: winget upgrade
    desc: 업그레이드할 수 있는 프로그램 목록
    group: winget
  - cmd: winget uninstall <ID>
    desc: 프로그램 삭제
    group: winget
  - cmd: ls -al
    desc: 숨김 파일까지 자세히 보기(권한, 크기, 날짜)
    group: 터미널
  - cmd: chmod +x <파일>
    desc: 파일에 실행 권한 주기
    group: 터미널
  - cmd: pwd
    desc: 지금 있는 위치 출력
    group: 터미널
  - cmd: cd <폴더>
    desc: 폴더로 이동(.. 은 위로, ~ 은 홈)
    group: 터미널
  - cmd: cd -
    desc: 바로 전에 있던 폴더로 돌아가기
    group: 터미널
  - cmd: mkdir <폴더>
    desc: 폴더 만들기
    group: 터미널
  - cmd: touch <파일>
    desc: 빈 파일 만들기
    group: 터미널
  - cmd: cat <파일>
    desc: 파일 내용 보기
    group: 터미널
  - cmd: cp <원본> <대상>
    desc: 복사
    group: 터미널
  - cmd: mv <원본> <대상>
    desc: 이동, 또는 이름 바꾸기
    group: 터미널
  - cmd: rm <파일>
    desc: 파일 삭제(휴지통 없음)
    group: 터미널
  - cmd: rm -r <폴더>
    desc: 폴더를 안의 내용까지 삭제
    group: 터미널
  - cmd: echo $SHELL
    desc: 지금 쓰는 셸 이름 출력
    group: 터미널
  - cmd: echo "글자" > <파일>
    desc: 출력으로 파일을 새로 쓰기(덮어쓰기)
    group: 터미널
  - cmd: echo "글자" >> <파일>
    desc: 파일 끝에 이어 쓰기
    group: 터미널
  - cmd: history
    desc: 실행했던 명령어 목록(번호와 함께)
    group: 터미널
  - cmd: "!<번호>"
    desc: 그 번호의 명령어 다시 실행(!! 는 직전 명령)
    group: 터미널
  - cmd: Ctrl + u
    desc: 입력 중인 줄 전체 지우기
    group: 단축키
  - cmd: Ctrl + w
    desc: 단어 하나씩 지우기
    group: 단축키
  - cmd: Ctrl + a / Ctrl + e
    desc: 줄 맨 앞 / 맨 끝으로 이동
    group: 단축키
  - cmd: Ctrl + c
    desc: 실행 중인 명령 멈추기
    group: 단축키
  - cmd: Ctrl + l
    desc: 화면 정리(clear와 같음)
    group: 단축키
  - cmd: Ctrl + r
    desc: 명령어 기록 검색
    group: 단축키
  - cmd: Tab
    desc: 파일, 폴더 이름 자동 완성
    group: 단축키
  - cmd: git config --global user.name "이름"
    desc: 커밋에 남을 내 이름 등록(email도 같은 방식)
    group: Git
  - cmd: git init
    desc: 지금 폴더를 Git 저장소로 만들기(.git 폴더 생성)
    group: Git
  - cmd: git status
    desc: 지금 변경 상태 확인
    group: Git
  - cmd: git diff
    desc: 고쳤지만 아직 add 하지 않은 변경 보기
    group: Git
  - cmd: git diff --staged
    desc: add 한 변경 보기
    group: Git
  - cmd: git add .
    desc: 바뀐 파일 전부 Staging Area에 올리기
    group: Git
  - cmd: git commit -m "메시지"
    desc: 커밋 만들기
    group: Git
  - cmd: git log --oneline
    desc: 커밋 기록을 한 줄씩 보기
    group: Git
  - cmd: git restore <파일>
    desc: 수정 내용 되돌리기
    group: Git
  - cmd: git reset --soft HEAD~1
    desc: 마지막 커밋만 취소(변경은 Staging에 남음)
    group: Git
  - cmd: git reset HEAD~1
    desc: 커밋 취소 + Staging 비우기(기본값 --mixed, 변경은 파일에 남음)
    group: Git
  - cmd: git reset --hard HEAD~1
    desc: 커밋 취소 + 변경까지 삭제
    group: Git
  - cmd: git revert <해시>
    desc: 그 커밋을 거꾸로 되돌리는 새 커밋 만들기(이미 push한 경우)
    group: Git
  - cmd: git branch
    desc: 브랜치 목록
    group: Git
  - cmd: git switch -c <이름>
    desc: 새 브랜치를 만들고 이동
    group: Git
  - cmd: git switch <이름>
    desc: 브랜치 이동
    group: Git
  - cmd: git merge <이름>
    desc: 그 브랜치를 지금 브랜치에 합치기
    group: Git
  - cmd: git push
    desc: 로컬 커밋을 원격 저장소에 올리기
    group: Git
  - cmd: git pull
    desc: 원격 저장소의 새 커밋을 받아 오기
    group: Git
terms:
  - word: Git
    definition: 내 컴퓨터에서 코드 변경 이력을 기록하는 분산형 버전 관리 도구. 인터넷 없이도 커밋하고 이력을 볼 수 있다.
  - word: GitHub
    definition: Git 저장소를 올려 두고 함께 쓰는 서비스. Git을 만든 곳이 아니라 Git 저장소를 호스팅하는 곳이다.
  - word: Working Directory
    definition: 지금 내가 파일을 고치는 작업 폴더. 아직 Git에 담기 전의 상태.
  - word: Staging Area
    definition: 다음 커밋에 담을 변경을 모아 두는 곳. git add로 올린다.
  - word: Repository (저장소)
    definition: 커밋 이력이 쌓이는 곳. 정체는 프로젝트 폴더 안의 .git 폴더다.
  - word: 커밋 (commit)
    definition: 변경을 사진 한 장처럼 찍어 이력에 남기는 것. 해시라는 고유 번호가 붙는다.
  - word: 브랜치 (branch)
    definition: 커밋 하나를 가리키는 움직이는 책갈피. 새 커밋을 만들면 따라서 앞으로 간다.
  - word: GitFlow
    definition: main, develop, feature 같은 브랜치 역할을 팀이 정해 두고 나눠 쓰는 약속.
  - word: winget
    definition: 윈도우에서 명령어로 프로그램을 검색하고 설치하는 패키지 관리자.
  - word: 리다이렉션 (redirection)
    definition: 화면에 나올 출력을 파일로 보내는 것. > 는 덮어쓰기, >> 는 이어 쓰기.
  - word: .gitignore
    definition: Git이 추적하지 않을 파일 목록. 이미 커밋된 파일은 여기에 적어도 이력에서 지워지지 않는다.
