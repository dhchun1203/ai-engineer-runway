# 18-sql-aggregate-join-subquery 복습 데이터. 퀴즈 id는 오답 기록 키(cl:<slug>:<id>)라 한 번 정하면 바꾸지 않는다.
# 2026-11-18 본문을 월 매출 쿼리 리플레이로 바꾸면서 문항도 그 쿼리로 다시 짰다(UNION, 서브쿼리 문항 삭제).
# 행 수, 그룹 수, 오류 글자는 같은 건수와 합계로 만든 표를 PostgreSQL 엔진(PGlite)으로 실행해 확인했다.
slug: 18-sql-aggregate-join-subquery
quiz:
  - id: logical-execution-order
    q: "이 쿼리의 절이 실제로 도는 순서는?"
    code: |-
      SELECT s.sport_name AS 종목, SUM(e.pay_amount) AS 매출
      FROM sports s
      LEFT JOIN courses c ON c.sport_id = s.sport_id
      LEFT JOIN enrollments e ON e.course_id = c.course_id
      GROUP BY s.sport_id
      HAVING SUM(e.pay_amount) >= 1000000
      ORDER BY 종목;
    options:
      - "SELECT, FROM, JOIN, GROUP BY, HAVING, ORDER BY"
      - "FROM, JOIN, GROUP BY, HAVING, SELECT, ORDER BY"
      - "FROM, JOIN, SELECT, GROUP BY, HAVING, ORDER BY"
      - "FROM, JOIN, HAVING, GROUP BY, SELECT, ORDER BY"
    answer: 1
    explain: "표를 준비하는 FROM 과 JOIN 이 먼저, 그다음 묶고(GROUP BY) 바구니를 거르고(HAVING), 그 뒤에야 SELECT 가 열과 별칭을 만들어요. ORDER BY 는 마지막이라 별칭 종목 을 쓸 수 있어요."
  - id: having-cannot-use-alias
    q: "HAVING 을 이렇게 바꾸면 결과는?"
    code: |-
      SELECT s.sport_name AS 종목, SUM(e.pay_amount) AS 매출
      FROM sports s
      LEFT JOIN courses c ON c.sport_id = s.sport_id
      LEFT JOIN enrollments e ON e.course_id = c.course_id
      GROUP BY s.sport_id, e.enroll_month
      HAVING 매출 >= 1000000;
    options:
      - "그대로 4행이 나온다"
      - "ERROR: column \"매출\" does not exist"
      - "모든 그룹이 나온다"
      - "오류 없이 0행이 나온다"
    answer: 1
    explain: "별칭은 SELECT 가 돌 때 생기는데, HAVING 은 SELECT 보다 먼저 돌아요. 그래서 아직 매출 이라는 이름이 없어요. HAVING SUM(e.pay_amount) >= 1000000 처럼 식을 다시 써요. ORDER BY 는 SELECT 다음이라 별칭을 쓸 수 있어요."
  - id: aggregate-in-where-error
    q: "100만 원 조건을 WHERE 에 썼어요. 결과는?"
    code: |-
      SELECT s.sport_name, SUM(e.pay_amount)
      FROM sports s
      LEFT JOIN courses c ON c.sport_id = s.sport_id
      LEFT JOIN enrollments e ON e.course_id = c.course_id
      WHERE SUM(e.pay_amount) >= 1000000
      GROUP BY s.sport_id, e.enroll_month;
    options:
      - "HAVING 으로 쓴 것과 같은 결과"
      - "모든 그룹이 나온다"
      - "ERROR: aggregate functions are not allowed in WHERE"
      - "오류 없이 0행이 나온다"
    answer: 2
    explain: "WHERE 는 GROUP BY 보다 먼저 돌아서, 그때는 아직 더할 바구니가 없어요. 묶은 뒤의 조건은 HAVING 에 써요. 행 조건은 WHERE, 바구니 조건은 HAVING 이에요."
  - id: left-join-keeps-left-rows
    q: "14번 수영 마스터즈반은 수강 기록이 하나도 없어요. 이 FROM 절을 거친 뒤 마스터즈반은 어떻게 될까요?"
    code: |-
      FROM sports s
      LEFT JOIN courses c ON c.sport_id = s.sport_id
      LEFT JOIN enrollments e ON e.course_id = c.course_id
    options:
      - "짝이 없어서 행이 사라진다"
      - "enrollments 칸이 전부 NULL 인 행 1개로 남는다"
      - "수강 기록 수만큼 빈 행이 생긴다"
      - "ERROR 가 난다"
    answer: 1
    explain: "LEFT JOIN 은 왼쪽 행을 짝이 없어도 버리지 않고, 오른쪽에서 와야 할 칸을 NULL 로 채워요. 그냥 JOIN 이었다면 마스터즈반은 결과에서 빠졌을 거예요."
  - id: right-table-condition-in-on
    q: "LEFT JOIN 풀이에서 취소 조건을 ON 에서 WHERE 로 옮겼어요. 수영 마스터즈반의 NULL 행은 어떻게 될까요?"
    code: |-
      FROM sports s
      LEFT JOIN courses c ON c.sport_id = s.sport_id
      LEFT JOIN enrollments e ON e.course_id = c.course_id
      WHERE e.status <> '취소'
    options:
      - "그대로 남는다"
      - "취소 기록으로 바뀐다"
      - "빠진다. NULL <> '취소' 가 참이 아니라서"
      - "ERROR 가 난다"
    answer: 2
    explain: "WHERE 는 다 이은 뒤에 걸러요. NULL 행의 status 는 NULL 이고, NULL 과 비교한 조건은 참이 되지 않아 빠져요. 189행이 188행이 되어 INNER JOIN 과 같아져요. LEFT JOIN 에서 오른쪽 표의 조건은 ON 에 써요."
  - id: inner-join-on-or-where-same
    q: "INNER JOIN 풀이에서 취소 조건을 WHERE 에 쓴 (가)와 ON 에 붙인 (나)의 행 수는?"
    code: |-
      -- (가)
      FROM enrollments e
      JOIN courses c ON e.course_id = c.course_id
      WHERE e.status <> '취소'
      -- (나)
      FROM enrollments e
      JOIN courses c ON e.course_id = c.course_id AND e.status <> '취소'
    options:
      - "(가) 188행, (나) 200행"
      - "(가) 200행, (나) 188행"
      - "둘 다 188행"
      - "둘 다 200행"
    answer: 2
    explain: "INNER JOIN 은 짝이 없는 행을 어차피 버려서, 조건을 ON 에서 걸러도 WHERE 에서 걸러도 결과가 같아요. 수강 기록 200건 중 취소 12건이 빠져 188행이에요. 자리가 결과를 바꾸는 건 LEFT JOIN 일 때예요."
  - id: count-after-left-join
    q: "LEFT JOIN 풀이에서 수강월이 NULL 인 바구니(마스터즈반 행 1개)의 두 숫자는?"
    code: |-
      SELECT COUNT(*) AS 행수, COUNT(e.course_id) AS 기록수
      FROM sports s
      LEFT JOIN courses c ON c.sport_id = s.sport_id
      LEFT JOIN enrollments e ON e.course_id = c.course_id
                             AND e.status <> '취소'
      GROUP BY s.sport_id, e.enroll_month;
    options:
      - "0 | 0"
      - "1 | 1"
      - "1 | 0"
      - "그 바구니는 생기지 않는다"
    answer: 2
    explain: "COUNT(*)는 행 자체를 세서 NULL 행도 1이에요. COUNT(e.course_id)는 그 칸이 NULL 이라 건너뛰어 0이에요. LEFT JOIN 뒤에 몇 건인지 셀 때는 COUNT(오른쪽 열)을 써요."
  - id: null-group-fails-having
    q: "수강월이 NULL 인 바구니는 SUM(e.pay_amount)가 NULL 이에요. HAVING SUM(e.pay_amount) >= 1000000 을 거치면?"
    options:
      - "NULL 은 0으로 쳐서 탈락한다"
      - "NULL >= 1000000 이 참이 아니라서 탈락한다"
      - "NULL 은 비교할 수 없어 통과한다"
      - "ERROR 가 난다"
    answer: 1
    explain: "NULL 과 비교하면 결과도 NULL(모름)이고, HAVING 은 참인 바구니만 남겨요. 그래서 LEFT JOIN 이 남긴 여분의 행은 최종 결과에 닿지 못해요. 0으로 바꿔 계산하는 것도 아니에요."
  - id: group-by-unlisted-column
    q: "종목, 월별 매출과 함께 강좌 이름도 보려고 했어요. 결과는?"
    code: |-
      SELECT s.sport_name, c.course_name, SUM(e.pay_amount)
      FROM sports s
      LEFT JOIN courses c ON c.sport_id = s.sport_id
      LEFT JOIN enrollments e ON e.course_id = c.course_id
      GROUP BY s.sport_id, e.enroll_month;
    options:
      - "바구니마다 첫 강좌 이름이 나온다"
      - "ERROR: column \"c.course_name\" must appear in the GROUP BY clause or be used in an aggregate function"
      - "ERROR: column \"s.sport_name\" must appear in the GROUP BY clause or be used in an aggregate function"
      - "강좌마다 한 줄씩 나온다"
    answer: 1
    explain: "바구니 하나는 한 줄인데, 한 바구니에 강좌 이름이 여러 개라 무엇을 적을지 정할 수 없어요. s.sport_name 은 GROUP BY 에 없어도 괜찮아요. 묶은 s.sport_id 가 sports 의 기본 키라 이름도 하나로 정해지거든요."
  - id: left-vs-inner-group-count
    q: "GROUP BY 종목, 수강월 의 바구니가 LEFT JOIN 풀이는 17개, INNER JOIN 풀이는 16개예요. 하나 더 많은 이유는?"
    options:
      - "LEFT JOIN 은 취소 기록도 바구니로 만들어서"
      - "LEFT JOIN 이 남긴 마스터즈반 NULL 행이 수강월 NULL 바구니가 되어서"
      - "INNER JOIN 은 한 종목을 빼먹어서"
      - "LEFT JOIN 은 ORDER BY 로 바구니가 늘어나서"
    answer: 1
    explain: "4종목에 4개월이라 16바구니는 같아요. LEFT JOIN 풀이에는 기록 없는 마스터즈반이 NULL 행으로 남고, 수강월이 NULL 이라 따로 한 바구니가 돼요. 그 바구니는 HAVING 에서 빠져서 최종 결과는 두 풀이가 같아요."
commands:
  - cmd: "FROM 표A a JOIN 표B b ON a.키 = b.키"
    desc: "양쪽에 짝이 있는 행만 옆으로 잇기(INNER JOIN 과 같음)"
    group: SQL
  - cmd: "LEFT JOIN 표B b ON ..."
    desc: "왼쪽 표는 전부 살리고 짝 없는 칸은 NULL"
    group: SQL
  - cmd: "LEFT JOIN 표B b ON a.키 = b.키 AND b.열 <> 값"
    desc: "오른쪽 표 조건은 ON 에 쓰기(WHERE 에 쓰면 INNER JOIN 이 됨)"
    group: SQL
  - cmd: "RIGHT JOIN / FULL OUTER JOIN"
    desc: "오른쪽 표를 / 양쪽 표를 짝이 없어도 전부 살리기"
    group: SQL
  - cmd: "COUNT(*) / COUNT(열)"
    desc: "행 수 / NULL 을 뺀 수 세기"
    group: SQL
  - cmd: "SUM(열)"
    desc: "합계(NULL 은 건너뜀, 다 NULL 이면 NULL)"
    group: SQL
  - cmd: "GROUP BY 열1, 열2"
    desc: "두 열 값의 조합이 같은 행끼리 묶어 한 줄로 집계"
    group: SQL
  - cmd: "HAVING SUM(열) >= 1000000"
    desc: "묶은 뒤 바구니 거르기(별칭은 못 씀)"
    group: SQL
  - cmd: "ORDER BY 열 COLLATE \"ko-x-icu\", 별칭"
    desc: "한국어 규칙으로 정렬하고, 같으면 다음 열로(별칭 사용 가능)"
    group: SQL
terms:
  - word: "실행 순서 (Logical Query Order)"
    definition: "FROM/JOIN, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT 순서로 돈다. 그래서 별칭은 ORDER BY 에서만 쓸 수 있다."
  - word: "JOIN"
    definition: "ON 에 적은 규칙으로 짝을 지어 두 표를 옆으로 잇는다. 그냥 JOIN(INNER JOIN)은 양쪽에 짝이 있는 행만 남긴다."
  - word: "LEFT JOIN"
    definition: "왼쪽 표의 행을 짝이 없어도 전부 살리고, 오른쪽에서 와야 할 칸을 NULL 로 채운다. RIGHT JOIN 은 오른쪽을, FULL OUTER JOIN 은 양쪽을 살린다."
  - word: "표 별칭 (Table Alias)"
    definition: "FROM sports s 처럼 표에 붙이는 짧은 이름. s.sport_id 처럼 어느 표의 열인지 밝혀 ambiguous 오류를 막는다."
  - word: "집계 함수 (Aggregate Function)"
    definition: "여러 행을 받아 값 하나를 돌려주는 함수. COUNT, SUM 등이 있고 NULL 은 건너뛴다(COUNT(*) 는 행 자체를 센다)."
  - word: "GROUP BY"
    definition: "같은 값(조합)끼리 바구니에 담아 바구니마다 한 줄로 집계한다. SELECT 에는 묶은 열과 집계 함수만 올 수 있다."
  - word: "HAVING"
    definition: "GROUP BY 로 묶은 뒤 바구니를 거르는 자리. 묶기 전 행을 거르는 WHERE 와 달리 집계 조건을 쓸 수 있다."
  - word: "콜레이션 (Collation)"
    definition: "글자를 어떤 규칙으로 비교하고 정렬할지 정한 것. COLLATE \"ko-x-icu\" 는 한국어 규칙으로 정렬하라는 뜻이다."
