# 15-postgres-volume-sql-compose 복습 데이터. 퀴즈 id는 오답 기록 키(cl:<slug>:<id>)라 한 번 정하면 바꾸지 않는다.
# SQL 문항(serial-gap-after-failed-insert)의 결과는 PostgreSQL 엔진(PGlite)으로 직접 실행해 확인했다.
slug: 15-postgres-volume-sql-compose
quiz:
  - id: volume-keeps-data
    q: "다음처럼 볼륨을 붙여 띄운 DB에 표와 데이터를 넣었어요. 컨테이너를 지우고 같은 명령으로 다시 띄우면 표와 데이터는?"
    code: |-
      docker run -d --name my-pg -e POSTGRES_PASSWORD=admin -p 5432:5432 -v pg-data:/var/lib/postgresql postgres:18
      # (표와 데이터를 넣음)
      docker rm -f my-pg
      docker run -d --name my-pg -e POSTGRES_PASSWORD=admin -p 5432:5432 -v pg-data:/var/lib/postgresql postgres:18
    options:
      - "그대로 남아 있다"
      - "컨테이너와 함께 지워져 빈 DB가 된다"
      - "pg-data 이름이 겹쳐 두 번째 run 이 실패한다"
      - "표는 남지만 행은 지워진다"
    answer: 0
    explain: "데이터가 실제로 쌓이는 /var/lib/postgresql 이 컨테이너 밖 볼륨 pg-data 에 이어져 있어요. docker rm 은 컨테이너만 지우고 볼륨은 남겨요. 같은 -v 로 다시 띄우면 그 볼륨을 다시 붙여서 표와 데이터가 그대로 보여요."
  - id: password-ignored-existing-volume
    q: "데이터가 이미 든 볼륨 pg-data 를 붙여, 비밀번호만 바꿔 컨테이너를 새로 만들었어요. 접속 비밀번호는?"
    code: |-
      # 처음: -e POSTGRES_PASSWORD=admin 으로 만들고 데이터를 넣음
      docker rm -f my-pg
      docker run -d --name my-pg -e POSTGRES_PASSWORD=newpass -p 5432:5432 -v pg-data:/var/lib/postgresql postgres:18
    options:
      - "newpass 로 바뀐다"
      - "처음 정한 admin 그대로다"
      - "비밀번호가 없어진다"
      - "두 비밀번호 모두 통한다"
    answer: 1
    explain: "POSTGRES_PASSWORD 는 데이터 폴더가 비어 있을 때 처음 한 번만 읽혀요. 이미 데이터가 든 볼륨을 붙이면 초기화를 건너뛰니, 처음 정한 비밀번호가 그대로예요."
  - id: drop-if-exists-rerun
    q: "다음 my_shop.sql 을 psql 로 두 번 연달아 실행했어요. 두 번째 실행이 끝난 뒤 product 표의 행 수는?"
    code: |-
      DROP DATABASE IF EXISTS my_shop;
      CREATE DATABASE my_shop;
      \c my_shop
      CREATE TABLE product (id SERIAL PRIMARY KEY, name VARCHAR(100) NOT NULL, price INT NOT NULL, stock INT NOT NULL);
      INSERT INTO product (name, price, stock) VALUES
      ('무선 이어폰', 35000, 100), ('게이밍 마우스', 28000, 85), ('27인치 모니터', 259000, 15),
      ('USB-C 허브', 19900, 200), ('노트북 거치대', 24000, 7);
    options:
      - "10행"
      - "5행"
      - "CREATE DATABASE 에서 이미 있다는 오류가 나 0행"
      - "CREATE TABLE 에서 이미 있다는 오류가 나 5행 그대로"
    answer: 1
    explain: "맨 앞의 DROP DATABASE IF EXISTS 가 첫 실행에서 만든 my_shop 을 통째로 지우고 시작해요. 그래서 DB, 표, 데이터를 다시 만들어 늘 5행이 돼요. 몇 번을 실행해도 같은 상태가 되는 게 이 줄을 맨 앞에 두는 이유예요."
  - id: f-path-inside-container
    q: "my_shop.sql 은 내 PC의 pg_lab 폴더에만 있어요. docker cp 없이 바로 다음을 치면?"
    code: |-
      docker exec -it my-pg psql -U postgres -f //tmp/my_shop.sql
    options:
      - "내 PC의 pg_lab/my_shop.sql 을 찾아 실행한다"
      - "파일이 없다는 오류가 난다. -f 뒤 경로는 컨테이너 안 경로라서"
      - "psql 이 내 PC의 /tmp 를 자동으로 찾아 실행한다"
      - "빈 파일로 보고 아무것도 하지 않는다"
    answer: 1
    explain: "-f 뒤 경로는 psql 이 도는 컨테이너 안의 경로예요. 컨테이너 안 /tmp 에는 아직 파일이 없으니 못 찾아요. docker cp my_shop.sql my-pg:/tmp/my_shop.sql 로 먼저 넣거나, 복사 없이 < 로 흘려 보내요."
  - id: redirect-needs-i-only
    q: "Git Bash 에서 다음을 쳤더니 오류가 났어요. 어떻게 고칠까?"
    code: |-
      docker exec -it my-pg psql -U postgres < my_shop.sql
      # cannot attach stdin to a TTY-enabled container because stdin is not a terminal
    options:
      - "-it 를 -i 로 바꾼다"
      - "< 를 > 로 바꾼다"
      - "-U postgres 를 뺀다"
      - "my_shop.sql 을 //my_shop.sql 로 쓴다"
    answer: 0
    explain: "-t 는 키보드로 치는 터미널 화면을 붙이는 옵션이에요. < 로 파일을 흘려 보내면 입력이 키보드가 아니라 파일이라 -t 와 맞지 않아요. 입력만 보내는 -i 만 써요."
  - id: gitbash-tmp-conversion
    q: "Git Bash(UCRT64)에서 다음을 쳤더니 오류가 났어요. 원인은?"
    code: |-
      docker exec -it my-pg psql -U postgres -f /tmp/my_shop.sql
      # psql: error: C:/Users/.../Temp/my_shop.sql: No such file or directory
    options:
      - "docker cp 를 안 해서 컨테이너 안에 파일이 없다"
      - "Git Bash 가 / 로 시작하는 인자 /tmp 를 Windows 경로로 바꿔서 넘겼다"
      - "psql 이 Windows 경로만 읽는다"
      - "파일 이름에 _ 가 들어가서다"
    answer: 1
    explain: "오류 속 경로가 C:/Users/.../Temp 로 바뀌어 있는 게 단서예요. Git Bash 는 / 로 시작하는 인자를 Windows 경로로 바꿔요. //tmp 처럼 슬래시를 두 번 쓰거나, ~/.bashrc 에 export MSYS_NO_PATHCONV=1 을 넣어 변환을 꺼요. 파일이 아예 없었다면 경로가 /tmp/my_shop.sql 그대로 찍혔을 거예요."
  - id: serial-gap-after-failed-insert
    q: "product 에 상품 5개(id 1~5)가 들어 있어요. 다음을 차례로 실행하면 마지막 SELECT 의 결과는?"
    code: |-
      -- CREATE TABLE product (id SERIAL PRIMARY KEY, name VARCHAR(100) NOT NULL,
      --                       price INT NOT NULL, stock INT NOT NULL);
      INSERT INTO product (name, price) VALUES ('키보드', 45000);
      INSERT INTO product (name, price, stock) VALUES ('키보드', 45000, 30);
      SELECT id FROM product WHERE name = '키보드';
    options:
      - "6"
      - "7"
      - "6 과 7 두 행"
      - "첫 INSERT 오류로 아무 행도 없다"
    answer: 1
    explain: "첫 INSERT 는 stock 이 NOT NULL 이라 거절되지만, 그 전에 시퀀스에서 6번을 이미 받아 써 버려요(DETAIL: Failing row contains (6, 키보드, 45000, null).). 그래서 두 번째 INSERT 는 7번을 받아요. SERIAL 은 겹치지 않는 것만 보장하고 빈틈 없음은 보장하지 않아요."
  - id: volume-rm-needs-container-gone
    q: "my-pg 컨테이너를 docker stop 으로 끄기만 한 상태예요. 볼륨 pg-data 를 지우려면 어떤 순서로 쳐야 할까?"
    options:
      - "docker volume rm pg-data 만 치면 된다. 컨테이너가 꺼져 있으니까"
      - "docker rm -f my-pg 로 컨테이너를 먼저 지우고 docker volume rm pg-data"
      - "docker volume prune 을 치면 이름 있는 pg-data 도 지워진다"
      - "docker compose down 을 치면 지워진다"
    answer: 1
    explain: "볼륨을 쓰는 컨테이너가 남아 있으면 꺼져 있어도 볼륨을 지울 수 없어요. 컨테이너를 먼저 지우고 볼륨을 지운 뒤 docker volume ls 로 확인해요. prune(옵션 없음)은 익명 볼륨만 지워요."
  - id: compose-port-5433
    q: "오전에 띄운 my-pg 가 -p 5432:5432 로 켜져 있어요. 같은 PC에서 compose.yaml 로 두 번째 PostgreSQL 을 띄울 때 ports 로 알맞은 것은?"
    code: |-
      services:
        db:
          image: postgres:18
          container_name: shop-pg
          ports:
            - "????"
    options:
      - "\"5432:5432\""
      - "\"5433:5432\""
      - "\"5432:5433\""
      - "\"5433:5433\""
    answer: 1
    explain: "앞이 내 PC의 문, 뒤가 컨테이너 안의 문이에요. 내 PC 5432 는 my-pg 가 쓰고 있어 같은 번호면 port is already allocated 로 겹쳐요. 바깥 문만 5433 으로 바꾸고, 컨테이너 안 PostgreSQL 은 그대로 5432 에서 기다려요."
  - id: compose-external-volume
    q: "다음 compose.yaml 에서 맨 아래 external: true 를 지우고 docker compose up -d 하면 어떻게 될까?"
    code: |-
      services:
        db:
          image: postgres:18
          volumes:
            - pg-data:/var/lib/postgresql
      volumes:
        pg-data:
          external: true
    options:
      - "오전에 만든 pg-data 볼륨을 그대로 쓴다"
      - "pg-data 가 없다는 오류가 난다"
      - "프로젝트이름_pg-data 라는 새 볼륨이 생겨, 오전에 넣은 데이터가 안 보인다"
      - "볼륨 없이 띄워진다"
    answer: 2
    explain: "external: true 는 이미 밖에 있는 볼륨을 그대로 쓰라는 뜻이고, 그 볼륨이 없으면 오류를 내요. external 이 없으면 compose 가 프로젝트이름_pg-data 처럼 앞에 이름을 붙인 새 볼륨을 만들어서, 오전의 pg-data 와 다른 빈 보관함이 돼요."
commands:
  - cmd: "docker volume ls / docker volume create 이름 / docker volume inspect 이름"
    desc: "볼륨 목록 / 볼륨 만들기 / 볼륨 정보 보기"
    group: Docker
  - cmd: "docker volume rm 이름"
    desc: "이름을 적은 볼륨 지우기(쓰는 컨테이너가 없어야 함)"
    group: Docker
  - cmd: "docker volume prune"
    desc: "아무 컨테이너도 안 쓰는 익명 볼륨만 지우기(y/N 확인, 되돌릴 수 없음)"
    group: Docker
  - cmd: "docker volume prune -a"
    desc: "아무 컨테이너도 안 쓰는 볼륨을 이름 있는 것까지 전부 지우기"
    group: Docker
  - cmd: "docker run -d --name my-pg -e POSTGRES_PASSWORD=admin -p 5432:5432 -v pg-data:/var/lib/postgresql postgres:18"
    desc: "볼륨 pg-data 를 붙여 PostgreSQL 18 컨테이너 띄우기(이미지는 맨 끝)"
    group: Docker
  - cmd: "docker ps / docker ps -a"
    desc: "켜진 컨테이너 / 꺼진 것까지 전부 보기"
    group: Docker
  - cmd: "docker cp my_shop.sql my-pg:/tmp/my_shop.sql"
    desc: "내 PC 파일을 컨테이너 안 /tmp 로 복사"
    group: Docker
  - cmd: "docker rm -f my-pg"
    desc: "켜져 있어도 컨테이너를 강제로 지우기(볼륨은 남음)"
    group: Docker
  - cmd: "docker start my-pg"
    desc: "이미 있는 컨테이너를 다시 켜기(이름 겹침 오류가 날 때)"
    group: Docker
  - cmd: "docker exec -it my-pg psql -U postgres -f //tmp/my_shop.sql"
    desc: "컨테이너 안의 SQL 파일 실행(Git Bash 는 //tmp 로)"
    group: psql
  - cmd: "docker exec -i my-pg psql -U postgres < my_shop.sql"
    desc: "내 PC 파일을 복사 없이 입력으로 흘려 보내 실행(-i 만)"
    group: psql
  - cmd: "docker exec -it my-pg psql -U postgres -d my_shop"
    desc: "기본 DB 대신 my_shop 으로 바로 들어가기"
    group: psql
  - cmd: "docker exec -it my-pg psql -U postgres -d my_shop -c \"SELECT * FROM product\""
    desc: "SQL 한 문장만 실행하고 바로 나오기"
    group: psql
  - cmd: "\\c my_shop"
    desc: "psql 안에서 my_shop DB로 옮기기(SQL 이 아니라 ; 없음)"
    group: psql
  - cmd: "docker compose up -d"
    desc: "compose.yaml 대로 뒤에서 켜기"
    group: Docker Compose
  - cmd: "docker compose ps"
    desc: "이 폴더의 compose 컨테이너 보기"
    group: Docker Compose
  - cmd: "docker compose down"
    desc: "끄고 컨테이너 지우기(볼륨은 남음)"
    group: Docker Compose
  - cmd: "docker compose down -v"
    desc: "볼륨까지 지우기(external 볼륨은 남음)"
    group: Docker Compose
  - cmd: "sed -i '/PATHCONV\\|CONV_EXCL/d' ~/.bashrc"
    desc: ".bashrc 에서 예전 경로 변환 설정 줄 지우기"
    group: 터미널
  - cmd: "echo 'export MSYS_NO_PATHCONV=1' >> ~/.bashrc"
    desc: "Git Bash 경로 변환 끄는 줄을 .bashrc 에 넣기"
    group: 터미널
  - cmd: "echo 'export MSYS2_ARG_CONV_EXCL=\"*\"' >> ~/.bashrc"
    desc: "MSYS2 경로 변환에서 모든 인자 빼기"
    group: 터미널
  - cmd: "source ~/.bashrc"
    desc: "바꾼 .bashrc 를 지금 터미널에 바로 반영"
    group: 터미널
  - cmd: "ls *.sql"
    desc: "폴더의 .sql 파일 이름 확인(오타 찾기)"
    group: 터미널
terms:
  - word: "익명 볼륨 (Anonymous Volume)"
    definition: "-v 없이 DB 컨테이너를 켜면 도커가 자동으로 만드는 이름 없는 볼륨. 긴 ID 이름이고 컨테이너를 지워도 남아 쌓인다. docker volume prune 으로 치운다."
  - word: "멱등성 (Idempotency)"
    definition: "몇 번을 실행해도 결과가 같은 성질. SQL 파일 맨 앞의 DROP DATABASE IF EXISTS 덕분에 파일을 다시 실행해도 늘 같은 상태가 된다."
  - word: "psql 메타 명령 (Meta-command)"
    definition: "\\c, \\dt 처럼 백슬래시로 시작하는 psql 프로그램의 명령. SQL 이 아니라서 끝에 ; 가 없고, psql 로 실행해야 한다."
  - word: "시퀀스 (Sequence)"
    definition: "SERIAL 열에 다음 번호를 내주는 장치. 실패한 INSERT 도 번호를 하나 써 버려서, 번호는 겹치지 않을 뿐 빈틈이 생길 수 있다."
  - word: "NOT NULL 제약 (Constraint)"
    definition: "그 열을 비워 둘 수 없게 DB가 지키는 규칙. 값을 빼고 넣으면 violates not-null constraint 오류로 거절된다."
  - word: "경로 변환 (Path Conversion)"
    definition: "Git Bash(MSYS)가 / 로 시작하는 인자를 Windows 경로로 바꿔 넘기는 동작. //tmp 로 쓰거나 MSYS_NO_PATHCONV=1 로 끈다."
  - word: "외부 볼륨 (External Volume)"
    definition: "compose.yaml 에서 external: true 로 선언한, 이미 밖에 있는 볼륨. compose 가 새로 만들지 않고 없으면 오류를 내며, down -v 로도 지우지 않는다."
  - word: "입력 리다이렉션 (Input Redirection)"
    definition: "< 파일 로 파일 내용을 프로그램의 입력으로 흘려 보내는 것. 입력이 키보드가 아니라서 docker exec 에는 -t 없이 -i 만 쓴다."
