    - generic [ref=f7e23]:
      - heading "1. 학습 목표" [level=2] [ref=f7e24]
      - paragraph [ref=f7e25]: 이 레슨을 마치면 다음을 할 수 있습니다.
      - list [ref=f7e26]:
        - listitem [ref=f7e27]: 조건을 걸어 원하는 행만 뽑을 수 있다
        - listitem [ref=f7e28]: 두 표를 JOIN으로 이어 한 결과로 볼 수 있다
        - listitem [ref=f7e29]: GROUP BY로 묶어 개수 · 합계 · 평균을 낼 수 있다
        - listitem [ref=f7e30]: 서브쿼리로 다른 쿼리의 결과를 조건에 쓸 수 있다
      - heading "2. 왜 배우나" [level=2] [ref=f7e31]
      - paragraph [ref=f7e32]: 데이터베이스에 데이터를 넣는 일보다 꺼내는 일이 실무의 대부분을 차지합니다. 원하는 조건으로 걸러내고, 여러 표를 이어 붙이고, 묶어서 세는 방법을 알아야 화면에 보여줄 데이터를 정확히 뽑아낼 수 있습니다. 이 레슨도 앞 레슨과 마찬가지로 Supabase SQL 에디터에서 전부 실습하므로 브라우저만 있으면 됩니다.
      - heading "3. 개념 설명" [level=2] [ref=f7e33]
      - heading "🔍 SELECT의 뼈대" [level=3] [ref=f7e34]
      - paragraph [ref=f7e35]:
        - code [ref=f7e36]: "`SELECT 무엇을 FROM 어디서 WHERE 어떤 조건으로 ORDER BY 어떤 순서로`"
        - text: 가 조회 쿼리(query, 데이터베이스에 데이터를 요청하는 명령문)의 기본 뼈대입니다.
      - table [ref=f7e37]:
        - rowgroup [ref=f7e38]:
          - row [ref=f7e39]:
            - columnheader "자리" [ref=f7e40]
            - columnheader "하는 일" [ref=f7e41]
            - columnheader "예시" [ref=f7e42]
        - rowgroup [ref=f7e43]:
          - row [ref=f7e44]:
            - cell [ref=f7e45]:
              - code [ref=f7e46]: "`SELECT`"
            - cell "가져올 열을 고른다" [ref=f7e47]
            - cell [ref=f7e48]:
              - code [ref=f7e49]: "`name, grade`"
          - row [ref=f7e50]:
            - cell [ref=f7e51]:
              - code [ref=f7e52]: "`FROM`"
            - cell "어느 표에서 가져올지 정한다" [ref=f7e53]
            - cell [ref=f7e54]:
              - code [ref=f7e55]: "`practice.students`"
          - row [ref=f7e56]:
            - cell [ref=f7e57]:
              - code [ref=f7e58]: "`WHERE`"
            - cell "조건에 맞는 행만 남긴다" [ref=f7e59]
            - cell [ref=f7e60]:
              - code [ref=f7e61]: "`grade > 1`"
          - row [ref=f7e62]:
            - cell [ref=f7e63]:
              - code [ref=f7e64]: "`ORDER BY`"
            - cell "결과 순서를 정한다" [ref=f7e65]
            - cell [ref=f7e66]:
              - code [ref=f7e67]: "`grade DESC`"
      - heading "🔗 JOIN — 두 표를 겹쳐 놓기" [level=3] [ref=f7e68]
      - paragraph [ref=f7e69]:
        - text: JOIN(공통 열을 기준으로 두 표를 이어 붙이는 연산)은 두 표에서 같은 값을 가진 열끼리 짝을 맞춰 나란히 붙이는 것입니다.
        - code [ref=f7e70]: "`INNER JOIN`"
        - text: 은 양쪽 모두에 짝이 있는 행만 남기고,
        - code [ref=f7e71]: "`LEFT JOIN`"
        - text: 은 왼쪽 표의 행을 짝이 없어도 남깁니다 — "짝이 없는 행을 버리느냐, 남기느냐"의 차이입니다.
      - heading "🧮 집계 — 같은 것끼리 접기" [level=3] [ref=f7e72]
      - paragraph [ref=f7e73]:
        - text: 집계 함수(COUNT · SUM · AVG처럼 여러 행을 하나의 값으로 계산하는 함수)는
        - code [ref=f7e74]: "`GROUP BY`"
        - text: (같은 값을 가진 행끼리 묶는 절)와 짝을 이뤄 씁니다.
        - code [ref=f7e75]: "`WHERE`"
        - text: 는 묶기 전에 개별 행을 거르고,
        - code [ref=f7e76]: "`HAVING`"
        - text: (그룹으로 묶은 뒤 결과를 거르는 조건절)은 묶어서 계산한 뒤의 결과를 거릅니다.
      - heading "❓ 서브쿼리 — 질문 안의 질문" [level=3] [ref=f7e77]
      - paragraph [ref=f7e78]:
        - text: 서브쿼리(쿼리 안에 들어있는 또 다른 쿼리)는
        - code [ref=f7e79]: "`WHERE`"
        - text: 조건 안에 넣어 "이 값보다 큰 것만" 같은 조건을 만들거나,
        - code [ref=f7e80]: "`FROM`"
        - text: 자리에 넣어 미리 정리된 결과를 다시 조회하는 데 씁니다.
      - heading "4. 실무 예제" [level=2] [ref=f7e81]
      - paragraph [ref=f7e82]: 앞 레슨을 건너뛰었어도 이 블록 하나로 준비가 끝납니다. 연습용 서랍을 먼저 비우고 새로 만들기 때문에, 앞 레슨을 했든 안 했든 · 몇 번을 실행하든 항상 같은 상태에서 시작합니다.
      - figure [ref=f7e83]:
        - code [ref=f7e85]:
          - generic [ref=f7e86]: "-- Supabase 대시보드 → SQL 에디터에서 실행합니다."
          - generic [ref=f7e87]: "-- 연습용 practice 서랍을 통째로 비우고 새로 만듭니다."
          - generic [ref=f7e88]: DROP SCHEMA IF EXISTS practice CASCADE;
          - generic [ref=f7e89]: CREATE SCHEMA practice;
          - generic [ref=f7e91]: CREATE TABLE practice.students (
          - generic [ref=f7e92]: id serial PRIMARY KEY,
          - generic [ref=f7e93]: name text NOT NULL,
          - generic [ref=f7e94]: grade int
          - generic [ref=f7e95]: );
          - generic [ref=f7e97]: CREATE TABLE practice.subjects (
          - generic [ref=f7e98]: id serial PRIMARY KEY,
          - generic [ref=f7e99]: name text NOT NULL
          - generic [ref=f7e100]: );
          - generic [ref=f7e102]: CREATE TABLE practice.enrollments (
          - generic [ref=f7e103]: id serial PRIMARY KEY,
          - generic [ref=f7e104]: student_id int NOT NULL REFERENCES practice.students(id),
          - generic [ref=f7e105]: subject_id int NOT NULL REFERENCES practice.subjects(id),
          - generic [ref=f7e106]: score int
          - generic [ref=f7e107]: );
          - generic [ref=f7e109]: INSERT INTO practice.students (name, grade) VALUES
          - generic [ref=f7e110]: ('김지현', 2),
          - generic [ref=f7e111]: ('이민준', 1),
          - generic [ref=f7e112]: ('박서연', 3);
          - generic [ref=f7e114]: INSERT INTO practice.subjects (name) VALUES
          - generic [ref=f7e115]: ('수학'),
          - generic [ref=f7e116]: ('영어'),
          - generic [ref=f7e117]: ('과학');
          - generic [ref=f7e119]: INSERT INTO practice.enrollments (student_id, subject_id, score) VALUES
          - generic [ref=f7e120]: (1, 1, 88),
          - generic [ref=f7e121]: (1, 2, 95),
          - generic [ref=f7e122]: (2, 1, 72),
          - generic [ref=f7e123]: (3, 3, 91),
          - generic [ref=f7e124]: (3, 1, 60);
          - button "Copy code" [ref=f7e125]
      - paragraph [ref=f7e127]:
        - text: 맨 앞의
        - code [ref=f7e128]: "`DROP SCHEMA ... CASCADE`"
        - text: 가
        - code [ref=f7e129]: "`practice`"
        - text: 서랍을 통째로 비우고 시작하므로, 앞 레슨에서 만든 표가 남아 있어도 충돌하지 않고
        - code [ref=f7e130]: "`INSERT`"
        - text: 가 중복으로 쌓이지도 않습니다. 지워지는 것은
        - code [ref=f7e131]: "`practice`"
        - text: 서랍뿐이라 사이트 진도 데이터에는 아무 영향이 없습니다.
      - figure [ref=f7e132]:
        - code [ref=f7e134]:
          - generic [ref=f7e135]: "-- 조회: 학년이 2 이상인 학생을 학년 내림차순으로 본다"
          - generic [ref=f7e136]: SELECT name, grade
          - generic [ref=f7e137]: FROM practice.students
          - generic [ref=f7e138]: WHERE grade >= 2
          - generic [ref=f7e139]: ORDER BY grade DESC;
          - button "Copy code" [ref=f7e140]
      - paragraph [ref=f7e142]: 박서연(3학년), 김지현(2학년) 순서로 2행이 나옵니다.
      - figure [ref=f7e143]:
        - code [ref=f7e145]:
          - generic [ref=f7e146]: "-- JOIN: 학생과 과목을 수강 표로 이어 붙인다"
          - generic [ref=f7e147]: SELECT s.name AS 학생, sub.name AS 과목, e.score AS 점수
          - generic [ref=f7e148]: FROM practice.enrollments e
          - generic [ref=f7e149]: INNER JOIN practice.students s ON s.id = e.student_id
          - generic [ref=f7e150]: INNER JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f7e151]: ORDER BY e.id;
          - generic [ref=f7e153]: "-- LEFT JOIN 비교: 수강 기록이 없는 학생도 남긴다"
          - generic [ref=f7e154]: SELECT s.name AS 학생, sub.name AS 과목
          - generic [ref=f7e155]: FROM practice.students s
          - generic [ref=f7e156]: LEFT JOIN practice.enrollments e ON e.student_id = s.id
          - generic [ref=f7e157]: LEFT JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f7e158]: ORDER BY s.id;
          - button "Copy code" [ref=f7e159]
      - paragraph [ref=f7e161]:
        - text: 첫 번째
        - code [ref=f7e162]: "`INNER JOIN`"
        - text: 은 수강 기록 개수만큼 5행이 나옵니다. 두 번째
        - code [ref=f7e163]: "`LEFT JOIN`"
        - text: 은 모든 학생이 최소 1행씩 나오는데, 위 준비 데이터에서는 학생 3명 모두 수강 기록이 있어 결과 행 수가 같습니다 — 수강 기록이 없는 학생을 넣으면 그 학생의 과목 자리가 빈 채로(
        - code [ref=f7e164]: "`NULL`"
        - text: ) 남는 것이
        - code [ref=f7e165]: "`LEFT JOIN`"
        - text: 의 차이입니다.
      - figure [ref=f7e166]:
        - code [ref=f7e168]:
          - generic [ref=f7e169]: "-- 집계: 학생별 평균 점수, 60점 이상만 남긴다"
          - generic [ref=f7e170]: SELECT s.name AS 학생, COUNT(e.id) AS 수강수, AVG(e.score) AS 평균점수
          - generic [ref=f7e171]: FROM practice.students s
          - generic [ref=f7e172]: JOIN practice.enrollments e ON e.student_id = s.id
          - generic [ref=f7e173]: GROUP BY s.name
          - generic [ref=f7e174]: HAVING AVG(e.score) >= 60
          - generic [ref=f7e175]: ORDER BY 평균점수 DESC;
          - button "Copy code" [ref=f7e176]
      - paragraph [ref=f7e178]:
        - text: 학생별로 한 줄씩(3행) 나오되,
        - code [ref=f7e179]: "`WHERE`"
        - text: 가 아니라
        - code [ref=f7e180]: "`HAVING`"
        - text: 으로 평균을 거르므로 평균이 60점 미만인 학생이 있었다면 그 학생만 결과에서 빠졌을 것입니다.
      - figure [ref=f7e181]:
        - code [ref=f7e183]:
          - generic [ref=f7e184]: "-- 서브쿼리: 전체 평균 점수보다 높은 점수를 받은 수강 기록만 본다"
          - generic [ref=f7e185]: SELECT s.name AS 학생, sub.name AS 과목, e.score AS 점수
          - generic [ref=f7e186]: FROM practice.enrollments e
          - generic [ref=f7e187]: JOIN practice.students s ON s.id = e.student_id
          - generic [ref=f7e188]: JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f7e189]: WHERE e.score > (SELECT AVG(score) FROM practice.enrollments)
          - generic [ref=f7e190]: ORDER BY e.score DESC;
          - button "Copy code" [ref=f7e191]
      - paragraph [ref=f7e193]:
        - text: 괄호 안
        - code [ref=f7e194]: "`(SELECT AVG(score) FROM practice.enrollments)`"
        - text: 가 먼저 계산되어 하나의 숫자(전체 평균)가 되고, 바깥 쿼리의
        - code [ref=f7e195]: "`WHERE`"
        - text: 가 그 숫자보다 높은 점수만 남깁니다.
      - heading "해보기" [level=3] [ref=f7e196]
      - paragraph [ref=f7e197]:
        - text: 위 JOIN 예제에서
        - code [ref=f7e198]: "`INNER JOIN`"
        - text: 을
        - code [ref=f7e199]: "`LEFT JOIN`"
        - text: 으로 바꿔 실행해보세요(첫 번째 쿼리). 결과 행 수가 달라지는지, 왜 그런지 확인합니다.
      - group [ref=f7e200]:
        - generic "▶ 정답 보기" [ref=f7e201] [cursor=pointer]
        - text: "````"
      - heading "해보기" [level=3] [ref=f7e202]
      - paragraph [ref=f7e203]:
        - text: 집계 쿼리의
        - code [ref=f7e204]: "`GROUP BY s.name`"
        - text: 을
        - code [ref=f7e205]: "`GROUP BY sub.name`"
        - text: (과목 기준)으로 바꿔, 과목별 평균 점수를 다시 뽑아보세요.
      - group [ref=f7e206]:
        - generic "▶ 정답 보기" [ref=f7e207] [cursor=pointer]
        - text: "``"
      - heading "해보기" [level=3] [ref=f7e208]
      - paragraph [ref=f7e209]: 수학 과목의 평균 점수보다 높은 점수를 받은 수강 기록만 뽑는 서브쿼리를 직접 작성해보세요.
      - group [ref=f7e210]:
        - generic "▶ 정답 보기" [ref=f7e211] [cursor=pointer]
        - text: "``"
      - heading "5. 실무 팁" [level=2] [ref=f7e212]
      - list [ref=f7e213]:
        - listitem [ref=f7e214]: 이 레슨의 실습은 SQL 에디터에 값을 직접 타이핑하지만, 실제 애플리케이션 코드에서는 사용자 입력을 문자열로 이어 붙여 쿼리를 만들지 않습니다 — 값을 따로 넘기는 파라미터 바인딩 방식을 쓰며, 이는 Step 2에서 다룹니다.
        - listitem [ref=f7e215]:
          - code [ref=f7e216]: "`SELECT *`"
          - text: 대신 필요한 열만 골라 조회하는 습관을 들입니다 — 나중에 표에 열이 늘어나도 코드가 덜 흔들립니다.
        - listitem [ref=f7e217]: JOIN을 걸기 전에 각 표를 따로 조회해 행 수를 확인해두면, JOIN 결과가 예상과 다를 때 원인을 빨리 찾을 수 있습니다.
        - listitem [ref=f7e218]:
          - text: 데이터가 큰 표에서는
          - code [ref=f7e219]: "`WHERE`"
          - text: 없이 전체 조회를 하지 않습니다.
      - figure [ref=f7e220]:
        - code [ref=f7e222]:
          - generic [ref=f7e223]: "-- 실습을 되돌립니다. practice 서랍(스키마)을 통째로 지웁니다."
          - generic [ref=f7e224]: "-- 이 문장은 practice 스키마만 대상으로 하므로 사이트 진도 데이터에는 아무 영향이 없습니다."
          - generic [ref=f7e225]: DROP SCHEMA IF EXISTS practice CASCADE;
          - button "Copy code" [ref=f7e226]
      - heading "6. 핵심 정리 및 스스로 점검" [level=2] [ref=f7e228]
      - paragraph [ref=f7e229]:
        - strong [ref=f7e230]: 핵심 정리
      - list [ref=f7e231]:
        - listitem [ref=f7e232]:
          - code [ref=f7e233]: "`SELECT ~ FROM ~ WHERE ~ ORDER BY`"
          - text: 가 조회의 기본 뼈대다
        - listitem [ref=f7e234]:
          - code [ref=f7e235]: "`INNER JOIN`"
          - text: 은 짝이 없는 행을 버리고,
          - code [ref=f7e236]: "`LEFT JOIN`"
          - text: 은 왼쪽 표의 행을 남긴다
        - listitem [ref=f7e237]:
          - code [ref=f7e238]: "`GROUP BY`"
          - text: 는 같은 값끼리 묶고,
          - code [ref=f7e239]: "`WHERE`"
          - text: 는 묶기 전에,
          - code [ref=f7e240]: "`HAVING`"
          - text: 은 묶은 뒤에 거른다
        - listitem [ref=f7e241]: 서브쿼리는 쿼리 안에 다른 쿼리를 넣어 그 결과를 조건이나 값으로 쓴다
        - listitem [ref=f7e242]: 애플리케이션 코드에서는 문자열 결합 대신 파라미터 바인딩으로 쿼리를 만든다
      - paragraph [ref=f7e243]:
        - strong [ref=f7e244]: 이 레슨의 단어
      - table [ref=f7e245]:
        - rowgroup [ref=f7e246]:
          - row [ref=f7e247]:
            - columnheader "단어" [ref=f7e248]
            - columnheader "뜻" [ref=f7e249]
        - rowgroup [ref=f7e250]:
          - row [ref=f7e251]:
            - cell "쿼리" [ref=f7e252]
            - cell "데이터베이스에 데이터를 요청하는 명령문" [ref=f7e253]
          - row [ref=f7e254]:
            - cell "JOIN" [ref=f7e255]
            - cell "공통 열을 기준으로 두 표를 이어 붙이는 연산" [ref=f7e256]
