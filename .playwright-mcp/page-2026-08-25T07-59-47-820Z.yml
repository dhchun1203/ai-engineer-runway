      - paragraph [ref=f8e127]:
        - text: 맨 앞의
        - code [ref=f8e128]: "`DROP SCHEMA ... CASCADE`"
        - text: 가
        - code [ref=f8e129]: "`practice`"
        - text: 서랍을 통째로 비우고 시작하므로, 앞 레슨에서 만든 표가 남아 있어도 충돌하지 않고
        - code [ref=f8e130]: "`INSERT`"
        - text: 가 중복으로 쌓이지도 않습니다. 지워지는 것은
        - code [ref=f8e131]: "`practice`"
        - text: 서랍뿐이라 사이트 진도 데이터에는 아무 영향이 없습니다.
      - figure [ref=f8e132]:
        - code [ref=f8e134]:
          - generic [ref=f8e135]: "-- 조회: 학년이 2 이상인 학생을 학년 내림차순으로 본다"
          - generic [ref=f8e136]: SELECT name, grade
          - generic [ref=f8e137]: FROM practice.students
          - generic [ref=f8e138]: WHERE grade >= 2
          - generic [ref=f8e139]: ORDER BY grade DESC;
          - button "Copy code" [ref=f8e140]
      - paragraph [ref=f8e142]: 박서연(3학년), 김지현(2학년) 순서로 2행이 나옵니다.
      - figure [ref=f8e143]:
        - code [ref=f8e145]:
          - generic [ref=f8e146]: "-- JOIN: 학생과 과목을 수강 표로 이어 붙인다"
          - generic [ref=f8e147]: SELECT s.name AS 학생, sub.name AS 과목, e.score AS 점수
          - generic [ref=f8e148]: FROM practice.enrollments e
          - generic [ref=f8e149]: INNER JOIN practice.students s ON s.id = e.student_id
          - generic [ref=f8e150]: INNER JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f8e151]: ORDER BY e.id;
          - generic [ref=f8e153]: "-- LEFT JOIN 비교: 수강 기록이 없는 학생도 남긴다"
          - generic [ref=f8e154]: SELECT s.name AS 학생, sub.name AS 과목
          - generic [ref=f8e155]: FROM practice.students s
          - generic [ref=f8e156]: LEFT JOIN practice.enrollments e ON e.student_id = s.id
          - generic [ref=f8e157]: LEFT JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f8e158]: ORDER BY s.id;
          - button "Copy code" [ref=f8e159]
      - paragraph [ref=f8e161]:
        - text: 첫 번째
        - code [ref=f8e162]: "`INNER JOIN`"
        - text: 은 수강 기록 개수만큼 5행이 나옵니다. 두 번째
        - code [ref=f8e163]: "`LEFT JOIN`"
        - text: 은 모든 학생이 최소 1행씩 나오는데, 위 준비 데이터에서는 학생 3명 모두 수강 기록이 있어 결과 행 수가 같습니다 — 수강 기록이 없는 학생을 넣으면 그 학생의 과목 자리가 빈 채로(
        - code [ref=f8e164]: "`NULL`"
        - text: ) 남는 것이
        - code [ref=f8e165]: "`LEFT JOIN`"
        - text: 의 차이입니다.
      - figure [ref=f8e166]:
        - code [ref=f8e168]:
          - generic [ref=f8e169]: "-- 집계: 학생별 평균 점수, 60점 이상만 남긴다"
          - generic [ref=f8e170]: SELECT s.name AS 학생, COUNT(e.id) AS 수강수, AVG(e.score) AS 평균점수
          - generic [ref=f8e171]: FROM practice.students s
          - generic [ref=f8e172]: JOIN practice.enrollments e ON e.student_id = s.id
          - generic [ref=f8e173]: GROUP BY s.name
          - generic [ref=f8e174]: HAVING AVG(e.score) >= 60
          - generic [ref=f8e175]: ORDER BY 평균점수 DESC;
          - button "Copy code" [ref=f8e176]
      - paragraph [ref=f8e178]:
        - text: 학생별로 한 줄씩(3행) 나오되,
        - code [ref=f8e179]: "`WHERE`"
        - text: 가 아니라
        - code [ref=f8e180]: "`HAVING`"
        - text: 으로 평균을 거르므로 평균이 60점 미만인 학생이 있었다면 그 학생만 결과에서 빠졌을 것입니다.
      - figure [ref=f8e181]:
        - code [ref=f8e183]:
          - generic [ref=f8e184]: "-- 서브쿼리: 전체 평균 점수보다 높은 점수를 받은 수강 기록만 본다"
          - generic [ref=f8e185]: SELECT s.name AS 학생, sub.name AS 과목, e.score AS 점수
          - generic [ref=f8e186]: FROM practice.enrollments e
          - generic [ref=f8e187]: JOIN practice.students s ON s.id = e.student_id
          - generic [ref=f8e188]: JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f8e189]: WHERE e.score > (SELECT AVG(score) FROM practice.enrollments)
          - generic [ref=f8e190]: ORDER BY e.score DESC;
          - button "Copy code" [ref=f8e191]
      - paragraph [ref=f8e193]:
        - text: 괄호 안
        - code [ref=f8e194]: "`(SELECT AVG(score) FROM practice.enrollments)`"
        - text: 가 먼저 계산되어 하나의 숫자(전체 평균)가 되고, 바깥 쿼리의
        - code [ref=f8e195]: "`WHERE`"
        - text: 가 그 숫자보다 높은 점수만 남깁니다.
      - heading "해보기" [level=3] [ref=f8e196]
      - paragraph [ref=f8e197]:
        - text: 위 JOIN 예제에서
        - code [ref=f8e198]: "`INNER JOIN`"
        - text: 을
        - code [ref=f8e199]: "`LEFT JOIN`"
        - text: 으로 바꿔 실행해보세요(첫 번째 쿼리). 결과 행 수가 달라지는지, 왜 그런지 확인합니다.
      - group [ref=f8e200]:
        - generic "▶ 정답 보기" [ref=f8e201] [cursor=pointer]
        - text: "````"
      - heading "해보기" [level=3] [ref=f8e202]
      - paragraph [ref=f8e203]:
        - text: 집계 쿼리의
        - code [ref=f8e204]: "`GROUP BY s.name`"
        - text: 을
        - code [ref=f8e205]: "`GROUP BY sub.name`"
        - text: (과목 기준)으로 바꿔, 과목별 평균 점수를 다시 뽑아보세요.
      - group [ref=f8e206]:
        - generic "▶ 정답 보기" [ref=f8e207] [cursor=pointer]
        - text: "``"
      - heading "해보기" [level=3] [ref=f8e208]
      - paragraph [ref=f8e209]: 수학 과목의 평균 점수보다 높은 점수를 받은 수강 기록만 뽑는 서브쿼리를 직접 작성해보세요.
      - group [ref=f8e210]:
        - generic "▶ 정답 보기" [ref=f8e211] [cursor=pointer]
        - text: "``"
      - heading "5. 실무 팁" [level=2] [ref=f8e212]
      - list [ref=f8e213]:
        - listitem [ref=f8e214]: 이 레슨의 실습은 SQL 에디터에 값을 직접 타이핑하지만, 실제 애플리케이션 코드에서는 사용자 입력을 문자열로 이어 붙여 쿼리를 만들지 않습니다 — 값을 따로 넘기는 파라미터 바인딩 방식을 쓰며, 이는 Step 2에서 다룹니다.
        - listitem [ref=f8e215]:
          - code [ref=f8e216]: "`SELECT *`"
          - text: 대신 필요한 열만 골라 조회하는 습관을 들입니다 — 나중에 표에 열이 늘어나도 코드가 덜 흔들립니다.
        - listitem [ref=f8e217]: JOIN을 걸기 전에 각 표를 따로 조회해 행 수를 확인해두면, JOIN 결과가 예상과 다를 때 원인을 빨리 찾을 수 있습니다.
        - listitem [ref=f8e218]:
          - text: 데이터가 큰 표에서는
          - code [ref=f8e219]: "`WHERE`"
          - text: 없이 전체 조회를 하지 않습니다.
      - figure [ref=f8e220]:
        - code [ref=f8e222]:
          - generic [ref=f8e223]: "-- 실습을 되돌립니다. practice 서랍(스키마)을 통째로 지웁니다."
          - generic [ref=f8e224]: "-- 이 문장은 practice 스키마만 대상으로 하므로 사이트 진도 데이터에는 아무 영향이 없습니다."
          - generic [ref=f8e225]: DROP SCHEMA IF EXISTS practice CASCADE;
          - button "Copy code" [ref=f8e226]
      - heading "6. 핵심 정리 및 스스로 점검" [level=2] [ref=f8e228]
      - paragraph [ref=f8e229]:
        - strong [ref=f8e230]: 핵심 정리
      - list [ref=f8e231]:
        - listitem [ref=f8e232]:
          - code [ref=f8e233]: "`SELECT ~ FROM ~ WHERE ~ ORDER BY`"
          - text: 가 조회의 기본 뼈대다
        - listitem [ref=f8e234]:
          - code [ref=f8e235]: "`INNER JOIN`"
          - text: 은 짝이 없는 행을 버리고,
          - code [ref=f8e236]: "`LEFT JOIN`"
          - text: 은 왼쪽 표의 행을 남긴다
        - listitem [ref=f8e237]:
          - code [ref=f8e238]: "`GROUP BY`"
          - text: 는 같은 값끼리 묶고,
          - code [ref=f8e239]: "`WHERE`"
          - text: 는 묶기 전에,
          - code [ref=f8e240]: "`HAVING`"
          - text: 은 묶은 뒤에 거른다
        - listitem [ref=f8e241]: 서브쿼리는 쿼리 안에 다른 쿼리를 넣어 그 결과를 조건이나 값으로 쓴다
        - listitem [ref=f8e242]: 애플리케이션 코드에서는 문자열 결합 대신 파라미터 바인딩으로 쿼리를 만든다
      - paragraph [ref=f8e243]:
        - strong [ref=f8e244]: 이 레슨의 단어
      - table [ref=f8e245]:
        - rowgroup [ref=f8e246]:
          - row [ref=f8e247]:
            - columnheader "단어" [ref=f8e248]
            - columnheader "뜻" [ref=f8e249]
        - rowgroup [ref=f8e250]:
          - row [ref=f8e251]:
            - cell "쿼리" [ref=f8e252]
            - cell "데이터베이스에 데이터를 요청하는 명령문" [ref=f8e253]
          - row [ref=f8e254]:
            - cell "JOIN" [ref=f8e255]
            - cell "공통 열을 기준으로 두 표를 이어 붙이는 연산" [ref=f8e256]
