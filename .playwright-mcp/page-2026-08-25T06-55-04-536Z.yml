      - paragraph [ref=f1e25]: 이 레슨을 마치면 다음을 할 수 있습니다.
      - list [ref=f1e26]:
        - listitem [ref=f1e27]: 생성형 AI가 무엇을 하는 도구인지 비유로 설명할 수 있다
        - listitem [ref=f1e28]: 공식 SDK로 최소 호출 코드를 작성해 실행할 수 있다
        - listitem [ref=f1e29]: API 키를 코드에 넣지 않고 환경변수로 다룰 수 있다
        - listitem [ref=f1e30]: AI에 맡길 일과 사람이 검증해야 할 일을 구분해 판단할 수 있다
      - heading "2. 왜 배우나" [level=2] [ref=f1e31]
      - paragraph [ref=f1e32]: 이 커리큘럼 전체의 주제가 바로 생성형 AI를 활용한 서비스를 만드는 것입니다. 지금 여기서 배우는 API 호출 한 번이 Step 2 전체에서 반복해서 쓰일 기본 동작입니다. 특히 API 키를 다루는 습관은 이 레슨에서 처음 만들어지고, 이후 모든 레슨이 그 습관을 그대로 물려받습니다. 그래서 개념보다 "키를 어떻게 안전하게 다루는가"가 이 레슨에서 가장 중요합니다.
      - heading "3. 개념 설명" [level=2] [ref=f1e33]
      - heading "🔮 아주 똑똑해진 자동완성" [level=3] [ref=f1e34]
      - paragraph [ref=f1e35]: 생성형 AI(generative AI, 새로운 텍스트·이미지 등을 만들어내는 AI)는 스마트폰 자판의 "다음 단어 추천" 기능이 아주 똑똑해진 것이라고 생각하면 이해하기 쉽습니다. 모델(model, 학습된 AI 프로그램 자체)은 지금까지 나온 글을 보고 "다음에 올 확률이 가장 높은 말"을 계속 골라 이어 붙입니다. 확률로 고르기 때문에 문법도 맞고 그럴듯하게 들리지만 사실은 틀린 답이 나올 수 있습니다 — 이를 할루시네이션(hallucination, AI가 사실이 아닌 내용을 그럴듯하게 지어내는 현상)이라고 부릅니다. "말이 되는 것"과 "사실인 것"은 다른 문제라는 걸 항상 기억해야 합니다.
