      - paragraph [ref=f1e76]: AI는 그럴듯한 근거나 출처를 실제로 존재하지 않는데도 만들어낼 수 있습니다(할루시네이션). 그래서 AI가 제시한 사실·수치·출처는 항상 사람이 별도로 확인해야 하는 항목으로 분류해야 합니다.
      - heading "4. 실무 예제" [level=2] [ref=f1e77]
      - paragraph [ref=f1e78]:
        - text: 아래는 공식
        - code [ref=f1e79]: "`anthropic`"
        - text: SDK로 Claude API를 한 번 호출하는 최소 예제입니다. API 키가 없다면 코드를 건너뛰고 아래 대체 경로로 바로 넘어가도 됩니다.
      - figure [ref=f1e80]:
        - code [ref=f1e82]:
          - generic [ref=f1e83]: "# claude_hello.py"
          - generic [ref=f1e84]: "# 환경변수 ANTHROPIC_API_KEY에 API 키가 설정되어 있어야 합니다."
          - generic [ref=f1e85]: "# 키가 없다면 아래 \"키 없이 실습하기\"로 바로 넘어가세요."
          - generic [ref=f1e87]: import os
          - generic [ref=f1e88]: from anthropic import Anthropic
          - generic [ref=f1e90]: client = Anthropic(api_key=os.environ.get("ANTHROPIC_API_KEY"))
          - generic [ref=f1e92]: response = client.messages.create(
          - generic [ref=f1e93]: model="claude-opus-5",
          - generic [ref=f1e94]: max_tokens=1024,
          - generic [ref=f1e95]: messages=[
          - generic [ref=f1e96]: "{\"role\": \"user\", \"content\": \"생성형 AI를 한 문장으로 설명해줘.\"}"
          - generic [ref=f1e97]: "],"
          - generic [ref=f1e98]: )
          - generic [ref=f1e100]: "for block in response.content:"
          - generic [ref=f1e101]: "if block.type == \"text\":"
          - generic [ref=f1e102]: print(block.text)
          - button "Copy code" [ref=f1e103]
      - paragraph [ref=f1e105]:
        - strong [ref=f1e106]: "실행 방법:"
      - figure [ref=f1e107]:
        - code [ref=f1e109]:
          - generic [ref=f1e110]: pip install anthropic
          - generic [ref=f1e111]: $env:ANTHROPIC_API_KEY = "여기에_발급받은_키"
          - generic [ref=f1e112]: py claude_hello.py
          - button "Copy code" [ref=f1e113]
      - paragraph [ref=f1e115]:
        - text: macOS는 환경변수를
        - code [ref=f1e116]: "`export ANTHROPIC_API_KEY=\"여기에_발급받은_키\"`"
        - text: 로 설정하고
        - code [ref=f1e117]: "`python3 claude_hello.py`"
        - text: 로 실행합니다.
      - paragraph [ref=f1e118]: 실행하면 터미널에 Claude가 생성형 AI를 한 문장으로 설명한 답변 텍스트가 출력됩니다. 답변 내용은 매번 조금씩 달라질 수 있습니다 — 같은 질문이라도 확률로 다음 말을 고르기 때문입니다.
      - paragraph [ref=f1e119]:
        - strong [ref=f1e120]: 키 없이 실습하기.
        - text: API 키가 없어도 이 레슨의 해보기를 끝낼 수 있습니다. 위 코드의 프롬프트("생성형 AI를 한 문장으로 설명해줘.")를 그대로 복사해
        - link "claude.ai" [ref=f1e121] [cursor=pointer]:
          - /url: https://claude.ai
        - text: 같은 채팅 화면에 붙여 넣고 결과를 받아보세요. API와 채팅 UI가 같은 모델을 쓰는지 답변의 말투·길이를 비교해보는 것도 좋은 관찰 포인트입니다.
