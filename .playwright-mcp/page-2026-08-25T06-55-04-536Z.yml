        - listitem [ref=f1e156]: 문법과 말투가 그럴듯해도 사실이 아닐 수 있다(할루시네이션)
        - listitem [ref=f1e157]: API 키는 오직 환경변수로만 다루고 코드나 저장소에 절대 적지 않는다
        - listitem [ref=f1e158]: 초안·요약·번역·코드 뼈대는 맡겨도 되지만, 사실·수치·법적/의료 판단은 사람이 검증한다
