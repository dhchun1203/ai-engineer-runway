      - heading "5. 실무 팁" [level=2] [ref=f1e137]
      - list [ref=f1e138]:
        - listitem [ref=f1e139]:
          - strong [ref=f1e140]: 키를 코드 파일이나 저장소에 넣지 않습니다.
          - text: 한 번이라도 커밋되면 이력에 남아 지우기 어렵습니다 — 항상 환경변수로만 다룹니다.
        - listitem [ref=f1e141]:
          - strong [ref=f1e142]: 설치 패키지 이름과 import 이름이 다를 수 있습니다.
          - text: 이 예제는
          - code [ref=f1e143]: "`pip install anthropic`"
          - text: 으로 설치하고
          - code [ref=f1e144]: "`from anthropic import Anthropic`"
          - text: "으로 그대로 불러오지만, 다른 라이브러리는 설치명과 import명이 다른 경우가 흔합니다(예:"
          - code [ref=f1e145]: "`scikit-learn`"
          - text: 설치 후
          - code [ref=f1e146]: "`import sklearn`"
          - text: ).
        - listitem [ref=f1e147]:
          - strong [ref=f1e148]: 모델 ID는 시간이 지나며 바뀔 수 있습니다.
          - text: 이 레슨의 예제는 이 글을 쓴 시점 기준 모델 ID를 씁니다 — 최신 모델 ID는 항상 Anthropic 공식 문서에서 확인하세요.
        - listitem [ref=f1e149]:
          - strong [ref=f1e150]: 답을 그대로 믿지 않습니다.
          - text: 특히 사실·수치·출처는 AI가 그럴듯하게 지어낼 수 있으므로(할루시네이션), 검증 대상을 미리 정해두고 확인하는 습관을 들입니다.
