      - heading "2. 왜 배우나" [level=2] [ref=f3e31]
      - paragraph [ref=f3e32]: 데이터베이스에 데이터를 넣는 일보다 꺼내는 일이 실무의 대부분을 차지합니다. 원하는 조건으로 걸러내고, 여러 표를 이어 붙이고, 묶어서 세는 방법을 알아야 화면에 보여줄 데이터를 정확히 뽑아낼 수 있습니다. 이 레슨도 앞 레슨과 마찬가지로 Supabase SQL 에디터에서 전부 실습하므로 브라우저만 있으면 됩니다.
      - heading "3. 개념 설명" [level=2] [ref=f3e33]
      - heading "🔍 SELECT의 뼈대" [level=3] [ref=f3e34]
      - paragraph [ref=f3e35]:
        - code [ref=f3e36]: "`SELECT 무엇을 FROM 어디서 WHERE 어떤 조건으로 ORDER BY 어떤 순서로`"
        - text: 가 조회 쿼리(query, 데이터베이스에 데이터를 요청하는 명령문)의 기본 뼈대입니다.
      - table [ref=f3e37]:
        - rowgroup [ref=f3e38]:
          - row [ref=f3e39]:
