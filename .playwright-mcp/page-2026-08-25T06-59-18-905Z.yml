      - list [ref=f6e26]:
        - listitem [ref=f6e27]: 조건을 걸어 원하는 행만 뽑을 수 있다
        - listitem [ref=f6e28]: 두 표를 JOIN으로 이어 한 결과로 볼 수 있다
        - listitem [ref=f6e29]: GROUP BY로 묶어 개수 · 합계 · 평균을 낼 수 있다
        - listitem [ref=f6e30]: 서브쿼리로 다른 쿼리의 결과를 조건에 쓸 수 있다
      - heading "2. 왜 배우나" [level=2] [ref=f6e31]
      - paragraph [ref=f6e32]: 데이터베이스에 데이터를 넣는 일보다 꺼내는 일이 실무의 대부분을 차지합니다. 원하는 조건으로 걸러내고, 여러 표를 이어 붙이고, 묶어서 세는 방법을 알아야 화면에 보여줄 데이터를 정확히 뽑아낼 수 있습니다. 이 레슨도 앞 레슨과 마찬가지로 Supabase SQL 에디터에서 전부 실습하므로 브라우저만 있으면 됩니다.
      - heading "3. 개념 설명" [level=2] [ref=f6e33]
      - heading "🔍 SELECT의 뼈대" [level=3] [ref=f6e34]
      - paragraph [ref=f6e35]:
        - code [ref=f6e36]: "`SELECT 무엇을 FROM 어디서 WHERE 어떤 조건으로 ORDER BY 어떤 순서로`"
        - text: 가 조회 쿼리(query, 데이터베이스에 데이터를 요청하는 명령문)의 기본 뼈대입니다.
      - table [ref=f6e37]:
        - rowgroup [ref=f6e38]:
          - row [ref=f6e39]:
            - columnheader "자리" [ref=f6e40]
            - columnheader "하는 일" [ref=f6e41]
            - columnheader "예시" [ref=f6e42]
        - rowgroup [ref=f6e43]:
          - row [ref=f6e44]:
            - cell [ref=f6e45]:
              - code [ref=f6e46]: "`SELECT`"
            - cell "가져올 열을 고른다" [ref=f6e47]
            - cell [ref=f6e48]:
              - code [ref=f6e49]: "`name, grade`"
          - row [ref=f6e50]:
            - cell [ref=f6e51]:
              - code [ref=f6e52]: "`FROM`"
            - cell "어느 표에서 가져올지 정한다" [ref=f6e53]
            - cell [ref=f6e54]:
              - code [ref=f6e55]: "`practice.students`"
          - row [ref=f6e56]:
            - cell [ref=f6e57]:
              - code [ref=f6e58]: "`WHERE`"
            - cell "조건에 맞는 행만 남긴다" [ref=f6e59]
            - cell [ref=f6e60]:
              - code [ref=f6e61]: "`grade > 1`"
          - row [ref=f6e62]:
            - cell [ref=f6e63]:
              - code [ref=f6e64]: "`ORDER BY`"
            - cell "결과 순서를 정한다" [ref=f6e65]
            - cell [ref=f6e66]:
              - code [ref=f6e67]: "`grade DESC`"
      - heading "🔗 JOIN — 두 표를 겹쳐 놓기" [level=3] [ref=f6e68]
      - paragraph [ref=f6e69]:
        - text: JOIN(공통 열을 기준으로 두 표를 이어 붙이는 연산)은 두 표에서 같은 값을 가진 열끼리 짝을 맞춰 나란히 붙이는 것입니다.
        - code [ref=f6e70]: "`INNER JOIN`"
        - text: 은 양쪽 모두에 짝이 있는 행만 남기고,
        - code [ref=f6e71]: "`LEFT JOIN`"
        - text: 은 왼쪽 표의 행을 짝이 없어도 남깁니다 — "짝이 없는 행을 버리느냐, 남기느냐"의 차이입니다.
      - heading "🧮 집계 — 같은 것끼리 접기" [level=3] [ref=f6e72]
      - paragraph [ref=f6e73]:
        - text: 집계 함수(COUNT · SUM · AVG처럼 여러 행을 하나의 값으로 계산하는 함수)는
        - code [ref=f6e74]: "`GROUP BY`"
        - text: (같은 값을 가진 행끼리 묶는 절)와 짝을 이뤄 씁니다.
        - code [ref=f6e75]: "`WHERE`"
        - text: 는 묶기 전에 개별 행을 거르고,
        - code [ref=f6e76]: "`HAVING`"
        - text: (그룹으로 묶은 뒤 결과를 거르는 조건절)은 묶어서 계산한 뒤의 결과를 거릅니다.
      - heading "❓ 서브쿼리 — 질문 안의 질문" [level=3] [ref=f6e77]
      - paragraph [ref=f6e78]:
        - text: 서브쿼리(쿼리 안에 들어있는 또 다른 쿼리)는
        - code [ref=f6e79]: "`WHERE`"
        - text: 조건 안에 넣어 "이 값보다 큰 것만" 같은 조건을 만들거나,
        - code [ref=f6e80]: "`FROM`"
        - text: 자리에 넣어 미리 정리된 결과를 다시 조회하는 데 씁니다.
      - heading "4. 실무 예제" [level=2] [ref=f6e81]
      - paragraph [ref=f6e82]:
        - text: 앞 레슨을 건너뛰었어도 이 블록 하나로 준비가 끝납니다.
        - code [ref=f6e83]: "`IF NOT EXISTS`"
        - text: 를 쓰기 때문에 두 번 실행해도 안전합니다.
      - figure [ref=f6e84]:
        - code [ref=f6e86]:
          - generic [ref=f6e87]: "-- Supabase 대시보드 → SQL 에디터에서 실행합니다. 앞 레슨을 안 했어도 이 블록 하나로 준비가 끝납니다."
          - generic [ref=f6e88]: CREATE SCHEMA IF NOT EXISTS practice;
          - generic [ref=f6e90]: CREATE TABLE IF NOT EXISTS practice.students (
          - generic [ref=f6e91]: id serial PRIMARY KEY,
          - generic [ref=f6e92]: name text NOT NULL,
          - generic [ref=f6e93]: grade int
          - generic [ref=f6e94]: );
          - generic [ref=f6e96]: CREATE TABLE IF NOT EXISTS practice.subjects (
          - generic [ref=f6e97]: id serial PRIMARY KEY,
          - generic [ref=f6e98]: name text NOT NULL
          - generic [ref=f6e99]: );
          - generic [ref=f6e101]: CREATE TABLE IF NOT EXISTS practice.enrollments (
          - generic [ref=f6e102]: id serial PRIMARY KEY,
          - generic [ref=f6e103]: student_id int NOT NULL REFERENCES practice.students(id),
          - generic [ref=f6e104]: subject_id int NOT NULL REFERENCES practice.subjects(id),
          - generic [ref=f6e105]: score int
          - generic [ref=f6e106]: );
          - generic [ref=f6e108]: INSERT INTO practice.students (name, grade) VALUES
          - generic [ref=f6e109]: ('김지현', 2),
          - generic [ref=f6e110]: ('이민준', 1),
          - generic [ref=f6e111]: ('박서연', 3);
          - generic [ref=f6e113]: INSERT INTO practice.subjects (name) VALUES
          - generic [ref=f6e114]: ('수학'),
          - generic [ref=f6e115]: ('영어'),
          - generic [ref=f6e116]: ('과학');
          - generic [ref=f6e118]: INSERT INTO practice.enrollments (student_id, subject_id, score) VALUES
          - generic [ref=f6e119]: (1, 1, 88),
          - generic [ref=f6e120]: (1, 2, 95),
          - generic [ref=f6e121]: (2, 1, 72),
          - generic [ref=f6e122]: (3, 3, 91),
          - generic [ref=f6e123]: (3, 1, 60);
          - button "Copy code" [ref=f6e124]
      - paragraph [ref=f6e126]:
        - code [ref=f6e127]: "`CREATE SCHEMA/TABLE IF NOT EXISTS`"
        - text: 가 있어 이미 표가 있으면 건드리지 않습니다. 다만
        - code [ref=f6e128]: "`INSERT`"
        - text: 는 실행할 때마다 새 행이 추가되니, 처음 한 번만 실행하는 걸 권장합니다.
      - figure [ref=f6e129]:
        - code [ref=f6e131]:
          - generic [ref=f6e132]: "-- 조회: 학년이 2 이상인 학생을 학년 내림차순으로 본다"
          - generic [ref=f6e133]: SELECT name, grade
          - generic [ref=f6e134]: FROM practice.students
          - generic [ref=f6e135]: WHERE grade >= 2
          - generic [ref=f6e136]: ORDER BY grade DESC;
          - button "Copy code" [ref=f6e137]
      - paragraph [ref=f6e139]: 박서연(3학년), 김지현(2학년) 순서로 2행이 나옵니다.
      - figure [ref=f6e140]:
        - code [ref=f6e142]:
          - generic [ref=f6e143]: "-- JOIN: 학생과 과목을 수강 표로 이어 붙인다"
          - generic [ref=f6e144]: SELECT s.name AS 학생, sub.name AS 과목, e.score AS 점수
          - generic [ref=f6e145]: FROM practice.enrollments e
          - generic [ref=f6e146]: INNER JOIN practice.students s ON s.id = e.student_id
          - generic [ref=f6e147]: INNER JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f6e148]: ORDER BY e.id;
          - generic [ref=f6e150]: "-- LEFT JOIN 비교: 수강 기록이 없는 학생도 남긴다"
          - generic [ref=f6e151]: SELECT s.name AS 학생, sub.name AS 과목
          - generic [ref=f6e152]: FROM practice.students s
          - generic [ref=f6e153]: LEFT JOIN practice.enrollments e ON e.student_id = s.id
          - generic [ref=f6e154]: LEFT JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f6e155]: ORDER BY s.id;
          - button "Copy code" [ref=f6e156]
      - paragraph [ref=f6e158]:
        - text: 첫 번째
        - code [ref=f6e159]: "`INNER JOIN`"
        - text: 은 수강 기록 개수만큼 5행이 나옵니다. 두 번째
        - code [ref=f6e160]: "`LEFT JOIN`"
        - text: 은 모든 학생이 최소 1행씩 나오는데, 위 준비 데이터에서는 학생 3명 모두 수강 기록이 있어 결과 행 수가 같습니다 — 수강 기록이 없는 학생을 넣으면 그 학생의 과목 자리가 빈 채로(
        - code [ref=f6e161]: "`NULL`"
        - text: ) 남는 것이
        - code [ref=f6e162]: "`LEFT JOIN`"
        - text: 의 차이입니다.
      - figure [ref=f6e163]:
        - code [ref=f6e165]:
          - generic [ref=f6e166]: "-- 집계: 학생별 평균 점수, 60점 이상만 남긴다"
          - generic [ref=f6e167]: SELECT s.name AS 학생, COUNT(e.id) AS 수강수, AVG(e.score) AS 평균점수
          - generic [ref=f6e168]: FROM practice.students s
          - generic [ref=f6e169]: JOIN practice.enrollments e ON e.student_id = s.id
          - generic [ref=f6e170]: GROUP BY s.name
          - generic [ref=f6e171]: HAVING AVG(e.score) >= 60
          - generic [ref=f6e172]: ORDER BY 평균점수 DESC;
          - button "Copy code" [ref=f6e173]
      - paragraph [ref=f6e175]:
        - text: 학생별로 한 줄씩(3행) 나오되,
        - code [ref=f6e176]: "`WHERE`"
        - text: 가 아니라
        - code [ref=f6e177]: "`HAVING`"
        - text: 으로 평균을 거르므로 평균이 60점 미만인 학생이 있었다면 그 학생만 결과에서 빠졌을 것입니다.
      - figure [ref=f6e178]:
        - code [ref=f6e180]:
          - generic [ref=f6e181]: "-- 서브쿼리: 전체 평균 점수보다 높은 점수를 받은 수강 기록만 본다"
          - generic [ref=f6e182]: SELECT s.name AS 학생, sub.name AS 과목, e.score AS 점수
          - generic [ref=f6e183]: FROM practice.enrollments e
          - generic [ref=f6e184]: JOIN practice.students s ON s.id = e.student_id
          - generic [ref=f6e185]: JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f6e186]: WHERE e.score > (SELECT AVG(score) FROM practice.enrollments)
          - generic [ref=f6e187]: ORDER BY e.score DESC;
          - button "Copy code" [ref=f6e188]
      - paragraph [ref=f6e190]:
        - text: 괄호 안
        - code [ref=f6e191]: "`(SELECT AVG(score) FROM practice.enrollments)`"
        - text: 가 먼저 계산되어 하나의 숫자(전체 평균)가 되고, 바깥 쿼리의
        - code [ref=f6e192]: "`WHERE`"
        - text: 가 그 숫자보다 높은 점수만 남깁니다.
      - heading "해보기" [level=3] [ref=f6e193]
      - paragraph [ref=f6e194]:
        - text: 위 JOIN 예제에서
        - code [ref=f6e195]: "`INNER JOIN`"
        - text: 을
        - code [ref=f6e196]: "`LEFT JOIN`"
        - text: 으로 바꿔 실행해보세요(첫 번째 쿼리). 결과 행 수가 달라지는지, 왜 그런지 확인합니다.
      - group [ref=f6e197]:
        - generic "▶ 정답 보기" [ref=f6e198] [cursor=pointer]
        - text: "````"
      - heading "해보기" [level=3] [ref=f6e199]
      - paragraph [ref=f6e200]:
        - text: 집계 쿼리의
        - code [ref=f6e201]: "`GROUP BY s.name`"
        - text: 을
        - code [ref=f6e202]: "`GROUP BY sub.name`"
        - text: (과목 기준)으로 바꿔, 과목별 평균 점수를 다시 뽑아보세요.
      - group [ref=f6e203]:
        - generic "▶ 정답 보기" [ref=f6e204] [cursor=pointer]
        - text: "``"
      - heading "해보기" [level=3] [ref=f6e205]
      - paragraph [ref=f6e206]: 수학 과목의 평균 점수보다 높은 점수를 받은 수강 기록만 뽑는 서브쿼리를 직접 작성해보세요.
      - group [ref=f6e207]:
        - generic "▶ 정답 보기" [ref=f6e208] [cursor=pointer]
        - text: "``"
      - heading "5. 실무 팁" [level=2] [ref=f6e209]
      - list [ref=f6e210]:
        - listitem [ref=f6e211]: 이 레슨의 실습은 SQL 에디터에 값을 직접 타이핑하지만, 실제 애플리케이션 코드에서는 사용자 입력을 문자열로 이어 붙여 쿼리를 만들지 않습니다 — 값을 따로 넘기는 파라미터 바인딩 방식을 쓰며, 이는 Step 2에서 다룹니다.
        - listitem [ref=f6e212]:
          - code [ref=f6e213]: "`SELECT *`"
          - text: 대신 필요한 열만 골라 조회하는 습관을 들입니다 — 나중에 표에 열이 늘어나도 코드가 덜 흔들립니다.
        - listitem [ref=f6e214]: JOIN을 걸기 전에 각 표를 따로 조회해 행 수를 확인해두면, JOIN 결과가 예상과 다를 때 원인을 빨리 찾을 수 있습니다.
        - listitem [ref=f6e215]:
          - text: 데이터가 큰 표에서는
          - code [ref=f6e216]: "`WHERE`"
          - text: 없이 전체 조회를 하지 않습니다.
      - figure [ref=f6e217]:
        - code [ref=f6e219]:
          - generic [ref=f6e220]: "-- 실습을 되돌립니다. practice 서랍(스키마)을 통째로 지웁니다."
          - generic [ref=f6e221]: "-- 이 문장은 practice 스키마만 대상으로 하므로 사이트 진도 데이터에는 아무 영향이 없습니다."
          - generic [ref=f6e222]: DROP SCHEMA IF EXISTS practice CASCADE;
          - button "Copy code" [ref=f6e223]
      - heading "6. 핵심 정리 및 스스로 점검" [level=2] [ref=f6e225]
      - paragraph [ref=f6e226]:
        - strong [ref=f6e227]: 핵심 정리
      - list [ref=f6e228]:
        - listitem [ref=f6e229]:
          - code [ref=f6e230]: "`SELECT ~ FROM ~ WHERE ~ ORDER BY`"
          - text: 가 조회의 기본 뼈대다
        - listitem [ref=f6e231]:
          - code [ref=f6e232]: "`INNER JOIN`"
          - text: 은 짝이 없는 행을 버리고,
          - code [ref=f6e233]: "`LEFT JOIN`"
          - text: 은 왼쪽 표의 행을 남긴다
        - listitem [ref=f6e234]:
          - code [ref=f6e235]: "`GROUP BY`"
          - text: 는 같은 값끼리 묶고,
          - code [ref=f6e236]: "`WHERE`"
          - text: 는 묶기 전에,
          - code [ref=f6e237]: "`HAVING`"
          - text: 은 묶은 뒤에 거른다
        - listitem [ref=f6e238]: 서브쿼리는 쿼리 안에 다른 쿼리를 넣어 그 결과를 조건이나 값으로 쓴다
        - listitem [ref=f6e239]: 애플리케이션 코드에서는 문자열 결합 대신 파라미터 바인딩으로 쿼리를 만든다
