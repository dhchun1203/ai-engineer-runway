          - row [ref=f6e254]:
            - cell "INNER JOIN" [ref=f6e255]
            - cell "두 표 모두에 짝이 있는 행만 남기는 JOIN" [ref=f6e256]
          - row [ref=f6e257]:
            - cell "LEFT JOIN" [ref=f6e258]
