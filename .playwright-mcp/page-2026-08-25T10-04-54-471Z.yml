      - paragraph [ref=e150]: 박서연(3학년), 김지현(2학년) 순서로 2행이 나옵니다.
      - figure [ref=e151]:
        - generic [ref=e152]:
          - code [ref=e154]:
            - generic [ref=e155]: "-- JOIN: 학생과 과목을 수강 표로 이어 붙인다"
            - generic [ref=e156]: SELECT s.name AS 학생, sub.name AS 과목, e.score AS 점수
            - generic [ref=e157]: FROM practice.enrollments e
            - generic [ref=e158]: INNER JOIN practice.students s ON s.id = e.student_id
            - generic [ref=e159]: INNER JOIN practice.subjects sub ON sub.id = e.subject_id
            - generic [ref=e160]: ORDER BY e.id;
            - generic [ref=e162]: "-- LEFT JOIN 비교: 수강 기록이 없는 학생도 남긴다"
            - generic [ref=e163]: SELECT s.name AS 학생, sub.name AS 과목
            - generic [ref=e164]: FROM practice.students s
            - generic [ref=e165]: LEFT JOIN practice.enrollments e ON e.student_id = s.id
            - generic [ref=e166]: LEFT JOIN practice.subjects sub ON sub.id = e.subject_id
            - generic [ref=e167]: ORDER BY s.id;
          - button "코드 복사" [ref=e168]
          - status [ref=e172]
      - paragraph [ref=e173]:
        - text: 첫 번째
        - code [ref=e174]: "`INNER JOIN`"
        - text: 은 수강 기록 개수만큼 5행이 나옵니다. 두 번째
        - code [ref=e175]: "`LEFT JOIN`"
        - text: 은 모든 학생이 최소 1행씩 나오는데, 위 준비 데이터에서는 학생 3명 모두 수강 기록이 있어 결과 행 수가 같습니다 — 수강 기록이 없는 학생을 넣으면 그 학생의 과목 자리가 빈 채로(
        - code [ref=e176]: "`NULL`"
        - text: ) 남는 것이
        - code [ref=e177]: "`LEFT JOIN`"
        - text: 의 차이입니다.
      - figure [ref=e178]:
        - generic [ref=e179]:
          - code [ref=e181]:
            - generic [ref=e182]: "-- 집계: 학생별 평균 점수, 60점 이상만 남긴다"
            - generic [ref=e183]: SELECT s.name AS 학생, COUNT(e.id) AS 수강수, AVG(e.score) AS 평균점수
            - generic [ref=e184]: FROM practice.students s
            - generic [ref=e185]: JOIN practice.enrollments e ON e.student_id = s.id
            - generic [ref=e186]: GROUP BY s.name
            - generic [ref=e187]: HAVING AVG(e.score) >= 60
            - generic [ref=e188]: ORDER BY 평균점수 DESC;
          - button "코드 복사" [ref=e189]
          - status [ref=e193]
      - paragraph [ref=e194]:
        - text: 학생별로 한 줄씩(3행) 나오되,
        - code [ref=e195]: "`WHERE`"
        - text: 가 아니라
        - code [ref=e196]: "`HAVING`"
        - text: 으로 평균을 거르므로 평균이 60점 미만인 학생이 있었다면 그 학생만 결과에서 빠졌을 것입니다.
      - figure [ref=e197]:
        - generic [ref=e198]:
          - code [ref=e200]:
            - generic [ref=e201]: "-- 서브쿼리: 전체 평균 점수보다 높은 점수를 받은 수강 기록만 본다"
            - generic [ref=e202]: SELECT s.name AS 학생, sub.name AS 과목, e.score AS 점수
            - generic [ref=e203]: FROM practice.enrollments e
            - generic [ref=e204]: JOIN practice.students s ON s.id = e.student_id
            - generic [ref=e205]: JOIN practice.subjects sub ON sub.id = e.subject_id
            - generic [ref=e206]: WHERE e.score > (SELECT AVG(score) FROM practice.enrollments)
            - generic [ref=e207]: ORDER BY e.score DESC;
          - button "코드 복사" [ref=e208]
          - status [ref=e212]
      - paragraph [ref=e213]:
        - text: 괄호 안
        - code [ref=e214]: "`(SELECT AVG(score) FROM practice.enrollments)`"
        - text: 가 먼저 계산되어 하나의 숫자(전체 평균)가 되고, 바깥 쿼리의
        - code [ref=e215]: "`WHERE`"
        - text: 가 그 숫자보다 높은 점수만 남깁니다.
      - heading "해보기" [level=3] [ref=e216]
      - paragraph [ref=e217]:
        - text: 위 JOIN 예제에서
        - code [ref=e218]: "`INNER JOIN`"
        - text: 을
        - code [ref=e219]: "`LEFT JOIN`"
        - text: 으로 바꿔 실행해보세요(첫 번째 쿼리). 결과 행 수가 달라지는지, 왜 그런지 확인합니다.
      - group [ref=e220]:
