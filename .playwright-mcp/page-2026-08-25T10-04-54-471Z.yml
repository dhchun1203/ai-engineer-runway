        - text: "````"
      - heading "해보기" [level=3] [ref=e222]
      - paragraph [ref=e223]:
        - text: 집계 쿼리의
        - code [ref=e224]: "`GROUP BY s.name`"
        - text: 을
        - code [ref=e225]: "`GROUP BY sub.name`"
        - text: (과목 기준)으로 바꿔, 과목별 평균 점수를 다시 뽑아보세요.
      - group [ref=e226]:
        - generic "▶ 정답 보기" [ref=e227] [cursor=pointer]
        - text: "``"
      - heading "해보기" [level=3] [ref=e228]
      - paragraph [ref=e229]: 수학 과목의 평균 점수보다 높은 점수를 받은 수강 기록만 뽑는 서브쿼리를 직접 작성해보세요.
      - group [ref=e230]:
        - generic "▶ 정답 보기" [ref=e231] [cursor=pointer]
        - text: "``"
      - heading "5. 실무 팁" [level=2] [ref=e232]
      - list [ref=e233]:
        - listitem [ref=e234]: 이 레슨의 실습은 SQL 에디터에 값을 직접 타이핑하지만, 실제 애플리케이션 코드에서는 사용자 입력을 문자열로 이어 붙여 쿼리를 만들지 않습니다 — 값을 따로 넘기는 파라미터 바인딩 방식을 쓰며, 이는 Step 2에서 다룹니다.
        - listitem [ref=e235]:
          - code [ref=e236]: "`SELECT *`"
          - text: 대신 필요한 열만 골라 조회하는 습관을 들입니다 — 나중에 표에 열이 늘어나도 코드가 덜 흔들립니다.
        - listitem [ref=e237]: JOIN을 걸기 전에 각 표를 따로 조회해 행 수를 확인해두면, JOIN 결과가 예상과 다를 때 원인을 빨리 찾을 수 있습니다.
        - listitem [ref=e238]:
          - text: 데이터가 큰 표에서는
          - code [ref=e239]: "`WHERE`"
          - text: 없이 전체 조회를 하지 않습니다.
