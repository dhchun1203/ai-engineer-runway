            - generic [ref=e115]: INSERT INTO practice.subjects (name) VALUES
            - generic [ref=e116]: ('수학'),
            - generic [ref=e117]: ('영어'),
            - generic [ref=e118]: ('과학');
            - generic [ref=e120]: INSERT INTO practice.enrollments (student_id, subject_id, score) VALUES
            - generic [ref=e121]: (1, 1, 88),
