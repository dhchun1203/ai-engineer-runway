      - paragraph [ref=e131]:
        - text: 맨 앞의
        - code [ref=e132]: "`DROP SCHEMA ... CASCADE`"
        - text: 가
        - code [ref=e133]: "`practice`"
        - text: 서랍을 통째로 비우고 시작하므로, 앞 레슨에서 만든 표가 남아 있어도 충돌하지 않고
        - code [ref=e134]: "`INSERT`"
        - text: 가 중복으로 쌓이지도 않습니다. 지워지는 것은
        - code [ref=e135]: "`practice`"
        - text: 서랍뿐이라 사이트 진도 데이터에는 아무 영향이 없습니다.
      - figure [ref=e136]:
        - generic [ref=e137]:
          - code [ref=e139]:
            - generic [ref=e140]: "-- 조회: 학년이 2 이상인 학생을 학년 내림차순으로 본다"
            - generic [ref=e141]: SELECT name, grade
            - generic [ref=e142]: FROM practice.students
