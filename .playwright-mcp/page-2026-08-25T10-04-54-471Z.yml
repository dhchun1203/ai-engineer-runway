              - code [ref=e49]: "`name, grade`"
          - row [ref=e50]:
            - cell [ref=e51]:
              - code [ref=e52]: "`FROM`"
            - cell "어느 표에서 가져올지 정한다" [ref=e53]
            - cell [ref=e54]:
              - code [ref=e55]: "`practice.students`"
          - row [ref=e56]:
            - cell [ref=e57]:
              - code [ref=e58]: "`WHERE`"
            - cell "조건에 맞는 행만 남긴다" [ref=e59]
            - cell [ref=e60]:
              - code [ref=e61]: "`grade > 1`"
          - row [ref=e62]:
            - cell [ref=e63]:
              - code [ref=e64]: "`ORDER BY`"
            - cell "결과 순서를 정한다" [ref=e65]
            - cell [ref=e66]:
              - code [ref=e67]: "`grade DESC`"
      - heading "🔗 JOIN — 두 표를 겹쳐 놓기" [level=3] [ref=e68]
      - paragraph [ref=e69]:
        - text: JOIN(공통 열을 기준으로 두 표를 이어 붙이는 연산)은 두 표에서 같은 값을 가진 열끼리 짝을 맞춰 나란히 붙이는 것입니다.
        - code [ref=e70]: "`INNER JOIN`"
        - text: 은 양쪽 모두에 짝이 있는 행만 남기고,
        - code [ref=e71]: "`LEFT JOIN`"
        - text: 은 왼쪽 표의 행을 짝이 없어도 남깁니다 — "짝이 없는 행을 버리느냐, 남기느냐"의 차이입니다.
      - heading "🧮 집계 — 같은 것끼리 접기" [level=3] [ref=e72]
      - paragraph [ref=e73]:
        - text: 집계 함수(COUNT · SUM · AVG처럼 여러 행을 하나의 값으로 계산하는 함수)는
        - code [ref=e74]: "`GROUP BY`"
        - text: (같은 값을 가진 행끼리 묶는 절)와 짝을 이뤄 씁니다.
        - code [ref=e75]: "`WHERE`"
        - text: 는 묶기 전에 개별 행을 거르고,
        - code [ref=e76]: "`HAVING`"
        - text: (그룹으로 묶은 뒤 결과를 거르는 조건절)은 묶어서 계산한 뒤의 결과를 거릅니다.
      - heading "❓ 서브쿼리 — 질문 안의 질문" [level=3] [ref=e77]
      - paragraph [ref=e78]:
        - text: 서브쿼리(쿼리 안에 들어있는 또 다른 쿼리)는
        - code [ref=e79]: "`WHERE`"
        - text: 조건 안에 넣어 "이 값보다 큰 것만" 같은 조건을 만들거나,
        - code [ref=e80]: "`FROM`"
        - text: 자리에 넣어 미리 정리된 결과를 다시 조회하는 데 씁니다.
      - heading "4. 실무 예제" [level=2] [ref=e81]
      - paragraph [ref=e82]: 앞 레슨을 건너뛰었어도 이 블록 하나로 준비가 끝납니다. 연습용 서랍을 먼저 비우고 새로 만들기 때문에, 앞 레슨을 했든 안 했든 · 몇 번을 실행하든 항상 같은 상태에서 시작합니다.
      - figure [ref=e83]:
        - generic [ref=e84]:
          - code [ref=e86]:
            - generic [ref=e87]: "-- Supabase 대시보드 → SQL 에디터에서 실행합니다."
            - generic [ref=e88]: "-- 연습용 practice 서랍을 통째로 비우고 새로 만듭니다."
            - generic [ref=e89]: DROP SCHEMA IF EXISTS practice CASCADE;
            - generic [ref=e90]: CREATE SCHEMA practice;
            - generic [ref=e92]: CREATE TABLE practice.students (
            - generic [ref=e93]: id serial PRIMARY KEY,
            - generic [ref=e94]: name text NOT NULL,
            - generic [ref=e95]: grade int
            - generic [ref=e96]: );
            - generic [ref=e98]: CREATE TABLE practice.subjects (
            - generic [ref=e99]: id serial PRIMARY KEY,
            - generic [ref=e100]: name text NOT NULL
            - generic [ref=e101]: );
            - generic [ref=e103]: CREATE TABLE practice.enrollments (
            - generic [ref=e104]: id serial PRIMARY KEY,
            - generic [ref=e105]: student_id int NOT NULL REFERENCES practice.students(id),
            - generic [ref=e106]: subject_id int NOT NULL REFERENCES practice.subjects(id),
            - generic [ref=e107]: score int
            - generic [ref=e108]: );
