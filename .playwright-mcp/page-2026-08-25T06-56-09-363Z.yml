        - rowgroup [ref=f5e43]:
          - row [ref=f5e44]:
            - cell [ref=f5e45]:
              - code [ref=f5e46]: "`SELECT`"
            - cell "가져올 열을 고른다" [ref=f5e47]
            - cell [ref=f5e48]:
              - code [ref=f5e49]: "`name, grade`"
          - row [ref=f5e50]:
            - cell [ref=f5e51]:
              - code [ref=f5e52]: "`FROM`"
            - cell "어느 표에서 가져올지 정한다" [ref=f5e53]
            - cell [ref=f5e54]:
              - code [ref=f5e55]: "`practice.students`"
          - row [ref=f5e56]:
            - cell [ref=f5e57]:
              - code [ref=f5e58]: "`WHERE`"
            - cell "조건에 맞는 행만 남긴다" [ref=f5e59]
            - cell [ref=f5e60]:
              - code [ref=f5e61]: "`grade > 1`"
          - row [ref=f5e62]:
            - cell [ref=f5e63]:
              - code [ref=f5e64]: "`ORDER BY`"
            - cell "결과 순서를 정한다" [ref=f5e65]
            - cell [ref=f5e66]:
              - code [ref=f5e67]: "`grade DESC`"
      - heading "🔗 JOIN — 두 표를 겹쳐 놓기" [level=3] [ref=f5e68]
      - paragraph [ref=f5e69]:
        - text: JOIN(공통 열을 기준으로 두 표를 이어 붙이는 연산)은 두 표에서 같은 값을 가진 열끼리 짝을 맞춰 나란히 붙이는 것입니다.
        - code [ref=f5e70]: "`INNER JOIN`"
        - text: 은 양쪽 모두에 짝이 있는 행만 남기고,
        - code [ref=f5e71]: "`LEFT JOIN`"
        - text: 은 왼쪽 표의 행을 짝이 없어도 남깁니다 — "짝이 없는 행을 버리느냐, 남기느냐"의 차이입니다.
      - heading "🧮 집계 — 같은 것끼리 접기" [level=3] [ref=f5e72]
      - paragraph [ref=f5e73]:
        - text: 집계 함수(COUNT · SUM · AVG처럼 여러 행을 하나의 값으로 계산하는 함수)는
        - code [ref=f5e74]: "`GROUP BY`"
        - text: (같은 값을 가진 행끼리 묶는 절)와 짝을 이뤄 씁니다.
        - code [ref=f5e75]: "`WHERE`"
        - text: 는 묶기 전에 개별 행을 거르고,
        - code [ref=f5e76]: "`HAVING`"
        - text: (그룹으로 묶은 뒤 결과를 거르는 조건절)은 묶어서 계산한 뒤의 결과를 거릅니다.
      - heading "❓ 서브쿼리 — 질문 안의 질문" [level=3] [ref=f5e77]
      - paragraph [ref=f5e78]:
        - text: 서브쿼리(쿼리 안에 들어있는 또 다른 쿼리)는
        - code [ref=f5e79]: "`WHERE`"
        - text: 조건 안에 넣어 "이 값보다 큰 것만" 같은 조건을 만들거나,
        - code [ref=f5e80]: "`FROM`"
        - text: 자리에 넣어 미리 정리된 결과를 다시 조회하는 데 씁니다.
      - heading "4. 실무 예제" [level=2] [ref=f5e81]
      - paragraph [ref=f5e82]:
        - text: 앞 레슨을 건너뛰었어도 이 블록 하나로 준비가 끝납니다.
        - code [ref=f5e83]: "`IF NOT EXISTS`"
        - text: 를 쓰기 때문에 두 번 실행해도 안전합니다.
      - figure [ref=f5e84]:
        - code [ref=f5e86]:
          - generic [ref=f5e87]: "-- Supabase 대시보드 → SQL 에디터에서 실행합니다. 앞 레슨을 안 했어도 이 블록 하나로 준비가 끝납니다."
          - generic [ref=f5e88]: CREATE SCHEMA IF NOT EXISTS practice;
          - generic [ref=f5e90]: CREATE TABLE IF NOT EXISTS practice.students (
          - generic [ref=f5e91]: id serial PRIMARY KEY,
          - generic [ref=f5e92]: name text NOT NULL,
          - generic [ref=f5e93]: grade int
          - generic [ref=f5e94]: );
          - generic [ref=f5e96]: CREATE TABLE IF NOT EXISTS practice.subjects (
          - generic [ref=f5e97]: id serial PRIMARY KEY,
          - generic [ref=f5e98]: name text NOT NULL
          - generic [ref=f5e99]: );
          - generic [ref=f5e101]: CREATE TABLE IF NOT EXISTS practice.enrollments (
          - generic [ref=f5e102]: id serial PRIMARY KEY,
          - generic [ref=f5e103]: student_id int NOT NULL REFERENCES practice.students(id),
          - generic [ref=f5e104]: subject_id int NOT NULL REFERENCES practice.subjects(id),
          - generic [ref=f5e105]: score int
          - generic [ref=f5e106]: );
          - generic [ref=f5e108]: INSERT INTO practice.students (name, grade) VALUES
          - generic [ref=f5e109]: ('김지현', 2),
          - generic [ref=f5e110]: ('이민준', 1),
          - generic [ref=f5e111]: ('박서연', 3);
          - generic [ref=f5e113]: INSERT INTO practice.subjects (name) VALUES
          - generic [ref=f5e114]: ('수학'),
          - generic [ref=f5e115]: ('영어'),
          - generic [ref=f5e116]: ('과학');
          - generic [ref=f5e118]: INSERT INTO practice.enrollments (student_id, subject_id, score) VALUES
          - generic [ref=f5e119]: (1, 1, 88),
          - generic [ref=f5e120]: (1, 2, 95),
          - generic [ref=f5e121]: (2, 1, 72),
          - generic [ref=f5e122]: (3, 3, 91),
          - generic [ref=f5e123]: (3, 1, 60);
          - button "Copy code" [ref=f5e124]
      - paragraph [ref=f5e126]:
        - code [ref=f5e127]: "`CREATE SCHEMA/TABLE IF NOT EXISTS`"
        - text: 가 있어 이미 표가 있으면 건드리지 않습니다. 다만
        - code [ref=f5e128]: "`INSERT`"
        - text: 는 실행할 때마다 새 행이 추가되니, 처음 한 번만 실행하는 걸 권장합니다.
      - figure [ref=f5e129]:
        - code [ref=f5e131]:
          - generic [ref=f5e132]: "-- 조회: 학년이 2 이상인 학생을 학년 내림차순으로 본다"
          - generic [ref=f5e133]: SELECT name, grade
          - generic [ref=f5e134]: FROM practice.students
          - generic [ref=f5e135]: WHERE grade >= 2
          - generic [ref=f5e136]: ORDER BY grade DESC;
          - button "Copy code" [ref=f5e137]
      - paragraph [ref=f5e139]: 박서연(3학년), 김지현(2학년) 순서로 2행이 나옵니다.
      - figure [ref=f5e140]:
        - code [ref=f5e142]:
          - generic [ref=f5e143]: "-- JOIN: 학생과 과목을 수강 표로 이어 붙인다"
          - generic [ref=f5e144]: SELECT s.name AS 학생, sub.name AS 과목, e.score AS 점수
          - generic [ref=f5e145]: FROM practice.enrollments e
          - generic [ref=f5e146]: INNER JOIN practice.students s ON s.id = e.student_id
          - generic [ref=f5e147]: INNER JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f5e148]: ORDER BY e.id;
          - generic [ref=f5e150]: "-- LEFT JOIN 비교: 수강 기록이 없는 학생도 남긴다"
          - generic [ref=f5e151]: SELECT s.name AS 학생, sub.name AS 과목
          - generic [ref=f5e152]: FROM practice.students s
          - generic [ref=f5e153]: LEFT JOIN practice.enrollments e ON e.student_id = s.id
          - generic [ref=f5e154]: LEFT JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f5e155]: ORDER BY s.id;
          - button "Copy code" [ref=f5e156]
      - paragraph [ref=f5e158]:
        - text: 첫 번째
        - code [ref=f5e159]: "`INNER JOIN`"
        - text: 은 수강 기록 개수만큼 5행이 나옵니다. 두 번째
        - code [ref=f5e160]: "`LEFT JOIN`"
        - text: 은 모든 학생이 최소 1행씩 나오는데, 위 준비 데이터에서는 학생 3명 모두 수강 기록이 있어 결과 행 수가 같습니다 — 수강 기록이 없는 학생을 넣으면 그 학생의 과목 자리가 빈 채로(
        - code [ref=f5e161]: "`NULL`"
        - text: ) 남는 것이
        - code [ref=f5e162]: "`LEFT JOIN`"
        - text: 의 차이입니다.
      - figure [ref=f5e163]:
        - code [ref=f5e165]:
          - generic [ref=f5e166]: "-- 집계: 학생별 평균 점수, 60점 이상만 남긴다"
          - generic [ref=f5e167]: SELECT s.name AS 학생, COUNT(e.id) AS 수강수, AVG(e.score) AS 평균점수
          - generic [ref=f5e168]: FROM practice.students s
          - generic [ref=f5e169]: JOIN practice.enrollments e ON e.student_id = s.id
          - generic [ref=f5e170]: GROUP BY s.name
          - generic [ref=f5e171]: HAVING AVG(e.score) >= 60
          - generic [ref=f5e172]: ORDER BY 평균점수 DESC;
          - button "Copy code" [ref=f5e173]
      - paragraph [ref=f5e175]:
        - text: 학생별로 한 줄씩(3행) 나오되,
        - code [ref=f5e176]: "`WHERE`"
        - text: 가 아니라
        - code [ref=f5e177]: "`HAVING`"
        - text: 으로 평균을 거르므로 평균이 60점 미만인 학생이 있었다면 그 학생만 결과에서 빠졌을 것입니다.
      - figure [ref=f5e178]:
        - code [ref=f5e180]:
          - generic [ref=f5e181]: "-- 서브쿼리: 전체 평균 점수보다 높은 점수를 받은 수강 기록만 본다"
          - generic [ref=f5e182]: SELECT s.name AS 학생, sub.name AS 과목, e.score AS 점수
          - generic [ref=f5e183]: FROM practice.enrollments e
          - generic [ref=f5e184]: JOIN practice.students s ON s.id = e.student_id
          - generic [ref=f5e185]: JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f5e186]: WHERE e.score > (SELECT AVG(score) FROM practice.enrollments)
          - generic [ref=f5e187]: ORDER BY e.score DESC;
          - button "Copy code" [ref=f5e188]
      - paragraph [ref=f5e190]:
        - text: 괄호 안
        - code [ref=f5e191]: "`(SELECT AVG(score) FROM practice.enrollments)`"
        - text: 가 먼저 계산되어 하나의 숫자(전체 평균)가 되고, 바깥 쿼리의
        - code [ref=f5e192]: "`WHERE`"
        - text: 가 그 숫자보다 높은 점수만 남깁니다.
      - heading "해보기" [level=3] [ref=f5e193]
      - paragraph [ref=f5e194]:
        - text: 위 JOIN 예제에서
        - code [ref=f5e195]: "`INNER JOIN`"
        - text: 을
        - code [ref=f5e196]: "`LEFT JOIN`"
        - text: 으로 바꿔 실행해보세요(첫 번째 쿼리). 결과 행 수가 달라지는지, 왜 그런지 확인합니다.
      - group [ref=f5e197]:
        - generic "▶ 정답 보기" [ref=f5e198] [cursor=pointer]
        - text: "````"
      - heading "해보기" [level=3] [ref=f5e199]
      - paragraph [ref=f5e200]:
        - text: 집계 쿼리의
        - code [ref=f5e201]: "`GROUP BY s.name`"
        - text: 을
        - code [ref=f5e202]: "`GROUP BY sub.name`"
        - text: (과목 기준)으로 바꿔, 과목별 평균 점수를 다시 뽑아보세요.
      - group [ref=f5e203]:
        - generic "▶ 정답 보기" [ref=f5e204] [cursor=pointer]
        - text: "``"
      - heading "해보기" [level=3] [ref=f5e205]
      - paragraph [ref=f5e206]: 수학 과목의 평균 점수보다 높은 점수를 받은 수강 기록만 뽑는 서브쿼리를 직접 작성해보세요.
      - group [ref=f5e207]:
        - generic "▶ 정답 보기" [ref=f5e208] [cursor=pointer]
        - text: "``"
      - heading "5. 실무 팁" [level=2] [ref=f5e209]
      - list [ref=f5e210]:
        - listitem [ref=f5e211]: 이 레슨의 실습은 SQL 에디터에 값을 직접 타이핑하지만, 실제 애플리케이션 코드에서는 사용자 입력을 문자열로 이어 붙여 쿼리를 만들지 않습니다 — 값을 따로 넘기는 파라미터 바인딩 방식을 쓰며, 이는 Step 2에서 다룹니다.
        - listitem [ref=f5e212]:
          - code [ref=f5e213]: "`SELECT *`"
          - text: 대신 필요한 열만 골라 조회하는 습관을 들입니다 — 나중에 표에 열이 늘어나도 코드가 덜 흔들립니다.
        - listitem [ref=f5e214]: JOIN을 걸기 전에 각 표를 따로 조회해 행 수를 확인해두면, JOIN 결과가 예상과 다를 때 원인을 빨리 찾을 수 있습니다.
        - listitem [ref=f5e215]:
          - text: 데이터가 큰 표에서는
          - code [ref=f5e216]: "`WHERE`"
          - text: 없이 전체 조회를 하지 않습니다.
      - figure [ref=f5e217]:
        - code [ref=f5e219]:
          - generic [ref=f5e220]: "-- 실습을 되돌립니다. practice 서랍(스키마)을 통째로 지웁니다."
          - generic [ref=f5e221]: "-- 이 문장은 practice 스키마만 대상으로 하므로 사이트 진도 데이터에는 아무 영향이 없습니다."
          - generic [ref=f5e222]: DROP SCHEMA IF EXISTS practice CASCADE;
          - button "Copy code" [ref=f5e223]
      - heading "6. 핵심 정리 및 스스로 점검" [level=2] [ref=f5e225]
      - paragraph [ref=f5e226]:
        - strong [ref=f5e227]: 핵심 정리
      - list [ref=f5e228]:
        - listitem [ref=f5e229]:
          - code [ref=f5e230]: "`SELECT ~ FROM ~ WHERE ~ ORDER BY`"
          - text: 가 조회의 기본 뼈대다
        - listitem [ref=f5e231]:
          - code [ref=f5e232]: "`INNER JOIN`"
          - text: 은 짝이 없는 행을 버리고,
          - code [ref=f5e233]: "`LEFT JOIN`"
          - text: 은 왼쪽 표의 행을 남긴다
        - listitem [ref=f5e234]:
          - code [ref=f5e235]: "`GROUP BY`"
          - text: 는 같은 값끼리 묶고,
          - code [ref=f5e236]: "`WHERE`"
          - text: 는 묶기 전에,
          - code [ref=f5e237]: "`HAVING`"
          - text: 은 묶은 뒤에 거른다
        - listitem [ref=f5e238]: 서브쿼리는 쿼리 안에 다른 쿼리를 넣어 그 결과를 조건이나 값으로 쓴다
        - listitem [ref=f5e239]: 애플리케이션 코드에서는 문자열 결합 대신 파라미터 바인딩으로 쿼리를 만든다
