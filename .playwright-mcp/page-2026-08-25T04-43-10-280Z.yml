            - cell "원본 문서를 복사해 낙서해도 되는 사본" [ref=f1e54]
      - heading "🌊 한 바퀴의 흐름" [level=3] [ref=f1e55]
      - paragraph [ref=f1e56]: 전체 흐름은 이렇게 이어집니다.
      - figure [ref=f1e57]:
        - code [ref=f1e59]:
