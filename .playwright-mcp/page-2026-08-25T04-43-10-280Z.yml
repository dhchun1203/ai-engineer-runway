        - listitem [ref=f1e172]: 커밋은 변경을 하나로 묶은 기록, 브랜치는 그 기록이 이어지는 갈래다
        - listitem [ref=f1e173]: 한 바퀴는 clone → branch → commit → push(로컬) → PR → merge(GitHub 웹) → pull(로컬) 순서로 돈다
        - listitem [ref=f1e174]: 브랜치로 작업하면 원줄기는 항상 검증된 상태로 남고, 문제가 생겨도 브랜치만 버리면 된다
