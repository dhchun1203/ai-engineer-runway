        - text: "``````"
      - heading "5. 실무 팁" [level=2] [ref=f1e152]
      - list [ref=f1e153]:
        - listitem [ref=f1e154]:
          - strong [ref=f1e155]: 브랜치 이름은 하는 일을 담아서 짓습니다.
          - code [ref=f1e156]: "`update-readme`"
          - text: ","
          - code [ref=f1e157]: "`fix-typo`"
          - text: 처럼 무엇을 바꾸는지 이름만 보고 알 수 있게 짓습니다.
        - listitem [ref=f1e158]:
          - strong [ref=f1e159]: 커밋 메시지는 한 줄 요약으로 씁니다.
          - text: "\"수정함\" 대신 \"docs: 브랜치 실습 문구 추가\"처럼 무엇을 왜 바꿨는지가 드러나게 씁니다."
        - listitem [ref=f1e160]:
          - strong [ref=f1e161]: 원줄기 이름은 저장소마다 다를 수 있습니다.
          - code [ref=f1e162]: "`main`"
          - text: 이 흔하지만 이 사이트 저장소는
          - code [ref=f1e163]: "`master`"
          - text: 를 씁니다 — 명령을 칠 때 실제 저장소의 원줄기 이름을 확인합니다.
        - listitem [ref=f1e164]:
          - strong [ref=f1e165]:
            - text: 머지 후에는 반드시
            - code [ref=f1e166]: "`pull`"
            - text: 로 로컬을 맞춥니다.
          - text: 그러지 않으면 다음 브랜치가 낡은 지점에서 갈라져 나중에 불필요한 충돌이 생깁니다.
      - heading "6. 핵심 정리 및 스스로 점검" [level=2] [ref=f1e167]
      - paragraph [ref=f1e168]:
        - strong [ref=f1e169]: 핵심 정리
