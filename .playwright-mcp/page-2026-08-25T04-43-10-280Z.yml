      - paragraph [ref=f1e76]: 로컬에서 저장소를 내려받고(clone) 갈래를 뻗어(branch) 작업을 커밋(commit)한 뒤 원격에 올리면(push), 그다음부터는 GitHub 웹으로 넘어가 PR을 열고 머지합니다. 마지막으로 다시 로컬 터미널로 돌아와 최신 상태를 받습니다(pull).
      - heading "🚧 왜 원줄기에서 바로 고치지 않나" [level=3] [ref=f1e77]
      - paragraph [ref=f1e78]:
        - text: 브랜치(branch, 작업을 따로 복사해 두는 갈래) 없이 원줄기(주 브랜치,
        - code [ref=f1e79]: "`master`"
        - text: 또는
        - code [ref=f1e80]: "`main`"
        - text: )에서 바로 고치면, 실수했을 때 되돌리기가 훨씬 번거롭고 다른 사람이 리뷰할 기회 없이 바로 배포될 수 있습니다. 브랜치를 뻗어 작업하면 원줄기는 항상 "검증된 상태"로 남고, 문제가 생겨도 그 브랜치만 버리면 됩니다.
      - paragraph [ref=f1e81]:
        - text: 이 사이트 저장소(
        - code [ref=f1e82]: "`ai-engineer-runway`"
        - text: )도 실제로 이 흐름을 씁니다 — PR(풀 리퀘스트, pull request, 변경을 원줄기에 합쳐 달라는 요청)을 열면 자동으로 미리보기 주소가 생겨서, 머지하기 전에 실제 화면으로 먼저 확인할 수 있습니다.
      - heading "4. 실무 예제" [level=2] [ref=f1e83]
      - paragraph [ref=f1e84]: 아래는 연습용 저장소(1-1 레슨에서 만든 빈 저장소)를 대상으로, 브랜치를 뻗어 파일을 고치고 PR을 열어 머지한 뒤 로컬을 동기화하는 한 바퀴 전체입니다. 저장소 주소만 여러분 것으로 바꾸면 그대로 따라 칠 수 있습니다.
      - paragraph [ref=f1e85]:
        - strong [ref=f1e86]: 1단계 — 저장소를 내려받고 브랜치를 뻗습니다.
      - figure [ref=f1e87]:
        - code [ref=f1e89]:
          - generic [ref=f1e90]: "# 연습용 저장소를 로컬로 클론합니다 (주소는 여러분의 GitHub 저장소로 바꿉니다)"
          - generic [ref=f1e91]: git clone https://github.com/내계정/git-pr-practice.git
          - generic [ref=f1e92]: cd git-pr-practice
          - generic [ref=f1e94]: "# master를 건드리지 않고 새 갈래를 뻗습니다"
          - generic [ref=f1e95]: git switch -c update-readme
          - button "Copy code" [ref=f1e96]
      - paragraph [ref=f1e98]:
        - text: macOS는 터미널 앱(Terminal)에서 그대로 같은 명령을 씁니다 —
        - code [ref=f1e99]: "`git`"
        - text: 명령 자체는 Windows와 동일합니다.
      - paragraph [ref=f1e100]:
        - text: 여기까지 하면
        - code [ref=f1e101]: "`update-readme`"
        - text: 라는 새 브랜치 위에 서 있게 됩니다.
        - code [ref=f1e102]: "`master`"
        - text: 는 전혀 바뀌지 않았습니다.
      - paragraph [ref=f1e103]:
        - strong [ref=f1e104]: 2단계 — 파일을 고치고 커밋한 뒤 원격에 올립니다.
      - figure [ref=f1e105]:
        - code [ref=f1e107]:
          - generic [ref=f1e108]: "# README.md에 한 줄을 추가합니다 (편집기로 직접 열어 고쳐도 됩니다)"
          - generic [ref=f1e109]: Add-Content -Path README.md -Value "브랜치 실습 중입니다."
          - generic [ref=f1e111]: "# 변경을 커밋으로 묶습니다"
          - generic [ref=f1e112]: git add README.md
          - generic [ref=f1e113]: "git commit -m \"docs: 브랜치 실습 문구 추가\""
          - generic [ref=f1e115]: "# 원격 저장소(GitHub)에 올립니다 -u는 다음부터 push만 쳐도 되게 연결해 둡니다"
          - generic [ref=f1e116]: git push -u origin update-readme
          - button "Copy code" [ref=f1e117]
      - paragraph [ref=f1e119]:
        - code [ref=f1e120]: "`git push`"
        - text: 가 끝나면 터미널에 GitHub가 알려주는 PR 생성 링크가 함께 출력됩니다.
      - paragraph [ref=f1e121]:
        - strong [ref=f1e122]: 3단계 — GitHub 웹에서 PR을 열고 머지합니다.
      - paragraph [ref=f1e123]:
        - text: 브라우저로 저장소 페이지를 열면 방금 올린 브랜치에 대해 "Compare & pull request" 버튼이 보입니다. 클릭 → 제목·설명을 간단히 적고 "Create pull request" → 변경 내용을 확인한 뒤 "Merge pull request" → "Confirm merge" 순서로 누르면
        - code [ref=f1e124]: "`update-readme`"
        - text: 의 변경이
        - code [ref=f1e125]: "`master`"
        - text: 에 합쳐집니다.
      - paragraph [ref=f1e126]:
        - strong [ref=f1e127]: 4단계 — 머지 후 로컬을 최신 상태로 되돌립니다.
      - figure [ref=f1e128]:
        - code [ref=f1e130]:
          - generic [ref=f1e131]: git switch master
          - generic [ref=f1e132]: git pull
          - button "Copy code" [ref=f1e133]
      - paragraph [ref=f1e135]:
        - code [ref=f1e136]: "`git pull`"
        - text: 을 하지 않으면 로컬의
        - code [ref=f1e137]: "`master`"
        - text: 는 여전히 머지 전 상태입니다 — 다음 브랜치를 여기서 새로 뻗으면 낡은 지점에서 시작하게 됩니다.
      - heading "해보기" [level=3] [ref=f1e138]
      - paragraph [ref=f1e139]: 위 4단계를 실제로 한 바퀴 따라 해보세요. 브랜치를 만들어 파일 한 줄을 고치고, PR을 열어 머지까지 끝냅니다.
      - group [ref=f1e140]:
