        - text: "``````"
      - heading "해보기" [level=3] [ref=f1e142]
      - paragraph [ref=f1e143]:
        - text: "두 번째 브랜치(예:"
        - code [ref=f1e144]: "`add-note`"
        - text: )를 새로 뻗어, 첫 번째 변경과 충돌하지 않는 다른 줄을 추가한 뒤 다시 push → PR → merge → pull까지 한 바퀴 더 돌려보세요.
      - group [ref=f1e145]:
        - generic "▶ 정답 보기" [ref=f1e146] [cursor=pointer]
        - text: "``````"
      - heading "해보기" [level=3] [ref=f1e147]
