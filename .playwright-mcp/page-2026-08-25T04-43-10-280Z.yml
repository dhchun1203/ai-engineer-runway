      - heading "2. 왜 배우나" [level=2] [ref=f1e31]
      - paragraph [ref=f1e32]: 혼자 코드를 짤 때는 파일을 그냥 고치면 끝이지만, 여럿이 같이 만들 때는 "누가 무엇을 왜 바꿨는지"가 남아야 합니다. 브랜치와 PR은 그 흔적을 남기는 가장 기본적인 협업 단위입니다. 실제로 이 사전학습 사이트 자체도 지금 여러분이 배우는 것과 똑같은 방식(브랜치 → PR → 머지)으로 만들어지고 있습니다. 오늘 익힌 흐름이 곧 실무에서 매일 쓰는 흐름입니다.
      - heading "3. 개념 설명" [level=2] [ref=f1e33]
      - heading "🗂️ 저장소·커밋·브랜치" [level=3] [ref=f1e34]
      - paragraph [ref=f1e35]: Git(버전 관리 도구, 파일이 바뀐 이력을 통째로 저장하는 프로그램)은 파일이 아니라 "이력"을 저장합니다. 원격 저장소(remote repository, GitHub 서버에 있는 저장소)와 로컬 저장소(local repository, 내 컴퓨터에 있는 저장소)는 같은 이력을 각자 들고 있는 복사본입니다. 커밋(commit, 변경 내용을 하나로 묶어 저장한 기록)은 "이 시점에 파일이 이렇게 바뀌었다"는 스냅샷이고, 브랜치(branch, 작업을 따로 복사해 두는 갈래)는 그 스냅샷들이 이어지는 하나의 줄기입니다.
      - table [ref=f1e36]:
