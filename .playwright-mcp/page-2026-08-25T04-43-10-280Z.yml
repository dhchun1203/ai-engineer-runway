          - button "Copy code" [ref=f1e61]
      - paragraph [ref=f1e63]: 각 단계가 어디서 일어나는지 표로 정리하면 다음과 같습니다.
      - table [ref=f1e64]:
        - rowgroup [ref=f1e65]:
          - row [ref=f1e66]:
            - columnheader "단계" [ref=f1e67]
            - columnheader "어디서" [ref=f1e68]
        - rowgroup [ref=f1e69]:
          - row [ref=f1e70]:
            - cell "clone, branch, commit, push, pull" [ref=f1e71]
            - cell "로컬 터미널" [ref=f1e72]
          - row [ref=f1e73]:
            - cell "PR 열기, merge" [ref=f1e74]
