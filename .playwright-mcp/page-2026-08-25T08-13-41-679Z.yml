      - heading "1. 학습 목표" [level=2] [ref=f12e24]
      - paragraph [ref=f12e25]: 이 레슨을 마치면 다음을 할 수 있습니다.
      - list [ref=f12e26]:
        - listitem [ref=f12e27]: 조건을 걸어 원하는 행만 뽑을 수 있다
        - listitem [ref=f12e28]: 두 표를 JOIN으로 이어 한 결과로 볼 수 있다
        - listitem [ref=f12e29]: GROUP BY로 묶어 개수 · 합계 · 평균을 낼 수 있다
        - listitem [ref=f12e30]: 서브쿼리로 다른 쿼리의 결과를 조건에 쓸 수 있다
      - heading "2. 왜 배우나" [level=2] [ref=f12e31]
      - paragraph [ref=f12e32]: 데이터베이스에 데이터를 넣는 일보다 꺼내는 일이 실무의 대부분을 차지합니다. 원하는 조건으로 걸러내고, 여러 표를 이어 붙이고, 묶어서 세는 방법을 알아야 화면에 보여줄 데이터를 정확히 뽑아낼 수 있습니다. 이 레슨도 앞 레슨과 마찬가지로 Supabase SQL 에디터에서 전부 실습하므로 브라우저만 있으면 됩니다.
      - heading "3. 개념 설명" [level=2] [ref=f12e33]
      - heading "🔍 SELECT의 뼈대" [level=3] [ref=f12e34]
      - paragraph [ref=f12e35]:
        - code [ref=f12e36]: "`SELECT 무엇을 FROM 어디서 WHERE 어떤 조건으로 ORDER BY 어떤 순서로`"
        - text: 가 조회 쿼리(query, 데이터베이스에 데이터를 요청하는 명령문)의 기본 뼈대입니다.
      - table [ref=f12e37]:
        - rowgroup [ref=f12e38]:
          - row [ref=f12e39]:
            - columnheader "자리" [ref=f12e40]
            - columnheader "하는 일" [ref=f12e41]
            - columnheader "예시" [ref=f12e42]
        - rowgroup [ref=f12e43]:
          - row [ref=f12e44]:
            - cell [ref=f12e45]:
              - code [ref=f12e46]: "`SELECT`"
            - cell "가져올 열을 고른다" [ref=f12e47]
            - cell [ref=f12e48]:
              - code [ref=f12e49]: "`name, grade`"
          - row [ref=f12e50]:
            - cell [ref=f12e51]:
              - code [ref=f12e52]: "`FROM`"
            - cell "어느 표에서 가져올지 정한다" [ref=f12e53]
            - cell [ref=f12e54]:
              - code [ref=f12e55]: "`practice.students`"
          - row [ref=f12e56]:
            - cell [ref=f12e57]:
              - code [ref=f12e58]: "`WHERE`"
            - cell "조건에 맞는 행만 남긴다" [ref=f12e59]
            - cell [ref=f12e60]:
              - code [ref=f12e61]: "`grade > 1`"
          - row [ref=f12e62]:
            - cell [ref=f12e63]:
              - code [ref=f12e64]: "`ORDER BY`"
            - cell "결과 순서를 정한다" [ref=f12e65]
            - cell [ref=f12e66]:
              - code [ref=f12e67]: "`grade DESC`"
      - heading "🔗 JOIN — 두 표를 겹쳐 놓기" [level=3] [ref=f12e68]
      - paragraph [ref=f12e69]:
        - text: JOIN(공통 열을 기준으로 두 표를 이어 붙이는 연산)은 두 표에서 같은 값을 가진 열끼리 짝을 맞춰 나란히 붙이는 것입니다.
        - code [ref=f12e70]: "`INNER JOIN`"
        - text: 은 양쪽 모두에 짝이 있는 행만 남기고,
        - code [ref=f12e71]: "`LEFT JOIN`"
        - text: 은 왼쪽 표의 행을 짝이 없어도 남깁니다 — "짝이 없는 행을 버리느냐, 남기느냐"의 차이입니다.
      - heading "🧮 집계 — 같은 것끼리 접기" [level=3] [ref=f12e72]
      - paragraph [ref=f12e73]:
        - text: 집계 함수(COUNT · SUM · AVG처럼 여러 행을 하나의 값으로 계산하는 함수)는
        - code [ref=f12e74]: "`GROUP BY`"
        - text: (같은 값을 가진 행끼리 묶는 절)와 짝을 이뤄 씁니다.
        - code [ref=f12e75]: "`WHERE`"
        - text: 는 묶기 전에 개별 행을 거르고,
        - code [ref=f12e76]: "`HAVING`"
        - text: (그룹으로 묶은 뒤 결과를 거르는 조건절)은 묶어서 계산한 뒤의 결과를 거릅니다.
      - heading "❓ 서브쿼리 — 질문 안의 질문" [level=3] [ref=f12e77]
      - paragraph [ref=f12e78]:
        - text: 서브쿼리(쿼리 안에 들어있는 또 다른 쿼리)는
        - code [ref=f12e79]: "`WHERE`"
        - text: 조건 안에 넣어 "이 값보다 큰 것만" 같은 조건을 만들거나,
        - code [ref=f12e80]: "`FROM`"
        - text: 자리에 넣어 미리 정리된 결과를 다시 조회하는 데 씁니다.
      - heading "4. 실무 예제" [level=2] [ref=f12e81]
      - paragraph [ref=f12e82]: 앞 레슨을 건너뛰었어도 이 블록 하나로 준비가 끝납니다. 연습용 서랍을 먼저 비우고 새로 만들기 때문에, 앞 레슨을 했든 안 했든 · 몇 번을 실행하든 항상 같은 상태에서 시작합니다.
      - figure [ref=f12e83]:
        - code [ref=f12e85]:
          - generic [ref=f12e86]: "-- Supabase 대시보드 → SQL 에디터에서 실행합니다."
          - generic [ref=f12e87]: "-- 연습용 practice 서랍을 통째로 비우고 새로 만듭니다."
          - generic [ref=f12e88]: DROP SCHEMA IF EXISTS practice CASCADE;
          - generic [ref=f12e89]: CREATE SCHEMA practice;
          - generic [ref=f12e91]: CREATE TABLE practice.students (
          - generic [ref=f12e92]: id serial PRIMARY KEY,
          - generic [ref=f12e93]: name text NOT NULL,
          - generic [ref=f12e94]: grade int
          - generic [ref=f12e95]: );
          - generic [ref=f12e97]: CREATE TABLE practice.subjects (
          - generic [ref=f12e98]: id serial PRIMARY KEY,
          - generic [ref=f12e99]: name text NOT NULL
          - generic [ref=f12e100]: );
          - generic [ref=f12e102]: CREATE TABLE practice.enrollments (
          - generic [ref=f12e103]: id serial PRIMARY KEY,
          - generic [ref=f12e104]: student_id int NOT NULL REFERENCES practice.students(id),
          - generic [ref=f12e105]: subject_id int NOT NULL REFERENCES practice.subjects(id),
          - generic [ref=f12e106]: score int
          - generic [ref=f12e107]: );
          - generic [ref=f12e109]: INSERT INTO practice.students (name, grade) VALUES
          - generic [ref=f12e110]: ('김지현', 2),
          - generic [ref=f12e111]: ('이민준', 1),
          - generic [ref=f12e112]: ('박서연', 3);
