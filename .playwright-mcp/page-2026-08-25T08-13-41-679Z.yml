      - paragraph [ref=f12e127]:
        - text: 맨 앞의
        - code [ref=f12e128]: "`DROP SCHEMA ... CASCADE`"
        - text: 가
        - code [ref=f12e129]: "`practice`"
        - text: 서랍을 통째로 비우고 시작하므로, 앞 레슨에서 만든 표가 남아 있어도 충돌하지 않고
        - code [ref=f12e130]: "`INSERT`"
        - text: 가 중복으로 쌓이지도 않습니다. 지워지는 것은
        - code [ref=f12e131]: "`practice`"
        - text: 서랍뿐이라 사이트 진도 데이터에는 아무 영향이 없습니다.
      - figure [ref=f12e132]:
        - code [ref=f12e134]:
          - generic [ref=f12e135]: "-- 조회: 학년이 2 이상인 학생을 학년 내림차순으로 본다"
          - generic [ref=f12e136]: SELECT name, grade
          - generic [ref=f12e137]: FROM practice.students
          - generic [ref=f12e138]: WHERE grade >= 2
          - generic [ref=f12e139]: ORDER BY grade DESC;
          - button "Copy code" [ref=f12e140]
      - paragraph [ref=f12e142]: 박서연(3학년), 김지현(2학년) 순서로 2행이 나옵니다.
      - figure [ref=f12e143]:
        - code [ref=f12e145]:
          - generic [ref=f12e146]: "-- JOIN: 학생과 과목을 수강 표로 이어 붙인다"
          - generic [ref=f12e147]: SELECT s.name AS 학생, sub.name AS 과목, e.score AS 점수
          - generic [ref=f12e148]: FROM practice.enrollments e
          - generic [ref=f12e149]: INNER JOIN practice.students s ON s.id = e.student_id
          - generic [ref=f12e150]: INNER JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f12e151]: ORDER BY e.id;
          - generic [ref=f12e153]: "-- LEFT JOIN 비교: 수강 기록이 없는 학생도 남긴다"
          - generic [ref=f12e154]: SELECT s.name AS 학생, sub.name AS 과목
          - generic [ref=f12e155]: FROM practice.students s
          - generic [ref=f12e156]: LEFT JOIN practice.enrollments e ON e.student_id = s.id
          - generic [ref=f12e157]: LEFT JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f12e158]: ORDER BY s.id;
          - button "Copy code" [ref=f12e159]
      - paragraph [ref=f12e161]:
        - text: 첫 번째
        - code [ref=f12e162]: "`INNER JOIN`"
        - text: 은 수강 기록 개수만큼 5행이 나옵니다. 두 번째
        - code [ref=f12e163]: "`LEFT JOIN`"
        - text: 은 모든 학생이 최소 1행씩 나오는데, 위 준비 데이터에서는 학생 3명 모두 수강 기록이 있어 결과 행 수가 같습니다 — 수강 기록이 없는 학생을 넣으면 그 학생의 과목 자리가 빈 채로(
        - code [ref=f12e164]: "`NULL`"
        - text: ) 남는 것이
        - code [ref=f12e165]: "`LEFT JOIN`"
        - text: 의 차이입니다.
      - figure [ref=f12e166]:
        - code [ref=f12e168]:
          - generic [ref=f12e169]: "-- 집계: 학생별 평균 점수, 60점 이상만 남긴다"
          - generic [ref=f12e170]: SELECT s.name AS 학생, COUNT(e.id) AS 수강수, AVG(e.score) AS 평균점수
          - generic [ref=f12e171]: FROM practice.students s
          - generic [ref=f12e172]: JOIN practice.enrollments e ON e.student_id = s.id
          - generic [ref=f12e173]: GROUP BY s.name
          - generic [ref=f12e174]: HAVING AVG(e.score) >= 60
          - generic [ref=f12e175]: ORDER BY 평균점수 DESC;
          - button "Copy code" [ref=f12e176]
      - paragraph [ref=f12e178]:
        - text: 학생별로 한 줄씩(3행) 나오되,
        - code [ref=f12e179]: "`WHERE`"
        - text: 가 아니라
        - code [ref=f12e180]: "`HAVING`"
        - text: 으로 평균을 거르므로 평균이 60점 미만인 학생이 있었다면 그 학생만 결과에서 빠졌을 것입니다.
      - figure [ref=f12e181]:
        - code [ref=f12e183]:
          - generic [ref=f12e184]: "-- 서브쿼리: 전체 평균 점수보다 높은 점수를 받은 수강 기록만 본다"
          - generic [ref=f12e185]: SELECT s.name AS 학생, sub.name AS 과목, e.score AS 점수
          - generic [ref=f12e186]: FROM practice.enrollments e
          - generic [ref=f12e187]: JOIN practice.students s ON s.id = e.student_id
          - generic [ref=f12e188]: JOIN practice.subjects sub ON sub.id = e.subject_id
          - generic [ref=f12e189]: WHERE e.score > (SELECT AVG(score) FROM practice.enrollments)
          - generic [ref=f12e190]: ORDER BY e.score DESC;
          - button "Copy code" [ref=f12e191]
      - paragraph [ref=f12e193]:
        - text: 괄호 안
        - code [ref=f12e194]: "`(SELECT AVG(score) FROM practice.enrollments)`"
        - text: 가 먼저 계산되어 하나의 숫자(전체 평균)가 되고, 바깥 쿼리의
        - code [ref=f12e195]: "`WHERE`"
        - text: 가 그 숫자보다 높은 점수만 남깁니다.
      - heading "해보기" [level=3] [ref=f12e196]
      - paragraph [ref=f12e197]:
        - text: 위 JOIN 예제에서
        - code [ref=f12e198]: "`INNER JOIN`"
        - text: 을
        - code [ref=f12e199]: "`LEFT JOIN`"
        - text: 으로 바꿔 실행해보세요(첫 번째 쿼리). 결과 행 수가 달라지는지, 왜 그런지 확인합니다.
      - group [ref=f12e200]:
        - generic "▶ 정답 보기" [ref=f12e201] [cursor=pointer]
        - text: "````"
      - heading "해보기" [level=3] [ref=f12e202]
      - paragraph [ref=f12e203]:
        - text: 집계 쿼리의
        - code [ref=f12e204]: "`GROUP BY s.name`"
        - text: 을
        - code [ref=f12e205]: "`GROUP BY sub.name`"
        - text: (과목 기준)으로 바꿔, 과목별 평균 점수를 다시 뽑아보세요.
      - group [ref=f12e206]:
        - generic "▶ 정답 보기" [ref=f12e207] [cursor=pointer]
        - text: "``"
      - heading "해보기" [level=3] [ref=f12e208]
      - paragraph [ref=f12e209]: 수학 과목의 평균 점수보다 높은 점수를 받은 수강 기록만 뽑는 서브쿼리를 직접 작성해보세요.
      - group [ref=f12e210]:
        - generic "▶ 정답 보기" [ref=f12e211] [cursor=pointer]
        - text: "``"
      - heading "5. 실무 팁" [level=2] [ref=f12e212]
      - list [ref=f12e213]:
        - listitem [ref=f12e214]: 이 레슨의 실습은 SQL 에디터에 값을 직접 타이핑하지만, 실제 애플리케이션 코드에서는 사용자 입력을 문자열로 이어 붙여 쿼리를 만들지 않습니다 — 값을 따로 넘기는 파라미터 바인딩 방식을 쓰며, 이는 Step 2에서 다룹니다.
        - listitem [ref=f12e215]:
          - code [ref=f12e216]: "`SELECT *`"
          - text: 대신 필요한 열만 골라 조회하는 습관을 들입니다 — 나중에 표에 열이 늘어나도 코드가 덜 흔들립니다.
        - listitem [ref=f12e217]: JOIN을 걸기 전에 각 표를 따로 조회해 행 수를 확인해두면, JOIN 결과가 예상과 다를 때 원인을 빨리 찾을 수 있습니다.
        - listitem [ref=f12e218]:
          - text: 데이터가 큰 표에서는
          - code [ref=f12e219]: "`WHERE`"
          - text: 없이 전체 조회를 하지 않습니다.
      - figure [ref=f12e220]:
        - code [ref=f12e222]:
          - generic [ref=f12e223]: "-- 실습을 되돌립니다. practice 서랍(스키마)을 통째로 지웁니다."
          - generic [ref=f12e224]: "-- 이 문장은 practice 스키마만 대상으로 하므로 사이트 진도 데이터에는 아무 영향이 없습니다."
          - generic [ref=f12e225]: DROP SCHEMA IF EXISTS practice CASCADE;
          - button "Copy code" [ref=f12e226]
      - heading "6. 핵심 정리 및 스스로 점검" [level=2] [ref=f12e228]
      - paragraph [ref=f12e229]:
        - strong [ref=f12e230]: 핵심 정리
      - list [ref=f12e231]:
        - listitem [ref=f12e232]:
          - code [ref=f12e233]: "`SELECT ~ FROM ~ WHERE ~ ORDER BY`"
          - text: 가 조회의 기본 뼈대다
        - listitem [ref=f12e234]:
          - code [ref=f12e235]: "`INNER JOIN`"
          - text: 은 짝이 없는 행을 버리고,
          - code [ref=f12e236]: "`LEFT JOIN`"
          - text: 은 왼쪽 표의 행을 남긴다
        - listitem [ref=f12e237]:
          - code [ref=f12e238]: "`GROUP BY`"
          - text: 는 같은 값끼리 묶고,
          - code [ref=f12e239]: "`WHERE`"
          - text: 는 묶기 전에,
          - code [ref=f12e240]: "`HAVING`"
          - text: 은 묶은 뒤에 거른다
        - listitem [ref=f12e241]: 서브쿼리는 쿼리 안에 다른 쿼리를 넣어 그 결과를 조건이나 값으로 쓴다
        - listitem [ref=f12e242]: 애플리케이션 코드에서는 문자열 결합 대신 파라미터 바인딩으로 쿼리를 만든다
      - paragraph [ref=f12e243]:
        - strong [ref=f12e244]: 이 레슨의 단어
      - table [ref=f12e245]:
        - rowgroup [ref=f12e246]:
          - row [ref=f12e247]:
            - columnheader "단어" [ref=f12e248]
            - columnheader "뜻" [ref=f12e249]
        - rowgroup [ref=f12e250]:
          - row [ref=f12e251]:
            - cell "쿼리" [ref=f12e252]
            - cell "데이터베이스에 데이터를 요청하는 명령문" [ref=f12e253]
          - row [ref=f12e254]:
            - cell "JOIN" [ref=f12e255]
            - cell "공통 열을 기준으로 두 표를 이어 붙이는 연산" [ref=f12e256]
