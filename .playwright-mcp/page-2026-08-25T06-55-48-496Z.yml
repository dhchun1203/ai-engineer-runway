        - listitem [ref=f4e30]: 전처리와 모델을 Pipeline 하나로 묶어 실행할 수 있다
      - heading "2. 왜 배우나" [level=2] [ref=f4e31]
      - paragraph [ref=f4e32]: 모델을 만드는 것 자체는 몇 줄이면 끝나지만, 실무에서 진짜 중요한 질문은 "이 모델을 믿어도 되는가"입니다. 성적을 재는 방법을 모르면 엉터리 모델도 잘 만든 것처럼 착각하기 쉽습니다. 오늘은 앞 레슨에서 만든 분류기의 성적을 정직하게 재는 법과, 전처리·모델을 한 덩어리로 묶어 실수를 줄이는 법을 배웁니다.
      - heading "3. 개념 설명" [level=2] [ref=f4e33]
      - heading "📝 시험지를 미리 보면 안 된다" [level=3] [ref=f4e34]
      - paragraph [ref=f4e35]:
        - text: 시험 문제를 미리 보고 그대로 시험을 치면 100점을 받아도 실력이 늘었다고 할 수 없습니다. 모델도 똑같습니다 — 학습에 쓴 데이터로 그대로 성적을 매기면 실제보다 항상 좋게 나옵니다. 그래서 데이터를 학습용(train)과 평가용(test)으로 미리 나눠두고, 모델은 학습용만 보고 배우게 하고 점수는 평가용으로만 매깁니다. 앞 레슨(
        - code [ref=f4e36]: "`1-5-ml-model-types`"
        - text: )의 예제는 이 구분 없이 전체 데이터로 학습과 채점을 같이 했는데, 이번 레슨부터는 이 구분을 반드시 지킵니다.
      - heading "📊 성적표 읽는 법" [level=3] [ref=f4e37]
      - paragraph [ref=f4e38]:
        - text: 이번에는 앞 레슨에서 쓴 그 꽃 데이터(
        - code [ref=f4e39]: "`load_iris`"
        - text: )와 같은 분류기를 그대로 씁니다. 성적을 재는 지표는 여러 개가 있고, 지표마다 보는 게 다릅니다.
      - table [ref=f4e40]:
        - rowgroup [ref=f4e41]:
          - row [ref=f4e42]:
            - columnheader "지표" [ref=f4e43]
            - columnheader "무엇을 재나" [ref=f4e44]
            - columnheader "언제 중요한가" [ref=f4e45]
            - columnheader "일상 비유" [ref=f4e46]
        - rowgroup [ref=f4e47]:
          - row [ref=f4e48]:
            - cell "정확도(accuracy, 전체 중 맞힌 비율)" [ref=f4e49]
            - cell "전체 예측 중 맞힌 비율" [ref=f4e50]
            - cell "정답 종류가 고르게 섞여 있을 때" [ref=f4e51]
            - cell "전체 문제 중 맞힌 문제 수" [ref=f4e52]
          - row [ref=f4e53]:
            - cell "정밀도(precision, \"맞다\"고 한 것 중 실제로 맞은 비율)" [ref=f4e54]
            - cell "\"맞다\"고 한 것 중 진짜 맞은 비율" [ref=f4e55]
            - 'cell "잘못 \"맞다\"고 하면 손해가 클 때(예: 스팸 오탐)" [ref=f4e56]'
            - cell "\"합격\"이라 부른 사람 중 진짜 합격자 비율" [ref=f4e57]
          - row [ref=f4e58]:
            - cell "재현율(recall, 실제 정답 중 놓치지 않고 맞힌 비율)" [ref=f4e59]
            - cell "실제 정답 중 놓치지 않고 맞힌 비율" [ref=f4e60]
            - 'cell "진짜를 놓치면 손해가 클 때(예: 질병 검사)" [ref=f4e61]'
            - cell "실제 환자 중 검사로 찾아낸 비율" [ref=f4e62]
      - paragraph [ref=f4e63]: 정확도 하나만 보면 위험한 상황이 있습니다. 100명 중 1명만 병에 걸린 데이터에서 "전부 정상"이라고만 찍어도 정확도는 99%가 나옵니다. 이런 데이터를 불균형 데이터(imbalanced data, 정답 종류의 비율이 한쪽으로 크게 치우친 데이터)라고 부르는데, 이때는 정밀도·재현율을 함께 봐야 모델이 실제로 쓸모 있는지 알 수 있습니다.
      - heading "🏭 조립 라인 — Pipeline" [level=3] [ref=f4e64]
      - paragraph [ref=f4e65]:
        - text: 전처리(스케일 맞추기)와 모델을 따로 실행하면 문제가 생길 수 있습니다. 스케일러를 전체 데이터로 먼저 맞춰버리면, 평가용 데이터의 정보가 학습 단계에 몰래 새어 들어가 버립니다 — 이를 데이터 누수(data leakage, 평가용 정보가 학습 과정에 섞여 들어가는 문제)라고 합니다. Pipeline(파이프라인, 전처리와 모델을 순서대로 묶어 하나처럼 다루는 도구)은 공장 조립 라인처럼
        - code [ref=f4e66]: "`재료 → 전처리 → 모델 → 결과`"
        - text: 를 한 덩어리로 묶어서, 항상 학습용 데이터로만 전처리 기준을 정하고 평가용 데이터에는 그 기준을 적용만 하도록 강제합니다.
      - heading "4. 실무 예제" [level=2] [ref=f4e67]
      - figure [ref=f4e68]:
        - code [ref=f4e70]:
          - generic [ref=f4e71]: "# ml_metrics_pipeline.py"
          - generic [ref=f4e72]: "# 앞 레슨과 같은 붓꽃(iris) 데이터로, 이번엔 성적을 정직하게 매기고"
          - generic [ref=f4e73]: "# 전처리+모델을 Pipeline 하나로 묶는다"
          - generic [ref=f4e75]: from sklearn.datasets import load_iris
          - generic [ref=f4e76]: from sklearn.model_selection import train_test_split
          - generic [ref=f4e77]: from sklearn.pipeline import Pipeline
          - generic [ref=f4e78]: from sklearn.preprocessing import StandardScaler
          - generic [ref=f4e79]: from sklearn.linear_model import LogisticRegression
          - generic [ref=f4e80]: from sklearn.metrics import accuracy_score, classification_report
          - generic [ref=f4e82]: "# 1) 앞 레슨과 같은 데이터"
          - generic [ref=f4e83]: iris = load_iris()
          - generic [ref=f4e84]: X, y = iris.data, iris.target
          - generic [ref=f4e86]: "# 2) 학습용/평가용 분리 — 시험 문제를 미리 보고 시험을 치지 않기 위해"
          - generic [ref=f4e87]: X_train, X_test, y_train, y_test = train_test_split(
          - generic [ref=f4e88]: X, y, test_size=0.3, random_state=0
          - generic [ref=f4e89]: )
          - generic [ref=f4e91]: "# 3) 전처리(스케일러) + 모델을 한 덩어리로 묶어 학습용 데이터에만 fit"
          - generic [ref=f4e92]: pipeline = Pipeline([
          - generic [ref=f4e93]: ("scaler", StandardScaler()),
          - generic [ref=f4e94]: ("classifier", LogisticRegression(max_iter=200)),
          - generic [ref=f4e95]: "])"
          - generic [ref=f4e96]: pipeline.fit(X_train, y_train)
          - generic [ref=f4e98]: "# 4) 평가용 데이터로만 예측하고 지표를 계산 — 학습에 쓴 데이터로 채점하지 않는다"
          - generic [ref=f4e99]: y_pred = pipeline.predict(X_test)
          - generic [ref=f4e100]: "print(f\"정확도: {accuracy_score(y_test, y_pred):.2f}\")"
          - generic [ref=f4e101]: print("클래스별 리포트:")
          - generic [ref=f4e102]: print(classification_report(y_test, y_pred, target_names=iris.target_names))
          - button "Copy code" [ref=f4e103]
      - paragraph [ref=f4e105]:
        - strong [ref=f4e106]: "실행 방법:"
        - text: 위 코드를
        - code [ref=f4e107]: "`ml_metrics_pipeline.py`"
        - text: 파일로 저장한 뒤, PowerShell에서 아래 명령을 실행합니다. (앞 레슨에서 이미
        - code [ref=f4e108]: "`scikit-learn`"
