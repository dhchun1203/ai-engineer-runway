        - text: 로, 또는
        - code [ref=f4e132]: "`random_state`"
        - text: 를
        - code [ref=f4e133]: "`0`"
        - text: 에서 다른 숫자로 바꿔가며 정확도가 어떻게 변하는지 관찰해보세요.
