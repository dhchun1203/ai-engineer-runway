        - listitem [ref=f4e162]: 정확도·정밀도·재현율은 서로 다른 것을 재며, 데이터 상황에 따라 봐야 할 지표가 다르다
        - listitem [ref=f4e163]: 불균형 데이터에서는 정확도만으로 판단하면 안 된다
        - listitem [ref=f4e164]: Pipeline은 전처리와 모델을 한 덩어리로 묶어 데이터 누수를 막는다
        - listitem [ref=f4e165]: 한 번의 분할·평가 점수는 운이 섞여 있어 소수점까지 과신하면 안 된다
