      - figure [ref=f4e109]:
        - code [ref=f4e111]:
          - generic [ref=f4e112]: pip install scikit-learn
          - generic [ref=f4e113]: py ml_metrics_pipeline.py
          - button "Copy code" [ref=f4e114]
      - paragraph [ref=f4e116]:
        - text: macOS는
        - code [ref=f4e117]: "`python3 ml_metrics_pipeline.py`"
        - text: 로 실행합니다.
      - paragraph [ref=f4e118]:
        - text: "실행하면 정확도가 소수점 둘째 자리 숫자(예:"
        - code [ref=f4e119]: "`0.98`"
        - text: 처럼 1에 가까운 값)로 먼저 출력됩니다. 이어서 품종별로 정밀도(precision)·재현율(recall)·f1-score·support(그 품종의 평가용 샘플 수)가 표 형태로 출력됩니다. 붓꽃 데이터는 품종 구분이 뚜렷해서 세 품종 모두 지표가 1에 가깝게 나오는 경우가 많습니다.
      - heading "해보기" [level=3] [ref=f4e120]
      - paragraph [ref=f4e121]:
        - text: Pipeline에서
        - code [ref=f4e122]: "`(\"scaler\", StandardScaler())`"
        - text: 단계를 빼고
        - code [ref=f4e123]: "`LogisticRegression`"
        - text: 만 바로 학습시켜 결과를 비교해보세요.
