      - heading "5. 실무 팁" [level=2] [ref=f4e145]
      - list [ref=f4e146]:
        - listitem [ref=f4e147]:
          - strong [ref=f4e148]: 정확도 하나만 보고 판단하지 않습니다.
          - text: 불균형 데이터에서는 정확도가 높아도 실제로 쓸모없는 모델일 수 있습니다.
        - listitem [ref=f4e149]:
          - strong [ref=f4e150]: 평가용 데이터로는 절대 학습하지 않습니다.
          - code [ref=f4e151]: "`fit`"
          - text: 에는 학습용 데이터만, 지표 계산에는 평가용 데이터만 씁니다.
        - listitem [ref=f4e152]:
          - strong [ref=f4e153]: 전처리는 Pipeline 안에 넣습니다.
          - text: 스케일러를 Pipeline 밖에서 전체 데이터에 미리 적용하면 데이터 누수가 생길 수 있습니다.
        - listitem [ref=f4e154]:
          - strong [ref=f4e155]: 한 번의 분할로 나온 점수는 운이 섞여 있습니다.
          - text: 소수점 여러 자리까지 믿지 말고,
          - code [ref=f4e156]: "`random_state`"
          - text: 를 바꿔가며 여러 번 확인하는 습관을 들입니다.
      - heading "6. 핵심 정리 및 스스로 점검" [level=2] [ref=f4e157]
