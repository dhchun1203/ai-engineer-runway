          - code [ref=f13e30]: "`float`"
          - text: )·문자열(
          - code [ref=f13e31]: "`str`"
          - text: )·불리언(
          - code [ref=f13e32]: "`bool`"
          - text: ) 네 가지 기본 자료형을 구분하고
          - code [ref=f13e33]: "`type()`"
          - text: 으로 직접 확인할 수 있다
        - listitem [ref=f13e34]:
          - code [ref=f13e35]: "`if`"
          - text: /
          - code [ref=f13e36]: "`elif`"
          - text: /
          - code [ref=f13e37]: "`else`"
          - text: 로 조건에 따라 다른 코드를 실행하는 조건문을 작성할 수 있다
        - listitem [ref=f13e38]:
          - code [ref=f13e39]: "`for`"
          - text: 로 리스트를 순서대로 순회하며 각 항목을 처리하는 반복문을 작성할 수 있다
      - heading "2. 왜 배우나" [level=2] [ref=f13e40]
      - paragraph [ref=f13e41]: 변수·자료형·조건문·반복문은 이후 배울 함수·API 응답 처리·데이터 전처리 전부의 재료입니다. 값을 상자에 담고(변수), 상자 안 내용에 따라 갈림길을 타고(조건문), 여러 개를 한 번에 처리하는(반복문) 이 네 가지 없이는 어떤 실무 코드도 짜기 어렵습니다. 지금 확실히 다져두면 나중에 만나는 에러 메시지의 절반을 스스로 진단할 수 있습니다.
      - heading "3. 개념 설명" [level=2] [ref=f13e42]
      - heading "📦 변수는 이름표 붙은 상자" [level=3] [ref=f13e43]
      - paragraph [ref=f13e44]: 변수(variable, 값을 담아두는 이름 붙은 공간)를 상자라고 생각하면 쉽습니다. 상자 안에 값을 넣고, 상자에 이름표를 붙이는 것이 변수 선언입니다. Python은 상자를 만들기 전에 "이 상자엔 숫자만 담는다" 같은 선언을 하지 않습니다. 값을 넣는 순간 Python이 자동으로 자료형을 정합니다. 이를 동적 타이핑(dynamic typing, 값을 넣는 순간 자료형이 자동으로 정해지는 방식)이라고 부릅니다.
      - figure [ref=f13e45]:
        - code [ref=f13e47]:
          - generic [ref=f13e48]: "age = 25 # 정수 상자"
          - generic [ref=f13e49]: "name = \"지현\" # 문자열 상자"
          - button "Copy code" [ref=f13e50]
      - heading "🎨 자료형 4종 — 상자마다 다른 내용물" [level=3] [ref=f13e52]
      - table [ref=f13e53]:
