            - cell "스위치의 켜짐/꺼짐 상태" [ref=f13e93]
      - paragraph [ref=f13e94]:
        - text: 문자열은 반드시 따옴표로 감싸야 합니다 —
        - code [ref=f13e95]: "`name = 지현`"
        - text: 은 에러가 나지만
        - code [ref=f13e96]: "`name = \"지현\"`"
        - text: 은 정상 동작합니다. 숫자와 문자열은 자동으로 섞이지 않으므로(
        - code [ref=f13e97]: "`\"나이: \" + 25`"
        - text: 는 에러), f-string(
        - code [ref=f13e98]: "`f\"나이: {25}\"`"
        - text: )으로 조합해야 합니다.
      - heading "🚦 조건문은 갈림길" [level=3] [ref=f13e99]
      - paragraph [ref=f13e100]:
        - text: 갈림길 앞에 서 있다고 상상해보세요 — 표지판(조건)을 보고 어느 길로 갈지 정합니다. 조건문(conditional statement, 조건에 따라 다른 코드를 실행하는 문법)이 하는 일이 정확히 이것입니다.
        - code [ref=f13e101]: "`if 조건:`"
        - text: 이 참이면 그 아래 코드가 실행되고, 참이 아니면
        - code [ref=f13e102]: "`elif 다른 조건:`"
        - text: 을 차례로 검사하다가, 전부 거짓이면 마지막
        - code [ref=f13e103]: "`else:`"
        - text: 가 실행됩니다. 갈림길은 한 번에 딱 한 길로만 들어섭니다.
      - heading "🎢 반복문은 컨베이어벨트" [level=3] [ref=f13e104]
      - paragraph [ref=f13e105]:
        - text: 공장 컨베이어벨트 위로 상자가 하나씩 흘러오고, 작업자는 상자마다 똑같은 작업을 반복합니다. 반복문(loop statement, 여러 값을 순서대로 처리하는 문법)이 이 역할을 합니다.
        - code [ref=f13e106]: "`for 항목 in 리스트:`"
        - text: 는 리스트의 값을 하나씩 꺼내 같은 코드를 반복 실행합니다. 몇 번 반복할지 미리 정해져 있지 않고 "조건이 참인 동안" 계속 반복하고 싶을 땐
        - code [ref=f13e107]: "`while 조건:`"
        - text: 을 씁니다.
      - heading "4. 실무 예제" [level=2] [ref=f13e108]
      - paragraph [ref=f13e109]: 아래 스크립트는 회원 정보를 변수에 저장하고, 자료형을 확인하고, 등급에 따라 조건 분기하고, 회원 리스트를 반복문으로 순회하는 완결된 예제입니다. 그대로 복사해서 실행할 수 있습니다.
      - figure [ref=f13e110]:
        - code [ref=f13e112]:
          - generic [ref=f13e113]: "# variables.py"
          - generic [ref=f13e114]: "# 회원 정보를 변수로 관리하고, 조건문·반복문까지 활용하는 예제"
          - generic [ref=f13e116]: name = "김지현"
          - generic [ref=f13e117]: age = 27
          - generic [ref=f13e118]: height = 168.3
          - generic [ref=f13e119]: "membership_status = \"premium\" # \"premium\" / \"regular\" / \"dormant\" 중 하나"
          - generic [ref=f13e121]: "# 1) 각 변수의 자료형을 직접 확인한다"
          - generic [ref=f13e122]: "print(f\"{name}의 자료형: {type(name)}\")"
          - generic [ref=f13e123]: "print(f\"{age}의 자료형: {type(age)}\")"
          - generic [ref=f13e124]: "print(f\"{height}의 자료형: {type(height)}\")"
          - generic [ref=f13e125]: "print(f\"{membership_status}의 자료형: {type(membership_status)}\")"
          - generic [ref=f13e127]: print("---")
          - generic [ref=f13e129]: "# 2) f-string으로 숫자와 문자열을 함께 출력한다"
          - generic [ref=f13e130]: "print(f\"회원명: {name}, 나이: {age}세, 키: {height}cm\")"
          - generic [ref=f13e132]: "# 3) 조건문 — 회원 등급에 따라 다른 메시지를 보여준다 (갈림길)"
          - generic [ref=f13e133]: "if membership_status == \"premium\":"
          - generic [ref=f13e134]: discount_rate = 0.2
          - generic [ref=f13e135]: "print(f\"프리미엄 회원 할인율: {discount_rate * 100}%\")"
          - generic [ref=f13e136]: "elif membership_status == \"regular\":"
          - generic [ref=f13e137]: print("일반 회원입니다. 다음 구매부터 포인트가 적립됩니다.")
          - generic [ref=f13e138]: "else:"
          - generic [ref=f13e139]: print("휴면 회원입니다. 로그인하면 계정이 다시 활성화됩니다.")
          - generic [ref=f13e141]: print("---")
          - generic [ref=f13e143]: "# 4) 반복문 — 회원 리스트를 순서대로 처리한다 (컨베이어벨트)"
          - generic [ref=f13e144]: members = ["김지현", "이민준", "박서연"]
          - generic [ref=f13e145]: "for member in members:"
          - generic [ref=f13e146]: "print(f\"{member}님, 안녕하세요!\")"
          - button "Copy code" [ref=f13e147]
      - paragraph [ref=f13e149]:
        - strong [ref=f13e150]: "실행 방법:"
        - text: 위 코드를
        - code [ref=f13e151]: "`variables.py`"
        - text: 파일로 저장한 뒤, PowerShell에서 아래 명령을 실행합니다.
      - figure [ref=f13e152]:
        - code [ref=f13e154]:
          - generic [ref=f13e155]: "# variables.py 실행 — python 대신 py 런처를 씁니다"
          - generic [ref=f13e156]: py variables.py
          - button "Copy code" [ref=f13e157]
      - paragraph [ref=f13e159]:
        - text: macOS는
        - code [ref=f13e160]: "`python3 variables.py`"
        - text: 로 실행합니다.
      - paragraph [ref=f13e161]:
        - text: 실행하면 각 변수의 자료형(
        - code [ref=f13e162]: "`<class 'str'>`"
        - text: ","
        - code [ref=f13e163]: "`<class 'int'>`"
        - text: 등)이 먼저 출력되고, 이어서 회원 정보 문장, 프리미엄 회원 할인율 메시지가 나옵니다. 마지막으로 회원 3명의 이름이 담긴 인사말이 한 줄씩 순서대로 출력됩니다.
      - heading "해보기" [level=3] [ref=f13e164]
      - paragraph [ref=f13e165]:
        - code [ref=f13e166]: "`membership_status`"
        - text: 값을
        - code [ref=f13e167]: "`\"regular\"`"
        - text: 로, 그다음
        - code [ref=f13e168]: "`\"dormant\"`"
        - text: 로 바꿔가며 각각 실행해보세요. 어떤 메시지가 출력될지 먼저 예측한 뒤 실제 출력과 비교합니다.
