        - code [ref=f13e183]: "`+`"
        - text: 로 직접 이어 붙이는 코드를 예제 아래에 추가해 실행해보세요. 어떤 에러가 나는지 읽어봅니다.
      - group [ref=f13e184]:
        - generic "▶ 정답 보기" [ref=f13e185] [cursor=pointer]
