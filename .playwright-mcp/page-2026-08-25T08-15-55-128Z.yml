      - paragraph [ref=f13e25]: 이 레슨을 마치면 다음을 할 수 있습니다.
      - list [ref=f13e26]:
        - listitem [ref=f13e27]: Python 변수에 값을 저장하고, 이름을 짓는 규칙을 지켜 변수를 선언할 수 있다
        - listitem [ref=f13e28]:
