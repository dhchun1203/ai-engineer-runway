      - heading "5. 실무 팁" [level=2] [ref=f13e186]
      - list [ref=f13e187]:
        - listitem [ref=f13e188]:
          - strong [ref=f13e189]: 변수 이름은 의미를 담아서 짓습니다.
          - code [ref=f13e190]: "`a`"
          - text: ","
          - code [ref=f13e191]: "`temp1`"
          - text: 대신
          - code [ref=f13e192]: "`membership_status`"
          - text: 처럼 무엇을 담고 있는지 알 수 있게 짓습니다.
        - listitem [ref=f13e193]:
          - strong [ref=f13e194]: 숫자를 문자열에 직접 이어 붙이지 않습니다.
          - code [ref=f13e195]: "`\"나이: \" + str(25)`"
          - text: 보다
          - code [ref=f13e196]: "`f\"나이: {25}\"`"
          - text: (f-string)가 더 짧고 안전합니다.
        - listitem [ref=f13e197]:
          - strong [ref=f13e198]:
            - code [ref=f13e199]: "`type()`"
            - text: 을 디버깅 도구로 활용합니다.
          - code [ref=f13e200]: "`TypeError`"
          - text: 가 뜨면 관련 변수에
          - code [ref=f13e201]: "`print(type(변수명))`"
          - text: 을 추가해 실제 자료형부터 확인합니다.
        - listitem [ref=f13e202]:
          - strong [ref=f13e203]:
            - text: Windows에서는
            - code [ref=f13e204]: "`python`"
            - text: 대신
            - code [ref=f13e205]: "`py`"
            - text: 를 씁니다.
          - code [ref=f13e206]: "`python`"
          - text: 을 치면 Microsoft Store 화면이 열리거나 아무 반응이 없을 수 있습니다 — 실제 설치된 Python은
          - code [ref=f13e207]: "`py`"
          - text: 런처로 찾습니다.
      - heading "6. 핵심 정리 및 스스로 점검" [level=2] [ref=f13e208]
      - paragraph [ref=f13e209]:
        - strong [ref=f13e210]: 핵심 정리
      - list [ref=f13e211]:
        - listitem [ref=f13e212]: Python은 동적 타이핑이라 값을 넣는 순간 자료형이 자동으로 정해진다
        - listitem [ref=f13e213]:
          - text: "기본 자료형 네 가지:"
          - code [ref=f13e214]: "`int`"
          - text: (정수),
          - code [ref=f13e215]: "`float`"
          - text: (실수),
          - code [ref=f13e216]: "`str`"
          - text: (문자열),
          - code [ref=f13e217]: "`bool`"
          - text: (불리언)
        - listitem [ref=f13e218]:
          - text: 조건문(
          - code [ref=f13e219]: "`if`"
          - text: /
          - code [ref=f13e220]: "`elif`"
          - text: /
          - code [ref=f13e221]: "`else`"
          - text: )은 조건에 따라 다른 코드를 실행하는 갈림길이다
        - listitem [ref=f13e222]:
          - text: 반복문(
          - code [ref=f13e223]: "`for`"
          - text: )은 리스트의 값을 하나씩 꺼내 같은 코드를 반복하는 컨베이어벨트다
        - listitem [ref=f13e224]: 숫자와 문자열은 자동으로 섞이지 않으며 f-string으로 안전하게 합쳐야 한다
      - paragraph [ref=f13e225]:
        - strong [ref=f13e226]: 이 레슨의 단어
      - table [ref=f13e227]:
        - rowgroup [ref=f13e228]:
          - row [ref=f13e229]:
            - columnheader "단어" [ref=f13e230]
            - columnheader "뜻" [ref=f13e231]
        - rowgroup [ref=f13e232]:
