              - text: 표
          - row [ref=e51]:
            - cell "줄(행)" [ref=e52]
            - cell "행(레코드)" [ref=e53]
            - cell "학생 한 명" [ref=e54]
          - row [ref=e55]:
            - cell "칸(열)" [ref=e56]
            - cell "열(컬럼)" [ref=e57]
            - cell [ref=e58]:
              - code [ref=e59]: "`name`"
              - text: (이름),
              - code [ref=e60]: "`grade`"
              - text: (학년)
      - heading "🔑 기본키 — 누가 누구인지 가리는 이름표" [level=3] [ref=e61]
      - paragraph [ref=e62]: 기본키(primary key, 표 안에서 각 행을 유일하게 구분하는 값)가 없으면 이름이 같은 학생 두 명을 구분할 방법이 없습니다. 그래서 표를 만들 때 절대 중복되지 않는 값(보통 자동으로 늘어나는 번호)을 한 열에 정해두고, 그 열을 기본키로 지정합니다. 어떤 행을 콕 집어 가리키고 싶을 땐 항상 이 값을 씁니다.
      - heading "🧵 외래키 — 두 표를 잇는 실" [level=3] [ref=e63]
      - paragraph [ref=e64]: 외래키(foreign key, 다른 표의 기본키를 가리켜 두 표를 연결하는 값)는 한 표의 열이 다른 표의 기본키를 가리키게 만드는 방법입니다. 학생 표와 과목 표를 직접 잇는 대신, 그 사이에 "누가 어떤 과목을 듣는지"를 적는 수강 표를 하나 더 두고 두 개의 외래키로 양쪽을 가리키게 합니다.
      - paragraph [ref=e65]:
        - code [ref=e66]: "`학생 → 수강 → 과목`"
      - heading "🗄️ 스키마 — 표들을 담는 서랍" [level=3] [ref=e67]
      - paragraph [ref=e68]:
        - text: 스키마(schema, 여러 테이블을 묶어 담는 이름 붙은 서랍)는 테이블들을 그룹으로 묶는 이름표입니다. 이 사이트의 진도 데이터는 같은 Supabase 프로젝트의 다른 서랍(공유 스키마)에 들어 있습니다. 이번 실습은 그 서랍을 절대 건드리지 않도록,
        - code [ref=e69]: "`practice`"
        - text: 라는 연습용 서랍을 따로 만들어 그 안에서만 표를 만들고 지웁니다.
      - heading "4. 실무 예제" [level=2] [ref=e70]
      - paragraph [ref=e71]: 아래 SQL을 순서대로 Supabase 대시보드의 SQL 에디터에 붙여넣고 실행하면, 서로 연결된 표 세 개를 세우고 데이터를 넣어 확인하는 과정을 전부 브라우저에서 끝낼 수 있습니다.
      - figure [ref=e72]:
        - code [ref=e74]:
          - generic [ref=e75]: "-- Supabase 대시보드 → SQL 에디터에서 실행합니다."
          - generic [ref=e76]: "-- 이 블록은 연습용 서랍(practice 스키마) 안에서만 동작하며, 사이트 진도 데이터와는 무관합니다."
          - generic [ref=e77]: CREATE SCHEMA IF NOT EXISTS practice;
          - generic [ref=e79]: CREATE TABLE practice.students (
          - generic [ref=e80]: id serial PRIMARY KEY,
          - generic [ref=e81]: name text NOT NULL,
          - generic [ref=e82]: grade int
          - generic [ref=e83]: );
          - generic [ref=e85]: CREATE TABLE practice.subjects (
          - generic [ref=e86]: id serial PRIMARY KEY,
          - generic [ref=e87]: name text NOT NULL
          - generic [ref=e88]: );
          - generic [ref=e90]: CREATE TABLE practice.enrollments (
          - generic [ref=e91]: id serial PRIMARY KEY,
          - generic [ref=e92]: student_id int NOT NULL REFERENCES practice.students(id),
          - generic [ref=e93]: subject_id int NOT NULL REFERENCES practice.subjects(id)
          - generic [ref=e94]: );
          - button "Copy code" [ref=e95]
