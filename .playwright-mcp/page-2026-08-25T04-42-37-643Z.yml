      - heading "2. 왜 배우나" [level=2] [ref=e31]
      - paragraph [ref=e32]: 앞 레슨에서 파일에 데이터를 저장해봤다면, 데이터가 많아질수록 찾기 어렵고 중복이 쌓이고 여러 사람이 동시에 고치면 꼬인다는 걸 느꼈을 겁니다. 관계형 데이터베이스(relational database, 표들을 서로 연결해 데이터를 정리해 두는 저장소)는 이 문제를 표 여러 개로 나누고 서로 잇는 방식으로 풉니다. 이 커리큘럼에서 만들 서비스는 결국 전부 이 구조 위에 데이터를 쌓습니다. 이 레슨은 Supabase SQL 에디터라는 브라우저 화면에서 전부 실습하므로 아이패드만 있어도 됩니다.
      - heading "3. 개념 설명" [level=2] [ref=e33]
      - heading "📊 표 하나 = 테이블" [level=3] [ref=e34]
      - paragraph [ref=e35]:
        - text: 테이블(table, 같은 종류의 데이터를 모아두는 표)을 엑셀 시트라고 생각하면 쉽습니다. 시트 하나가 테이블 하나, 시트의 한 줄이 행(row, 표의 한 줄 — 레코드 하나) 하나, 시트의 세로 칸이 열(column, 표의 세로 칸 — 정해진 자료형을 가짐) 하나입니다. 다른 점은, 열마다 어떤 자료형(
        - code [ref=e36]: "`text`"
        - text: ","
        - code [ref=e37]: "`int`"
        - text: ","
        - code [ref=e38]: "`serial`"
        - text: 등)만 들어갈지 미리 정해둔다는 것입니다.
      - table [ref=e39]:
        - rowgroup [ref=e40]:
          - row [ref=e41]:
            - columnheader "엑셀" [ref=e42]
            - columnheader "데이터베이스" [ref=e43]
            - columnheader "예시" [ref=e44]
        - rowgroup [ref=e45]:
          - row [ref=e46]:
