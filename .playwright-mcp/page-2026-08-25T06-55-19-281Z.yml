            - cell "반복되는 처리를 이름 붙여 묶어 두는 코드 조각" [ref=f2e193]
          - row [ref=f2e194]:
            - cell "매개변수" [ref=f2e195]
            - cell "함수가 입력을 받기 위해 미리 정해둔 이름" [ref=f2e196]
          - row [ref=f2e197]:
            - cell "인자" [ref=f2e198]
            - cell "함수를 호출할 때 실제로 넘기는 값" [ref=f2e199]
