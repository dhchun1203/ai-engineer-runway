      - paragraph [ref=f2e25]: 이 레슨을 마치면 다음을 할 수 있습니다.
      - list [ref=f2e26]:
        - listitem [ref=f2e27]: 반복되는 처리를 함수로 묶어 이름을 붙일 수 있다
        - listitem [ref=f2e28]: 함수에 값을 넘기고 결과를 돌려받는 흐름을 설명할 수 있다
        - listitem [ref=f2e29]:
          - text: 예상 가능한 실패를
          - code [ref=f2e30]: "`try`"
          - text: /
          - code [ref=f2e31]: "`except`"
